// Deferred rendering compatibility patch for EDBMods/FutureTech parts.
//
// Root cause: EDB TU configs use SSTU/PBR/Metallic shader. The Deferred
// renderer (zzz_Deferred) does not classify this shader as opaque, so
// affected parts render as transparent (see-through ghost effect).
//
// Fix: replace SSTU/PBR/Metallic with TU/Metallic, which is
// TexturesUnlimited's own PBR metallic shader. It accepts identical
// properties (_Color, _Metal, _Smoothness) so appearance is unchanged.
//
// Scope: any KSP_MODEL_SHADER node anywhere that still uses SSTU/PBR/Metallic.
// Intentionally broad so it catches any other mods with the same issue.

@KSP_MODEL_SHADER[*]:HAS[@TEXTURE:HAS[#shader[SSTU/PBR/Metallic]]]:NEEDS[TexturesUnlimited,zzz_Deferred]
{
	@TEXTURE,*:HAS[#shader[SSTU/PBR/Metallic]]
	{
		@shader = TU/Metallic
	}
}
