// Kerbalism science experiment wiring for Bluedog Design Bureau.
// Replaces ModuleScienceExperiment with Kerbalism's Experiment module on all bd_ parts.
// Data rates and durations are calibrated against RP-1 experiment tiers.
//
// Pass order (same as RP-1 Science files):
//   FOR[RP-0]              → add KERBALISM_EXPERIMENT to EXPERIMENT_DEFINITIONs
//   FOR[RP-0-Kerbalism]    → replace ModuleScienceExperiment → Experiment on parts
//   AFTER[RP-0-Kerbalism]  → configure data_rate, ec_rate, requires

// ============================================================
// 1 — ADD KERBALISM_EXPERIMENT TO EXPERIMENT_DEFINITIONS
// ============================================================

// --- Simple passive sensors ---
@EXPERIMENT_DEFINITION:HAS[#id[bd_GeigerCounter]]:NEEDS[Bluedog_DB,Kerbalism]:FOR[RP-0]
{
	KERBALISM_EXPERIMENT { SampleMass = 0; IncludeExperiment = }
}
