// ============================================================
// 3 — CONFIGURE EXPERIMENT PARAMETERS
// ============================================================

@PART[*]:HAS[@MODULE[Experiment]]:NEEDS[Bluedog_DB,Kerbalism]:AFTER[RP-0-Kerbalism]
{
	// Passive radiation/particle counters — very low EC, long duration, small data
	@MODULE[Experiment]:HAS[#experiment_id[bd_GeigerCounter]]
	{
		%ec_rate = 0.001
		%data_rate = 0.5		// 0.5 Mb total
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = A Geiger-Müller tube sensitive to beta and gamma radiation. Maps the radiation environment in orbit and around planetary bodies. Based on instruments flown on Explorer 1 and early Pioneer spacecraft.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_cosmicRay]]
	{
		%ec_rate = 0.001
		%data_rate = 1.0		// 1 Mb total
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = An advanced cosmic ray detector using plastic scintillators and photomultiplier tubes to measure the flux and energy spectrum of high-energy protons and heavy nuclei. Based on instruments on Pioneer 10/11 and Voyager.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_TrappedRadiation]]
	{
		%ec_rate = 0.002
		%data_rate = 1.0		// 1 Mb total
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = A charged-particle telescope measuring proton and electron populations in radiation belts. Maps Van Allen belt structure and dynamics. Based on instruments on Explorer 45 and the Radiation Belt Storm Probes.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_ionElec]]
	{
		%ec_rate = 0.002
		%data_rate = 1.0		// 1 Mb total
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = An electrostatic analyser measuring the energy and angular distribution of solar-wind ions and electrons. Provides in-situ plasma data for the solar wind and magnetospheric boundary conditions. Based on instruments on ISEE-1 and Ulysses.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_solarWind]]
	{
		%ec_rate = 0.002
		%data_rate = 0.5		// 0.5 Mb total
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = A Faraday cup measuring solar-wind bulk velocity, density, and temperature. Pioneered by MIT on Mariner 2 (1962). Sensitive to ion fluxes in the low-energy range from ~100 eV to ~10 keV.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_dust]]
	{
		%ec_rate = 0.001
		%data_rate = 0.3		// 0.3 Mb total
		@data_rate /= 86400		// over 24 hours
		%requires =
		%resources =
		%experiment_desc = A micrometeorite detector using piezoelectric sensors to register impact momentum and flux. Based on the Helios Micrometeorite Detector (1974–76), which measured the dust flux between 0.3 and 1 AU from the Sun.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_pegasus]]
	{
		%ec_rate = 0.002
		%data_rate = 0.5		// 0.5 Mb total
		@data_rate /= 43200		// over 12 hours
		%requires =
		%resources =
		%experiment_desc = A large-area micrometeoroid penetration detector using capacitor panels to measure particle flux, mass, and directionality in Earth orbit. Based on the Pegasus meteoroid detection satellites (1965).
	}
	@MODULE[Experiment]:HAS[#experiment_id[logIonTrap]]
	{
		%ec_rate = 0.001
		%data_rate = 0.3		// 0.3 Mb total
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = A hemispherical ion trap measuring the low-energy plasma environment. Characterises ion density and temperature for satellite charging studies.
	}
	@MODULE[Experiment]:HAS[#experiment_id[logmmImpacts]]
	{
		%ec_rate = 0.001
		%data_rate = 0.3		// 0.3 Mb total
		@data_rate /= 86400		// over 24 hours
		%requires =
		%resources =
		%experiment_desc = A passive micrometeorite impact detector logging event count, timing, and estimated mass flux. Data is transmitted periodically.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_Photometer]]
	{
		%ec_rate = 0.01
		%data_rate = 0.5		// 0.5 Mb total
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = A photomultiplier-based photometer measuring solar intensity and stellar occultations. Based on instruments on Helios A/B (1974–76) designed to study zodiacal light and photospheric emissions.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_magScan]]
	{
		%ec_rate = 0.002
		%data_rate = 0.5		// 0.5 Mb total
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = A fluxgate magnetometer measuring the vector magnetic field. Maps the interplanetary and planetary magnetic environment. Based on instruments on Mariner 4, Pioneer 10/11, and early Explorer satellites.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_rpws]]
	{
		%ec_rate = 0.02
		%data_rate = 1.0		// 1 Mb total
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = A radio and plasma wave instrument using electric and magnetic antennae to measure wave activity in the frequency range 10 Hz to 16 MHz. Based on the RPWS instrument on Cassini and the PWS on Voyager 1/2.
	}

	// Spectrometers / radiometers
	@MODULE[Experiment]:HAS[#experiment_id[bd_IRradiometer]]
	{
		%ec_rate = 0.05
		%data_rate = 5.0		// 5 Mb total
		@data_rate /= 43200		// over 12 hours
		%requires =
		%resources =
		%experiment_desc = A scanning infrared radiometer measuring thermal emission from planetary surfaces and atmospheres in 2–25 µm. Based on instruments on ITOS/NOAA weather satellites and Mariner 9's IRIS.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_IRspec]]
	{
		%ec_rate = 0.1
		%data_rate = 10.0		// 10 Mb total
		@data_rate /= 43200		// over 12 hours
		%requires =
		%resources =
		%experiment_desc = An infrared Michelson interferometer spectrometer measuring thermal emission spectra for atmospheric composition and temperature sounding. Based on IRIS on Nimbus 3 and Mariner 9 (1971).
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_UVspec]]
	{
		%ec_rate = 0.1
		%data_rate = 5.0		// 5 Mb total
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = A UV spectrometer covering 110–400 nm measuring atmospheric ozone, airglow, and stellar UV flux. Based on instruments on Nimbus 7/BUV and OAO-1/2. Particularly effective for probing upper atmospheres.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_gammaRay]]
	{
		%ec_rate = 0.02
		%data_rate = 2.0		// 2 Mb total
		@data_rate /= 43200		// over 12 hours
		%requires =
		%resources =
		%experiment_desc = A NaI(Tl) scintillation spectrometer detecting gamma-ray lines (0.3–10 MeV) from planetary surfaces to determine elemental composition. Based on the Apollo SIM Bay Gamma-Ray Spectrometer and the MGS GRS instrument.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_massSpec]]
	{
		%ec_rate = 0.05
		%data_rate = 2.0		// 2 Mb total
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = A quadrupole mass spectrometer analysing in-situ gas composition at 1–300 amu. Characterises atmospheric and exospheric neutral gas populations. Based on instruments on Viking and the Apollo CSM.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_microwaveSpec]]
	{
		%ec_rate = 0.1
		%data_rate = 5.0		// 5 Mb total
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = A passive microwave spectrometer (6–37 GHz) measuring atmospheric water vapour, temperature profiles, and surface emissivity. Based on the SMMR on Nimbus 7 and SSM/I on DMSP.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_XrayImaging]]
	{
		%ec_rate = 0.3
		%data_rate = 20.0		// 20 Mb total
		@data_rate /= 43200		// over 12 hours
		%requires =
		%resources =
		%experiment_desc = A coded-aperture X-ray imaging telescope covering 1–30 keV for mapping astrophysical sources and solar X-ray emission. Based on instruments on HEAO-1 and early solar X-ray telescopes.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_hydrometer]]
	{
		%ec_rate = 0.05
		%data_rate = 1.0		// 1 Mb total
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = A passive L-band radiometer measuring surface and sub-surface soil moisture through microwave emission differences. Based on the SMOS mission concept and earlier Nimbus radiometer work.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_multiSpec]]
	{
		%ec_rate = 0.5
		%data_rate = 30.0		// 30 Mb total
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = A multi-band spectral imager covering visible to near-infrared wavelengths for surface mineralogy mapping. Based on CRISM on MRO and OMEGA on Mars Express.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_SoilMoisture]]
	{
		%ec_rate = 0.1
		%data_rate = 10.0		// 10 Mb total
		@data_rate /= 43200		// over 12 hours
		%requires =
		%resources =
		%experiment_desc = A passive multi-frequency microwave radiometer measuring soil moisture through differential emissivity between wet and dry regolith. Based on the SMMR and SSM/I instruments on Nimbus 7 and DMSP satellites.
	}

	// Telescopes / large imagers
	@MODULE[Experiment]:HAS[#experiment_id[bd_UVscope]]
	{
		%ec_rate = 0.2
		%data_rate = 20.0		// 20 Mb total
		@data_rate /= 86400		// over 24 hours
		%requires =
		%resources =
		%experiment_desc = A high-resolution UV telescope covering 912–3200 Å for stellar UV spectroscopy and interstellar medium studies. Based on OAO-3 "Copernicus" (1972), which surveyed interstellar absorption lines at unprecedented resolution.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_oso]]
	{
		%ec_rate = 0.5
		%data_rate = 30.0		// 30 Mb total
		@data_rate /= 86400		// over 24 hours
		%requires =
		%resources =
		%experiment_desc = A solar telescope measuring X-ray and UV emission from the solar corona and chromosphere. Based on the OSO series (1962–75) and the Apollo Telescope Mount on Skylab, which provided the most detailed solar observations of the early space age.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_atm]]
	{
		%ec_rate = 1.0
		%data_rate = 50.0		// 50 Mb total
		@data_rate /= 86400		// over 24 hours
		%requires =
		%resources =
		%experiment_desc = The Apollo Telescope Mount solar observatory, a collection of eight separate instruments in UV, X-ray, and Hα wavelengths. Operated by astronauts on Skylab (1973–74) and produced more than 150,000 solar images, revolutionising understanding of the corona.
		%crew_operate = CrewOnly
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_orbitalScope]]
	{
		%ec_rate = 2.0
		%data_rate = 200.0		// 200 Mb total
		@data_rate /= 604800		// over 7 days
		%requires =
		%resources =
		%experiment_desc = The Skylab Earth Observation System, a suite of cameras and sensors for Earth resources imaging. Multispectral, IR, and microwave channels supported geological mapping, crop identification, and oceanographic studies.
		%crew_operate = CrewOnly
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_kepler]]
	{
		%ec_rate = 1.0
		%data_rate = 1000.0		// 1 GB total
		@data_rate /= 2592000		// over 30 days
		%requires =
		%resources =
		%experiment_desc = A wide-field photometric telescope monitoring stellar brightness with sub-millimagnitude precision to detect exoplanetary transits. Based on the Kepler Space Telescope (2009–2018), which discovered more than 2,600 confirmed exoplanets.
	}

	// Cameras / imaging
	@MODULE[Experiment]:HAS[#experiment_id[bd_camera]]
	{
		%SampleMass = 0.001
		%ec_rate = 0.05
		%data_rate = 10.0		// 10 Mb film equivalent
		@data_rate /= 1800		// exposed over 30 minutes
		%requires =
		%resources =
		%experiment_desc = An orbital film camera taking high-resolution photographs of terrain and targets of interest. Film must be physically recovered. Based on instruments on early Ranger and Lunar Orbiter spacecraft.
		allow_shrouded = false
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_surveillance]]
	{
		%ec_rate = 0.5
		%data_rate = 50.0		// 50 Mb total
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = A digital electro-optical reconnaissance imager providing ground resolution sufficient for identification of military installations and vehicle types. Imagery is digitised and transmitted in near-real time. Based on the KH-11 and later Block I-IV electro-optical satellites.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_SIGINT]]
	{
		%ec_rate = 0.5
		%data_rate = 20.0		// 20 Mb total
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = A broad-band radio receiver array intercepting electromagnetic emissions for frequency characterisation and geo-location. Passive detection only. Based on early SIGINT satellites such as the GRAB/POPPY series (1960–77).
	}

	// Radar / mapping
	@MODULE[Experiment]:HAS[#experiment_id[bd_mapping]]
	{
		%ec_rate = 0.5
		%data_rate = 100.0		// 100 Mb total
		@data_rate /= 86400		// over 24 hours
		%requires =
		%resources =
		%experiment_desc = A synthetic-aperture or side-looking radar imaging system producing topographic maps independent of cloud cover or illumination. Based on Seasat (1978) and the Magellan radar mapper at Venus.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_radarAltimeter]]
	{
		%ec_rate = 0.5
		%data_rate = 10.0		// 10 Mb total
		@data_rate /= 43200		// over 12 hours
		%requires =
		%resources =
		%experiment_desc = A nadir-pointing radar measuring surface elevation by round-trip pulse timing. Provides global topographic profiles with metre-level vertical accuracy. Based on the Ranger Block III altimeter and the GEOS-3/Seasat instruments.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_Scatterometer]]
	{
		%ec_rate = 1.0
		%data_rate = 20.0		// 20 Mb total
		@data_rate /= 43200		// over 12 hours
		%requires =
		%resources =
		%experiment_desc = A multi-beam radar scatterometer measuring ocean surface roughness to derive wind speed and direction. Based on the SeaWinds instrument on QuikSCAT and the AMI on ERS-1/2.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_weather]]
	{
		%ec_rate = 0.1
		%data_rate = 5.0		// 5 Mb total
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = A visible and infrared spin-scan camera system imaging global cloud cover and weather patterns. Based on the ATS and GOES series of geostationary meteorological satellites.
	}

	// Biology / life sciences
	@MODULE[Experiment]:HAS[#experiment_id[bd_bioexp]]
	{
		%ec_rate = 0.05
		%data_rate = 5.0		// 5 Mb total
		@data_rate /= 604800		// over 7 days
		%requires =
		%resources =
		%experiment_desc = A life sciences package studying the effects of microgravity and radiation on living organisms (seed germination, fungal growth, insect development). Based on Bios-1 and Biosatellite experiments of the 1960s–70s. Crew observation optional.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_GooLab]]
	{
		%ec_rate = 0.05
		%data_rate = 1.0		// 1 Mb total
		@data_rate /= 43200		// over 12 hours
		%requires =
		%resources =
		%experiment_desc = A fluid dynamics and surface-tension experiment exposing a viscous sample to the microgravity environment and monitoring its behaviour. Generic analogue for early materials science in orbit.
		%crew_operate = CrewOnly
	}

	// Surface operations
	@MODULE[Experiment]:HAS[#experiment_id[bd_drill]]
	{
		%SampleMass = 0.001
		%ec_rate = 2.0
		%data_rate = 1.0		// 1 Mb drilling telemetry
		@data_rate /= 7200		// over 2 hours
		%requires = SurfaceVessel
		%resources =
		%experiment_desc = A rotary-percussive core drill recovering a continuous stratigraphic sample from 1–3 m depth. Based on the Apollo Lunar Surface Drill used on Apollo 15, 16, and 17. Core samples reveal thermal gradients and geological layering.
		%crew_operate = CrewOnly
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_soilScoop]]
	{
		%SampleMass = 0.0005
		%ec_rate = 0.5
		%data_rate = 0.5		// 0.5 Mb imagery
		@data_rate /= 600		// over 10 minutes
		%requires = SurfaceVessel
		%resources =
		%experiment_desc = A motorised surface scoop exposing subsurface material for imaging and later laboratory analysis. Based on the Viking soil sampler and the Surveyor surface sampler. Reveals bearing strength and compositional layering.
		%crew_operate = CrewOnly
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_poke]]
	{
		%ec_rate = 0.1
		%data_rate = 0.5		// 0.5 Mb
		@data_rate /= 300		// over 5 minutes
		%requires = SurfaceVessel
		%resources =
		%experiment_desc = A spring-loaded penetrometer measuring soil bearing strength and compaction as a function of depth. Based on the ALSEP Self-Recording Penetrometer and the Surveyor footpad force sensor. Provides geotechnical data for landing-site assessment.
		%crew_operate = CrewOnly
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_XRayDiffract]]
	{
		%SampleMass = 0.00005
		%ec_rate = 0.5
		%data_rate = 2.0		// 2 Mb diffraction patterns
		@data_rate /= 1800		// over 30 minutes
		%requires = SurfaceVessel
		%resources =
		%experiment_desc = An X-ray diffraction and X-ray fluorescence analyser characterising mineralogy and elemental composition directly from a scraped surface. Based on the MSL CheMin instrument and Mars Pathfinder APXS. Identifies crystal structures non-destructively.
		%crew_operate = CrewOnly
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_SiteSurvey]]
	{
		%ec_rate = 0.5
		%data_rate = 5.0		// 5 Mb panoramic imagery
		@data_rate /= 7200		// over 2 hours
		%requires =
		%resources =
		%experiment_desc = A comprehensive photographic site survey using a multi-spectral camera to record terrain context, rock distribution, and engineering hazards. Based on the Viking lander camera system and Surveyor panoramic imager.
	}

	// ALSEP instruments
	@MODULE[Experiment]:HAS[#experiment_id[bd_ALSEP_ActiveSeismic]]
	{
		%ec_rate = 0.5
		%data_rate = 5.0		// 5 Mb seismic records
		@data_rate /= 3600		// over 1 hour (thumper sequence + geophone data)
		%requires = SurfaceVessel
		%resources =
		%experiment_desc = The Active Seismic Experiment from ALSEP (Apollo 14 & 16). Three-component geophones recorded P- and S-waves from explosive thumper impacts to profile the shallow lunar crust to ~500 m depth. Revealed a regolith layer 4–9 m thick overlying fractured ejecta.
		%crew_operate = CrewOnly
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_ALSEP_Camera]]
	{
		%ec_rate = 0.1
		%data_rate = 1.0		// 1 Mb TV frames
		@data_rate /= 600		// over 10 minutes
		%requires = SurfaceVessel
		%resources =
		%experiment_desc = The ALSEP ground-commanded slow-scan TV camera (colour on later missions) used for astronaut monitoring, instrument status checks, and geological context photography during EVAs.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_ALSEP_CPLEE]]
	{
		%ec_rate = 0.01
		%data_rate = 1.0		// 1 Mb
		@data_rate /= 21600		// over 6 hours
		%requires = SurfaceVessel
		%resources =
		%experiment_desc = The Charged Particle Lunar Environment Experiment from Apollo 14 (CPLEE). Measured differential fluxes of protons and electrons at the lunar surface (both direct solar wind and reflection from the Earth's magnetosphere), discovering that the Moon is directly exposed to the solar wind for ~75 % of the time.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_ALSEP_Gravimeter]]
	{
		%ec_rate = 0.005
		%data_rate = 1.0		// 1 Mb
		@data_rate /= 86400		// over 24 hours
		%requires = SurfaceVessel
		%resources =
		%experiment_desc = The Lunar Surface Gravimeter from Apollo 17. A LaCoste-Romberg gravimeter sensitive to g variations of 10⁻⁸ m/s², designed to detect free oscillations of the Moon and measure tidal deformation. Constrained the lunar moment of inertia and bulk density distribution.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_ALSEP_HeatFlow]]
	{
		%ec_rate = 0.01
		%data_rate = 2.0		// 2 Mb
		@data_rate /= 86400		// over 24 hours
		%requires = SurfaceVessel
		%resources =
		%experiment_desc = The Heat Flow Experiment from Apollo 15 & 17. Two thermocouple probes emplaced ~1.5 m into the regolith measured the temperature gradient and thermal conductivity. Heat flow values of 21–38 mW/m² suggested the Moon is more radioactive than expected.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_ALSEP_LRRR]]
	{
		%ec_rate = 0.001
		%data_rate = 0.5		// 0.5 Mb ranging record
		@data_rate /= 21600		// over 6 hours of Earth ranging sessions
		%requires = SurfaceVessel
		%resources =
		%experiment_desc = The Laser Ranging Retro-Reflector (LRRR) placed on Apollo 11, 14, and 15. An array of corner-cube prisms passively reflects laser pulses from Earth observatories with ~3 mm range precision. Continues to operate to this day, measuring lunar libration and relativity.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_ALSEP_Magnetometer]]
	{
		%ec_rate = 0.01
		%data_rate = 1.0		// 1 Mb
		@data_rate /= 43200		// over 12 hours
		%requires = SurfaceVessel
		%resources =
		%experiment_desc = The Lunar Surface Magnetometer from Apollo 12, 15, and 16. Measured residual crustal magnetic fields (~6–327 nT depending on site) and monitored solar-wind magnetic fluctuations. Revealed localised remanent magnetism inconsistent with a global dynamo.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_ALSEP_Meteorite]]
	{
		%SampleMass = 0.0001
		%ec_rate = 0.01
		%data_rate = 0.5		// 0.5 Mb event logs
		@data_rate /= 86400		// over 24 hours
		%requires = SurfaceVessel
		%resources =
		%experiment_desc = The Cosmic Dust Detector / Ejecta and Meteorites Experiment from Apollo 17 (LEAM). Measured micrometeoroid flux, mass distribution, and impact velocity at the lunar surface. Also collected micro-ejecta from nearby impacts.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_ALSEP_RadioTelescope]]
	{
		%ec_rate = 0.1
		%data_rate = 5.0		// 5 Mb
		@data_rate /= 86400		// over 24 hours
		%requires = SurfaceVessel
		%resources =
		%experiment_desc = A compact radio telescope deployed on the surface to observe low-frequency (0.03–3 MHz) radio emissions shielded by Earth's ionosphere. The Moon's far side provides the only natural radio-quiet environment near Earth. Based on the proposed RAE-C lunar farside concept.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_ALSEP_SEP]]
	{
		%ec_rate = 0.05
		%data_rate = 2.0		// 2 Mb
		@data_rate /= 21600		// over 6 hours
		%requires = SurfaceVessel
		%resources =
		%experiment_desc = The Surface Electrical Properties Experiment from Apollo 17. A dipole transmitter/receiver pair measured electromagnetic wave propagation through the near-surface to depths of ~2 km, characterising the electrical conductivity (and hence water content) of the lunar crust.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_ALSEP_SolarWind]]
	{
		%ec_rate = 0.01
		%data_rate = 0.5		// 0.5 Mb
		@data_rate /= 43200		// over 12 hours
		%requires = SurfaceVessel
		%resources =
		%experiment_desc = The Solar Wind Spectrometer from Apollo 12 & 15. Seven Faraday cups measured the angle and energy distribution of solar-wind ions and electrons striking the lunar surface. Confirmed the Moon's direct exposure to the full solar wind.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_ALSEP_SWC]]
	{
		%SampleMass = 0.000005
		%ec_rate = 0.001
		%data_rate = 0.1		// 0.1 Mb deployment log
		@data_rate /= 21600		// deployed for 6 hours typical
		%requires = SurfaceVessel
		%resources =
		%experiment_desc = The Solar Wind Composition experiment flown on Apollo 11–16. An aluminium foil ~1.4 m² was deployed on an EVA, exposed to the solar wind for up to 77 hours, then rolled up and returned to Earth. Laboratory analysis revealed the He, Ne, Ar, Kr, and Xe isotopic composition of the solar wind.
		%crew_operate = CrewOnly
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_ALSEP_Telescope]]
	{
		%ec_rate = 0.1
		%data_rate = 10.0		// 10 Mb
		@data_rate /= 86400		// over 24 hours
		%requires = SurfaceVessel
		%resources =
		%experiment_desc = The Far UV Camera/Spectrograph deployed on Apollo 16 (1972). A 75 mm f/1 Schmidt telescope sensitive to 300–1600 Å imaged nebulae, galaxies, the Earth's geocorona, and stellar spectra without atmospheric absorption. First astronomical observatory on the Moon.
	}
	@MODULE[Experiment]:HAS[#experiment_id[bd_ALSEP_UVscope]]
	{
		%ec_rate = 0.05
		%data_rate = 5.0		// 5 Mb
		@data_rate /= 43200		// over 12 hours
		%requires = SurfaceVessel
		%resources =
		%experiment_desc = A compact UV photometric telescope measuring zodiacal light, gegenschein, and stellar UV flux from the lunar surface, free of atmospheric contamination. Provides baseline UV sky brightness measurements unavailable from Earth.
	}
}
