// Supplementary Kerbalism patch for Bluedog Design Bureau.
//
// BDB parts often carry DMModuleScienceAnimateGeneric as their *only* science
// module (no ModuleScienceExperiment).  Without DMagicOrbitalScience installed
// that class is unknown to KSP and the module does nothing — parts appear to
// have experiments in the editor but nothing happens in-flight.
//
// This file deletes DMModuleScienceAnimateGeneric on all BDB parts (for every
// experiment ID in the mod) and replaces it with Kerbalism's Experiment module,
// mirroring exactly what fix-Bluedog_DB_Kerbalism.cfg does for the stock
// ModuleScienceExperiment module.
//
// Pass order: both files run at FOR[RP-0-Kerbalism].
// fix-Bluedog_DB_Kerbalism.cfg sorts before this file alphabetically so it
// fires first — parts that already got an Experiment module from that pass
// get the DMSci module cleaned up here without a duplicate being added
// (we explicitly delete any pre-existing Experiment for the same ID first,
// then add a fresh one; the AFTER[RP-0-Kerbalism] configure pass re-applies
// parameters either way).

// ============================================================
// REPLACE DMModuleScienceAnimateGeneric → Kerbalism Experiment
// ============================================================

// --- Simple passive sensors ---

@PART[*]:HAS[@MODULE[DMModuleScienceAnimateGeneric]:HAS[#experimentID[bd_GeigerCounter]]]:NEEDS[Bluedog_DB,Kerbalism]:FOR[RP-0-Kerbalism]
{
	!MODULE[DMModuleScienceAnimateGeneric]:HAS[#experimentID[bd_GeigerCounter]] {}
	!MODULE[Experiment]:HAS[#experiment_id[bd_GeigerCounter]] {}
	MODULE
	{
		name = Experiment
		experiment_id = bd_GeigerCounter
	}
}
