// Kerbalism science wiring for HabTech2 (ISS parts mod).
// AMS, MCE, SEDA, and magnetometer (FPMU) are modelled on real ISS instruments.
// All are long-duration experiments typical of ISS science operations.

// ============================================================
// 1 — KERBALISM_EXPERIMENT NODES
// ============================================================

@EXPERIMENT_DEFINITION:HAS[#id[AMS]]:NEEDS[HabTech2,Kerbalism]:FOR[RP-0]
{
	// Alpha Magnetic Spectrometer (AMS-02): cosmic ray/antimatter detector
	KERBALISM_EXPERIMENT { SampleMass = 0; IncludeExperiment = }
}
@EXPERIMENT_DEFINITION:HAS[#id[MCE]]:NEEDS[HabTech2,Kerbalism]:FOR[RP-0]
{
	KERBALISM_EXPERIMENT { SampleMass = 0; IncludeExperiment = }
}
@EXPERIMENT_DEFINITION:HAS[#id[SEDA]]:NEEDS[HabTech2,Kerbalism]:FOR[RP-0]
{
	KERBALISM_EXPERIMENT { SampleMass = 0; IncludeExperiment = }
}

// ============================================================
// 2 — REPLACE ModuleScienceExperiment → Experiment
// ============================================================

@PART[*]:HAS[@MODULE[ModuleScienceExperiment]:HAS[#experimentID[AMS]]]:NEEDS[HabTech2,Kerbalism]:FOR[RP-0-Kerbalism]
{
	!MODULE[ModuleScienceExperiment]:HAS[#experimentID[AMS]] {}
	MODULE
	{
		name = Experiment
		experiment_id = AMS
	}
}
@PART[*]:HAS[@MODULE[ModuleScienceExperiment]:HAS[#experimentID[MCE]]]:NEEDS[HabTech2,Kerbalism]:FOR[RP-0-Kerbalism]
{
	!MODULE[ModuleScienceExperiment]:HAS[#experimentID[MCE]] {}
	MODULE
	{
		name = Experiment
		experiment_id = MCE
	}
}
@PART[*]:HAS[@MODULE[ModuleScienceExperiment]:HAS[#experimentID[SEDA]]]:NEEDS[HabTech2,Kerbalism]:FOR[RP-0-Kerbalism]
{
	!MODULE[ModuleScienceExperiment]:HAS[#experimentID[SEDA]] {}
	MODULE
	{
		name = Experiment
		experiment_id = SEDA
	}
}

// ============================================================
// 3 — CONFIGURE PARAMETERS
// ============================================================

@PART[*]:HAS[@MODULE[Experiment]]:NEEDS[HabTech2,Kerbalism]:AFTER[RP-0-Kerbalism]
{
	@MODULE[Experiment]:HAS[#experiment_id[AMS]]
	{
		// AMS-02 uses 2.5 kW average; accumulates ~18 GB/year of particle data
		// Scale: 5000 Mb / 1 year (31,536,000 s)
		%ec_rate = 2.5
		%data_rate = 5000.0		// ~5 GB total per science cycle
		@data_rate /= 31536000		// over 1 year
		%requires =
		%resources =
		%experiment_desc = The Alpha Magnetic Spectrometer AMS-02, installed on the ISS S3 truss in 2011. A 7.5-tonne permanent magnet spectrometer measures cosmic ray particle type, charge, momentum, and energy from 0.5 GeV to a few TeV. Has detected excess positrons suggesting dark matter annihilation and confirmed the near-absence of anti-helium in cosmic rays.
	}
	@MODULE[Experiment]:HAS[#experiment_id[MCE]]
	{
		// JEM Small Exposed Experiment Module (J-SSOD adjacent platform)
		// Multi-experiment package; generates moderate data continuously
		%ec_rate = 0.5
		%data_rate = 100.0		// 100 Mb per 30-day cycle
		@data_rate /= 2592000		// over 30 days
		%requires =
		%resources =
		%experiment_desc = The JEM Multi-mission Consolidated Equipment (J-MCE). A compact platform on the JEM Exposed Facility hosting multiple small experiments simultaneously — radiation dosimeters, material exposure samples, and plasma environment monitors. Based on the MCE package launched on HTV-2 in 2011.
	}
	@MODULE[Experiment]:HAS[#experiment_id[SEDA]]
	{
		// SEDA-AP: Space Environment Data Acquisition — cosmic ray and
		// neutron monitor suite on the JEM Exposed Facility
		%ec_rate = 0.3
		%data_rate = 50.0		// 50 Mb per 30-day cycle
		@data_rate /= 2592000		// over 30 days
		%requires =
		%resources =
		%experiment_desc = The Space Environment Data Acquisition facility (SEDA-AP), installed on the JEM Exposed Facility in 2009. Nine instruments measure neutron flux, high-energy charged particles, plasma, atomic oxygen, and dust in low Earth orbit. Its neutron monitor complements AMS-02 radiation environment characterisation.
	}
}
