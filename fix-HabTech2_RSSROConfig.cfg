// Mark all HabTech2 parts as RO-supported so they appear in the VAB.
// RO's RO_HabTech2_modules.cfg and RO_HabTech2_truss.cfg only cover ~25 parts;
// the remaining ~70 are hidden by RO's zzzRealismOverhaul pass.

@PART[ht2_*]:AFTER[RealismOverhaul]
{
	%RSSROConfig = True
}

@PART[Garage|GarageMini]:AFTER[RealismOverhaul]
{
	%RSSROConfig = True
}
