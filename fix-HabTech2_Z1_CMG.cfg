// Fix ISS Z1 truss Control Moment Gyroscopes for RO.
//
// The existing RO_HabTech2_truss.cfg patch sets PitchTorque/YawTorque/RollTorque
// to 5 kN·m and EC to 0.8 EC/s. This patch:
//   1. Sets reactionWheelMode = CMG at PART level (the correct RO pattern —
//      see RO_RestockPlus_Control_Parts_Config.cfg for reference).
//   2. Sets reactionWheelPowerDraw = 1.7 at PART level (RO reads this to set
//      the EC draw on ModuleReactionWheel, overriding the module-level value).
//   3. Keeps torque at 5 kN·m — the realistic combined 4×HR-131 value of
//      1.0 kN·m is too sluggish for KSP on a 400 t RSS-scale station assembly.
//
// Real ISS Z1 CMG specs (4× Honeywell HR-131):
//   Torque per CMG : ~258 N·m  →  4 combined ≈ 1.0 kN·m
//   Power per CMG  : ~420 W    →  4 combined ≈ 1.68 kW → 1.7 EC/s

@PART[ht2_truss_Z1|ht2_truss_Z1_v2]:NEEDS[HabTech2]:AFTER[RealismOverhaul]
{
	%reactionWheelMode = CMG			// RO part-level field
	%reactionWheelPowerDraw = 1.7		// 4 × ~420 W = 1,680 W ≈ 1.7 EC/s

	@MODULE[ModuleReactionWheel]
	{
		@PitchTorque = 5.0	// gameplay value — real 4×HR-131 combined = 1.0 kN·m
		@YawTorque   = 5.0
		@RollTorque  = 5.0
	}
}
