// RSS/RO config for HabTech2 parts omitted from the stock RO_HabTech2_modules.cfg.
//
// The existing RO_HabTech2_modules.cfg patch (FOR[RealismOverhaul]) covers the
// original HabTech2 module set with rescaleFactor = 1.81, but it was written
// before ht2_BEAM, ht2_bishop, and ht2_orb were added to the mod.  Those newer
// parts are stock-scale (size1 / 1.25 m nodes) and have no RSSROConfig, so they
// are invisible in the RSS/RO VAB.
//
// Scale rationale (rescaleFactor = 1.81):
//   All HabTech2 main modules use 1.81 to match their real-life diameters.  These
//   three parts share the same size1 node interface as the main modules' secondary
//   berths (CBM adapter ports on Tranquility, Unity, etc.).  Using the same factor
//   keeps node alignments consistent in the VAB after the main modules are scaled.
//
// Real-world references:
//   BEAM  — Bigelow Expandable Activity Module, launched 2016 on CRS-8.
//            Mass: 1,413 kg.  Stowed Ø 2.16 m × 1.77 m; expanded Ø 4.0 m × 4.0 m.
//   Bishop — NanoRacks (now Voyager Space) Commercial Airlock, launched 2021.
//            Mass: ~5,500 kg (module + rack hardware).  Ø ~2.4 m.
//   HT-ORB — Represents the Prichal Nodal Module, launched 2021.
//            Mass: ~4,000 kg.  Spherical, 6 docking ports.

// ============================================================
// BEAM — Bigelow Expandable Activity Module
// ============================================================
@PART[ht2_BEAM]:NEEDS[HabTech2]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	!rescaleFactor,* = DEL
	%rescaleFactor = 1.81
	@maxTemp = 1073.15
	@skinMaxTemp = 1073.15
	@mass = 1.413
	@title = ISS BEAM (Bigelow Expandable Activity Module)
	@manufacturer = Bigelow Aerospace / NASA
	@description = The Bigelow Expandable Activity Module (BEAM) is an experimental expandable habitat berthed to the Tranquility node of the International Space Station. Launched aboard SpaceX CRS-8 in April 2016, it was originally planned as a two-year demonstration but NASA extended its stay indefinitely. In the expanded state BEAM provides approximately 16 m³ of pressurised volume. It is not permanently crewed but can be entered for periodic inspections and storage.
}

// ============================================================
// Bishop — NanoRacks Commercial Airlock ("Deacon" in HabTech2)
// ============================================================
@PART[ht2_bishop]:NEEDS[HabTech2]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	!rescaleFactor,* = DEL
	%rescaleFactor = 1.81
	@maxTemp = 1073.15
	@skinMaxTemp = 1073.15
	@mass = 5.5
	@title = ISS Bishop Airlock (NanoRacks Commercial Airlock)
	@manufacturer = NanoRacks / Voyager Space
	@description = The Bishop Airlock is NanoRacks' first commercial airlock on the ISS, delivered by SpaceX CRS-21 in December 2020 and installed on the Unity node. It supports CubeSat and small satellite deployment and EVA egress operations, providing commercial access to space for payloads that would otherwise require more complex crew EVAs.
}

// ============================================================
// HT-ORB — Prichal Nodal Module proxy
// ============================================================
@PART[ht2_orb]:NEEDS[HabTech2]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	!rescaleFactor,* = DEL
	%rescaleFactor = 1.81
	@maxTemp = 1073.15
	@skinMaxTemp = 1073.15
	@mass = 4.0
	@title = ISS Prichal Nodal Module
	@manufacturer = S.P. Korolev RSC Energia
	@description = The Prichal (Причал, "berth") spherical nodal module was launched in November 2021 attached to the Nauka MLM and provides six SSVP-M docking ports for Soyuz and Progress spacecraft. It forms the forward docking hub of the Russian segment. The spherical pressure hull gives unobstructed passage between all six ports.
}

// ============================================================
// PMA-C Compact (PMA_short) and PMA-S Straight (PMA_straight)
// — adapter variants not listed in RO_HabTech2_modules.cfg
// ============================================================
@PART[ht2_PMA_short|ht2_PMA_straight]:NEEDS[HabTech2]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	!rescaleFactor,* = DEL
	%rescaleFactor = 1.81
	@maxTemp = 1073.15
	@skinMaxTemp = 1073.15
}
