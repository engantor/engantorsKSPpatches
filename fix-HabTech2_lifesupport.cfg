// ============================================================
// Harmony / Tranquility — Node 2 + Node 3 (combined HabTech2 part)
// Tranquility contains the Water Recovery System (WRS): Urine Processor
// Assembly (UPA) and Water Processor Assembly (WPA).  The WRS buffers
// several hundred litres of grey/yellow water, so Water and WasteWater
// capacities are roughly doubled vs. the per-litre baseline.
// ============================================================
@PART[ht2_moduleHarmony]:NEEDS[HabTech2,Kerbalism]:AFTER[RealismOverhaul]
{
	@MODULE[ModuleFuelTanks]
	{
		TANK
		{
			name = Oxygen
			amount = 87500
			maxAmount = 175000
		}
		TANK
		{
			name = Food
			amount = 88
			maxAmount = 176
		}
		TANK
		{
			// WRS needs a large input/output water buffer on Node 3
			name = Water
			amount = 200
			maxAmount = 400
		}
		TANK
		{
			name = Waste
			amount = 0
			maxAmount = 176
		}
		TANK
		{
			// WRS grey/yellow water holding tank
			name = WasteWater
			amount = 0
			maxAmount = 400
		}
		TANK
		{
			name = LithiumHydroxide
			amount = 74
			maxAmount = 148
		}
		TANK
		{
			name = PotassiumSuperoxide
			amount = 292
			maxAmount = 583
		}
	}
}

