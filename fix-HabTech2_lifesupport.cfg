// Kerbalism/RO life support resources for HabTech2 ISS modules.
//
// The existing RO_HabTech2_modules.cfg (FOR[RealismOverhaul]) creates a
// ModuleFuelTanks on each module but defines no TANK entries, so the stock
// game has no pre-loaded supplies and the crew starves/suffocates immediately.
// This file adds realistic starting stocks and tank capacities.
//
// Resource units (matching Tantares New_Tantares_RO convention):
//   Oxygen           — litres of O₂ gas at ambient pressure (high-pressure
//                      storage tanks compress this; 1 unit ≈ 1 L stored gas)
//   Food             — kg of packaged foodstuffs
//   Water            — litres of potable / process water
//   Waste            — kg of solid/dry crew waste
//   WasteWater       — litres of liquid waste awaiting processing
//   LithiumHydroxide — kg of CO₂-scrubber canisters (CDRA/Vozdukh backup)
//   PotassiumSuperoxide — kg of emergency O₂ canisters (Vika candles)
//
// Amount / maxAmount rationale:
//   PMM Leonardo    : fully stocked — it IS the supply delivery module.
//   Kibo / JEM ELM  : 75 % — JAXA maintains generous consumable margins.
//   Lab modules     : 50 % — operational steady-state between cargo runs.
//   Structural nodes: 25 % — lockers, no dedicated stowage racks.
//   Waste tanks     : always start empty (generated in flight).
//   LiOH / KO₂     : 50 % starting stock (active operational reserve).
//
// Resource quantities are scaled from the Tantares Mir Core reference module
// (53,000 L tank, 7 t):  O₂ 238,000 / Food 240 / Water 140 / Waste 0-120 /
// WasteWater 0-220 / LiOH 40-200 / KO₂ 160-790.  That yields per-litre
// baselines of ≈ 4.49 O₂ / 0.0045 Food / 0.0026 Water.
//
// Departure from baseline (noted per module where intentional):
//   Harmony/Tranquility — Water capacity doubled; Tranquility houses the
//                         Water Recovery System (WRS/UPA) which buffers large
//                         volumes of urine and grey water for processing.
//   PMM Leonardo        — Near-full Food and Water: this module IS the cargo.
//   Quest / questPod    — Oxygen only; N₂/O₂ high-pressure EVA pods.

// ============================================================
// Unity — Node 1
// Connector node with six CBM berths and overhead/underfloor lockers.
// No dedicated stowage racks; minimal supplies.
// ============================================================
@PART[ht2_moduleUnity]:NEEDS[HabTech2,Kerbalism]:AFTER[RealismOverhaul]
{
	@MODULE[ModuleFuelTanks]
	{
		TANK
		{
			name = Oxygen
			amount = 11250
			maxAmount = 45000
		}
		TANK
		{
			name = Food
			amount = 11
			maxAmount = 45
		}
		TANK
		{
			name = Water
			amount = 6
			maxAmount = 26
		}
		TANK
		{
			name = Waste
			amount = 0
			maxAmount = 45
		}
		TANK
		{
			name = WasteWater
			amount = 0
			maxAmount = 26
		}
		TANK
		{
			name = LithiumHydroxide
			amount = 0
			maxAmount = 38
		}
		TANK
		{
			name = PotassiumSuperoxide
			amount = 0
			maxAmount = 150
		}
	}
}

