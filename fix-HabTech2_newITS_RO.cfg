// ============================================================
// HabTech2 - New ITS Truss & Solar Array parts
// ============================================================
// Required: RealismOverhaul, HabTech2
// ============================================================
//
// These parts were added to HabTech2 after the official RO patch
// (RO_HabTech2_truss.cfg) was written and are therefore missing
// RSSROConfig, rescale, and realistic masses/solar output.
//
// New parts covered:
//   ITS trusses  : ht2_ITS_S0, ht2_ITS_S1, ht2_ITS_truss01,
//                  ht2_ITS_hex, ht2_ITS_hex_half, ht2_ITS_adapter,
//                  ht2_ITS_half_short
//   Solar arrays : ht2_P6_SAW, ht2_P3_SAW, ht2_S6_SAW,
//                  ht2_SAW_v2, ht2_SAW_half, ht2_SAW_radiator, ht2_iROSA
//   Radiator     : ht2_radiatorTriple_v2 (TCS-300-T "Haast" Tracking Radiator)
//   CMG          : ht2_CMG (standalone HR-131 control moment gyroscope)
// ============================================================


// ------------------------------------------------------------
// Common block: expose in RSS editor + rescale to real size
// All ITS-family parts are modelled at ~2.5m stock diameter;
// real ITS trusses are ~4.57m → rescaleFactor = 1.81
// (same as the existing RO patch for ht2_truss_Z1_v2 etc.)
// ------------------------------------------------------------

@PART[ht2_ITS_S0|ht2_ITS_S1|ht2_ITS_truss01|ht2_ITS_hex|ht2_ITS_hex_half|ht2_ITS_adapter|ht2_ITS_half_short|ht2_P6_SAW|ht2_P3_SAW|ht2_S6_SAW|ht2_SAW_v2|ht2_SAW_half|ht2_SAW_radiator|ht2_iROSA|ht2_CMG|ht2_radiatorTriple_v2]:NEEDS[HabTech2]:AFTER[RealismOverhaul]
{
	%RSSROConfig = True
	!rescaleFactor,* = DEL
	%rescaleFactor = 1.81
	@maxTemp = 1073.15
	@skinMaxTemp = 1073.15
}


// ------------------------------------------------------------
// ITS S0 Center Truss
// Real: 13.4m × 4.6m, mass 13,970 kg
// Source: http://spacecraftearth.com
// ------------------------------------------------------------

@PART[ht2_ITS_S0]:NEEDS[HabTech2]:AFTER[RealismOverhaul]
{
	@mass = 13.970
	@title = ISS S0 Truss Segment
	@manufacturer = Boeing
	@description = The S0 (Center Integrated Truss Assembly) forms the central backbone of the ISS. Attached to the top of the Destiny lab during STS-110 in 2002, it routes power and conducts heat to the outboard S1 and P1 trusses.
}


// ------------------------------------------------------------
// ITS S1/P1 Semi-Hexagonal Truss
// Real: 13.7m, mass 9,124 kg (excluding triple HRS radiators)
// Source: https://space.skyrocket.de/doc_sdat/its-s1.htm
// ------------------------------------------------------------

@PART[ht2_ITS_S1]:NEEDS[HabTech2]:AFTER[RealismOverhaul]
{
	@mass = 9.124
	@title = ISS S1/P1 Truss Segment
	@manufacturer = Boeing
	@description = The S1 and P1 trusses attach to the S0 and carry Mobile Transporter carts and three heat-rejection radiators each. S1 launched on STS-112 (Oct 2002), P1 on STS-113 (Nov 2002).
}


// ------------------------------------------------------------
// P6/S6 Solar Array Wing Assembly
// P6 truss (6,700 kg) + P5 short truss (1,841 kg)
// + 2×SAW blanket (2×1,132 kg) + 3 thermal radiators (~700 kg)
// Total ≈ 15,505 kg → 15.5 t
// Solar: two SAW wings, each ~31 kW at 1 AU → 113.21 m² at level 7
// Source: https://space.skyrocket.de/doc_sdat/its-p6.htm
// ------------------------------------------------------------

@PART[ht2_P6_SAW|ht2_S6_SAW]:NEEDS[HabTech2]:AFTER[RealismOverhaul]
{
	@mass = 15.5
	@manufacturer = Boeing

	SolarConfig
	{
		area = 113.21
		level = 7
	}
	SolarConfig
	{
		area = 113.21
		level = 7
	}

	// Disable SolarConfig for the SARJ secondary-axis tracking module (chargeRate = 0)
	@MODULE[ModuleDeployableSolarPanel]:HAS[#chargeRate[0]]
	{
		@chargeRate = 0.000001
		realismOverhaulSolarIgnore = true
	}
}

@PART[ht2_P6_SAW]:NEEDS[HabTech2]:AFTER[RealismOverhaul]
{
	@title = ISS P6/P5 Solar Array Assembly
	@description = The P6 Integrated Truss Segment carried the first pair of ISS solar array wings, launched on STS-97 in late 2000. Initially mounted atop the Z1, it was relocated to the end of P5 during STS-120 in November 2007. Includes the P5 short truss, two 31 kW Solar Array Wings, and three thermal radiators.
}

@PART[ht2_S6_SAW]:NEEDS[HabTech2]:AFTER[RealismOverhaul]
{
	@title = ISS S6/S5 Solar Array Assembly
	@description = The S6 truss carried the fourth and final pair of ISS solar array wings to the starboard end of the truss, launched on STS-119 in March 2009. Mirrors the P6 assembly on the port side. Includes S5 short truss, two 31 kW Solar Array Wings, and three thermal radiators.
}


// ------------------------------------------------------------
// P3/S3-P4/S4 Solar Array Assembly (with SARJ)
// P3/S3 bridge truss + Solar Alpha Rotary Joint + 2×SAW blanket
// Integrated truss segment launch mass: 15,900 kg
// Source: https://space.skyrocket.de/doc_sdat/its-s3-4.htm
// ------------------------------------------------------------

@PART[ht2_P3_SAW]:NEEDS[HabTech2]:AFTER[RealismOverhaul]
{
	@mass = 15.900
	@title = ISS P3/S3-P4/S4 Solar Array Assembly
	@manufacturer = Boeing
	@description = Combined P3/S3 truss, Solar Alpha Rotary Joint (SARJ), and two Solar Array Wings. The SARJ allows the outer solar arrays to track the sun continuously without rotating the entire station. P4 (STS-115, Sep 2006) and S4 (STS-117, Jun 2007) are represented by this part. Generates ~62 kW total at 1 AU.

	SolarConfig
	{
		area = 113.21
		level = 7
	}
	SolarConfig
	{
		area = 113.21
		level = 7
	}

	// Disable SolarConfig for the SARJ secondary-axis tracking module (chargeRate = 0)
	@MODULE[ModuleDeployableSolarPanel]:HAS[#chargeRate[0]]
	{
		@chargeRate = 0.000001
		realismOverhaulSolarIgnore = true
	}
}


// ------------------------------------------------------------
// Single SAW blanket wing (ht2_SAW_v2)
// One ISS Solar Array Wing blanket module ≈ 1,132 kg, ~31 kW
// ------------------------------------------------------------

@PART[ht2_SAW_v2]:NEEDS[HabTech2]:AFTER[RealismOverhaul]
{
	@mass = 1.1
	@title = ISS Solar Array Wing
	@manufacturer = Boeing
	@description = A single International Space Station Solar Array Wing blanket module. Each wing produces approximately 31 kW at 1 AU. Four pairs of these form the main ISS power system. Can be combined with SARJ-equipped truss sections for sun-tracking capability.

	SolarConfig
	{
		area = 113.21
		level = 7
	}
}


// ------------------------------------------------------------
// Half SAW blanket (ht2_SAW_half)
// Half-length solar array blanket, ~550 kg, ~16 kW
// ------------------------------------------------------------

@PART[ht2_SAW_half]:NEEDS[HabTech2]:AFTER[RealismOverhaul]
{
	@mass = 0.55
	@title = ISS Solar Array Wing (Short)
	@manufacturer = Boeing
	@description = A shorter half-length solar array blanket for tighter truss configurations.

	SolarConfig
	{
		area = 58.0
		level = 7
	}
}


// ------------------------------------------------------------
// iROSA (ISS Roll-Out Solar Array)
// Each unit: ~325 kg, ~18 kW at 1 AU → ~65 m² at level 7
// Launched 2021-2023 to augment the ageing original SAWs
// ------------------------------------------------------------

@PART[ht2_iROSA]:NEEDS[HabTech2]:AFTER[RealismOverhaul]
{
	@mass = 0.325
	@title = ISS iROSA Roll-Out Solar Array
	@manufacturer = Boeing / Northrop Grumman
	@description = ISS Roll-Out Solar Array. Six of these were delivered to the ISS from 2021 to 2023 to supplement the degraded original Solar Array Wings. Each roll-out blanket produces approximately 18 kW at 1 AU and stows to a very compact volume.

	SolarConfig
	{
		area = 65.5
		level = 7
	}
}


// ------------------------------------------------------------
// TCS-300-T "Haast" Tracking Thermal Radiator (ht2_radiatorTriple_v2)
// Updated version of ht2_radiatorTriple, added after the RO patch was written.
// Same real-world specs as the original (ISS triple HRS radiator on S1/P1).
// Mass: 3,400 kg  Source: http://www.defense-aerospace.com/article-view/release/12155
// ------------------------------------------------------------

@PART[ht2_radiatorTriple_v2]:NEEDS[HabTech2]:AFTER[RealismOverhaul]
{
	@mass = 3.4
	@title = ISS Triple HRS Radiator (Tracking)
	@manufacturer = Lockheed Martin
	@description = Three Heat Rejection Subsystem radiator panels on a single sun-tracking platform. The S1 and P1 trusses each carry one of these assemblies, weighing approximately 7,500 lb total. Each panel can be independently extended or retracted.
	%breakingForce = 200
	%breakingTorque = 200
	%fuelCrossFeed = False
	%radiatorHeadroom = 0.29

	@MODULE[ModuleActiveRadiator]
	{
		@maxEnergyTransfer = 1750
		@overcoolFactor = 0.0186367

		@RESOURCE[ElectricCharge]
		{
			@rate = 1.545
		}
	}
}


// ------------------------------------------------------------
// Standalone CMG module (ht2_CMG)
// Represents one Honeywell HR-131 Control Moment Gyroscope.
// Real specs: ~100 kg, 258 N·m, ~420 W per unit.
// Torque scaled 5× for KSP playability (realistic value too
// small to noticeably affect an RSS-scale station assembly).
// Place 4 on a Z1 truss to match ISS CMG configuration.
// reactionWheelMode = CMG at PART level — correct RO pattern
// (ref: RO_RestockPlus_Control_Parts_Config.cfg).
// ------------------------------------------------------------

@PART[ht2_CMG]:NEEDS[HabTech2]:AFTER[RealismOverhaul]
{
	@mass = 0.100
	@title = ISS Control Moment Gyroscope (HR-131)
	@manufacturer = Honeywell
	@description = Honeywell HR-131 Control Moment Gyroscope as used on the International Space Station. The ISS Z1 truss houses four of these. Individually placeable for custom station configurations. Real torque is 258 N·m; value here is scaled up 5× for KSP playability.
	@tags = ^:$: ISS CMG control moment gyroscope Z1 HR-131 Honeywell reaction wheel

	%reactionWheelMode = CMG			// RO part-level field
	%reactionWheelPowerDraw = 0.42		// ~420 W per real HR-131

	@MODULE[ModuleReactionWheel]
	{
		@PitchTorque = 1.25	// 258 N·m real × 5 for playability
		@YawTorque   = 1.25
		@RollTorque  = 1.25
	}
}
