// ============================================================
// HabTech2 - Remaining parts RO patch
// ============================================================
// Required: RealismOverhaul, HabTech2
// ============================================================
//
// Covers all HabTech2 parts not handled by:
//   RO_HabTech2_truss.cfg       - original truss/solar parts
//   RO_HabTech2_modules.cfg     - pressurised modules
//   fix-HabTech2_newITS_RO.cfg  - new ITS truss & solar additions
//   fix-HabTech2_Z1_CMG.cfg     - Z1 truss CMG tuning
//
// Parts covered:
//   Trusses : MT, MBS, MTS/adapter, 6× TTS connectors,
//             battery, bipod strut, ATA tank, fuel/prop
//             modules, single radiator, 10× RCS blocks
//   Modules : AMS, BEAM, Bishop, JEM arm mount, JEM EF ports,
//             ORU adapter, PMA variants, toolboxes
//   Greebles: cameras, antennas, cargo containers, ELC, ESP,
//             FPMU, JEM external hardware, SGANT assembly
//   ISPR    : 8 onboard avionics/equipment racks
//   Hangar  : Garage, GarageMini
// ============================================================


// ------------------------------------------------------------
// Common block — all remaining unpatched HabTech2 parts
// Sets RSSROConfig (makes parts visible in RSS/RO VAB) and
// applies the standard HabTech2 rescale factor of 1.81,
// matching RO_HabTech2_truss.cfg and RO_HabTech2_modules.cfg.
// ------------------------------------------------------------
@PART[ht2_MT|ht2_MBS|ht2_MTS|ht2_MTS_adapter|ht2_ATA|ht2_battery|ht2_bipod_strut|ht2_fuelModule|ht2_propModule|ht2_radiatorSingle|ht2_rcs_1|ht2_rcs_1a|ht2_rcs_2|ht2_rcs_2a|ht2_rcs_3|ht2_rcs_3a|ht2_rcs_3b|ht2_rcs_4|ht2_rcs_4a|ht2_rcs_4b|ht2_TTS_circle|ht2_TTS_compact|ht2_TTS_hex|ht2_TTS_semiHex|ht2_TTS_standoff|ht2_TTS_standoff_angle|ht2_AMS|ht2_BEAM|ht2_bishop|ht2_JEM_armMount|ht2_JEM_EF_port|ht2_JEM_EF_portB|ht2_JEM_EF_portC|ht2_orb|ht2_PMA_short|ht2_PMA_straight|ht2_toolBox1|ht2_toolBox2|ht2_cameraMast|ht2_cargoBag|ht2_CTC|ht2_ELC|ht2_ESP|ht2_FPMU|ht2_JEM_ICS|ht2_JEM_MCE|ht2_JEM_NR|ht2_JEM_port|ht2_JEM_SCI|ht2_JEM_SEDA-AP|ht2_S-band|ht2_SGANT_boomFixed|ht2_SGANT_boomSwing|ht2_SGANT_dish|ht2_SGANT_servo|ht2_UHF_antenna|ht2_WETA|ht2_ISPR_U_kerbNet|ht2_ISPR_U_mechJeb|ht2_ISPR_U_probeControl|ht2_ISPR_U_probeCore|ht2_ISPR_U_radio|ht2_ISPR_U_robotics|ht2_ISPR_U_SAS|ht2_ISPR_U_XP|Garage|GarageMini]:NEEDS[HabTech2]:AFTER[RealismOverhaul]
{
	%RSSROConfig = True
	!rescaleFactor,* = DEL
	%rescaleFactor = 1.81
	@maxTemp = 1073.15
	@skinMaxTemp = 1073.15
}


