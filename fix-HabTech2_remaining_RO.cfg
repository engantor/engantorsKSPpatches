// ============================================================
// SECTION B — PROPULSION & TANKS
// ============================================================

// ------------------------------------------------------------
// Multipurpose Tank Assembly (ht2_ATA)
// Modelled after ISS Ammonia Tank Assembly (ATA).
// Real ATA dry mass: ~315 kg
// Source: Boeing / NASA
//
// The stock B9PartSwitch tankSwitch (Mono/LF/LFO/Battery) is
// incompatible with RealFuels. Replaced with a SM-IV tank
// allowing any RO-compatible propellant or fluid.
// The handrail B9PS subtype switch is left intact.
// ------------------------------------------------------------
@PART[ht2_ATA]:NEEDS[HabTech2]:AFTER[RealismOverhaul]
{
	@mass = 0.315
	@title = ISS Ammonia Tank Assembly (ATA)
	@manufacturer = Boeing
	@description = External multipurpose fluid storage assembly. On the real ISS, ATAs store anhydrous ammonia as working fluid for the External Active Thermal Control System. In RO this tank accepts any SM-IV compatible propellant or pressurant.

	!MODULE[ModuleB9PartSwitch]:HAS[#moduleID[tankSwitch]] {}

	MODULE
	{
		name = ModuleFuelTanks
		type = SM-IV
		basemass = -1
		volume = 300
	}
}


// ------------------------------------------------------------
// ST-F External Propellant Module (ht2_fuelModule)
// Tank-only module for external propellant storage.
// Replaces stock MonoPropellant resource with SM-IV tank.
// ------------------------------------------------------------
@PART[ht2_fuelModule]:NEEDS[HabTech2]:AFTER[RealismOverhaul]
{
	@mass = 0.600
	@title = ISS External Propellant Storage Module (ST-F)
	@manufacturer = Boeing
	@description = External propellant storage module designed to mount on ISS truss structure. Provides propellant to co-mounted thruster blocks or docked visiting vehicles. Accepts any SM-IV compatible propellant through the RealFuels tank interface.

	!RESOURCE[MonoPropellant] {}

	MODULE
	{
		name = ModuleFuelTanks
		type = SM-IV
		basemass = -1
		volume = 1000
	}
}


// ------------------------------------------------------------
// ST-P Autonomous Propulsion Module (ht2_propModule)
// Integrated thruster + command + propellant unit.
// Represents an ISS reboost / attitude propulsion kit
// (analogous to Progress-style external propulsion segments).
//
// Propellant: NTO + MMH bipropellant (standard US hypergolic)
//   Isp vac  = 285 s   (R-4D/LEROS-class thruster)
//   Thrust   = 0.890 kN (~200 lbf per nozzle)
//   Ratios   : MMH 0.4571 / NTO 0.5429  (by volume)
// ------------------------------------------------------------
@PART[ht2_propModule]:NEEDS[HabTech2]:AFTER[RealismOverhaul]
{
	@mass = 0.800
	@title = ISS Autonomous Propulsion Module (ST-P)
	@manufacturer = Boeing
	@description = Autonomous reboost and attitude control module for external ISS attachment. Integrates NTO/MMH bipropellant thrusters, a flight computer and SAS for unmanned orbital maintenance operations. Can be used to boost ISS altitude or provide supplemental attitude authority.

	!RESOURCE[MonoPropellant] {}

	MODULE
	{
		name = ModuleFuelTanks
		type = SM-IV
		basemass = -1
		volume = 2000
		TANK
		{
			name = MMH
			amount = 800
			maxAmount = 800
		}
		TANK
		{
			name = NTO
			amount = 1200
			maxAmount = 1200
		}
	}

	@MODULE[ModuleRCSFX]
	{
		!resourceName = DEL
		@thrusterPower = 0.890
		!PROPELLANT,* {}
		PROPELLANT
		{
			name = MMH
			ratio = 0.4571
			DrawGauge = True
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		PROPELLANT
		{
			name = NTO
			ratio = 0.5429
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		@atmosphereCurve
		{
			!key,* = DEL
			key = 0 285
			key = 1 1
			key = 4 0.001
		}
	}
}


// ============================================================
// SECTION C — RCS BLOCKS
// ============================================================
//
// HabTech2 "Heavy Duty" RCS blocks represent external ISS
// attitude control thrusters. Stock MonoPropellant is replaced
// with NTO + MMH hypergolic bipropellant.
//
// thrusterPower = 0.445 kN (~100 lbf each nozzle)
// Isp vac       = 285 s   (vacuum-optimised hypergolic)
// Isp ASL       = 1 s     (effectively vacuum-only)
// Ratios        : MMH 0.4571 / NTO 0.5429  (by volume)
//
// These parts carry no integral propellant; they draw from
// ship tanks via STAGE_PRIORITY_FLOW.
// ------------------------------------------------------------
@PART[ht2_rcs_1|ht2_rcs_1a|ht2_rcs_2|ht2_rcs_2a|ht2_rcs_3|ht2_rcs_3a|ht2_rcs_3b|ht2_rcs_4|ht2_rcs_4a|ht2_rcs_4b]:NEEDS[HabTech2]:AFTER[RealismOverhaul]
{
	@MODULE[ModuleRCSFX]
	{
		!resourceName = DEL
		@thrusterPower = 0.445
		!PROPELLANT,* {}
		PROPELLANT
		{
			name = MMH
			ratio = 0.4571
			DrawGauge = True
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		PROPELLANT
		{
			name = NTO
			ratio = 0.5429
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		@atmosphereCurve
		{
			!key,* = DEL
			key = 0 285
			key = 1 1
			key = 4 0.001
		}
	}
}

// Masses scale with nozzle count (stock values retained — reasonable at RO scale)
@PART[ht2_rcs_1|ht2_rcs_1a]:NEEDS[HabTech2]:AFTER[RealismOverhaul]                { @mass = 0.040 }
@PART[ht2_rcs_2|ht2_rcs_2a]:NEEDS[HabTech2]:AFTER[RealismOverhaul]                { @mass = 0.080 }
@PART[ht2_rcs_3|ht2_rcs_3a|ht2_rcs_3b]:NEEDS[HabTech2]:AFTER[RealismOverhaul]    { @mass = 0.120 }
@PART[ht2_rcs_4|ht2_rcs_4a|ht2_rcs_4b]:NEEDS[HabTech2]:AFTER[RealismOverhaul]    { @mass = 0.160 }


// ============================================================
// SECTION D — THERMAL CONTROL
// ============================================================

// ------------------------------------------------------------
// TCS-100-T Deployable Tracking Radiator (ht2_radiatorSingle)
// Calibrated per-panel from ht2_radiatorTriple_v2 baseline:
//   triple (3 panels) → 1750 units, 1.545 EC/s, 3.4 t
//   per panel → ~583 units, ~0.515 EC/s
//   single 8-panel   → 4660 units, ~4.12 EC/s
//
// NOTE: The B9PS 4-panel length sub-type retains stock absolute
// values (10000 / 0.1 EC) and cannot be corrected here without
// reading the exact SUBTYPE name. Use the default 8-panel
// configuration for correct RO thermal performance.
// ------------------------------------------------------------
@PART[ht2_radiatorSingle]:NEEDS[HabTech2]:AFTER[RealismOverhaul]
{
	@mass = 1.200
	@title = ISS TCS-100-T Deployable Tracking Radiator
	@manufacturer = Lockheed Martin
	@description = Deployable, sun-tracking active thermal radiator for ISS truss attachment. The 8-panel configuration provides full rated cooling capacity. A short 4-panel variant is available via part switching. For correct RO thermal values use the default 8-panel configuration.
	%breakingForce = 200
	%breakingTorque = 200
	%fuelCrossFeed = False
	%radiatorHeadroom = 0.29

	@MODULE[ModuleActiveRadiator]
	{
		@maxEnergyTransfer = 4660
		@overcoolFactor = 0.0186367

		@RESOURCE[ElectricCharge]
		{
			@rate = 4.12
		}
	}
}


// ------------------------------------------------------------
// TCS-80-S Non-Tracking Deployable Radiator (ht2_SAW_radiator)
// (Rescale already applied in fix-HabTech2_newITS_RO.cfg)
// Non-tracking → lower effective capacity than TCS-100-T.
// Calibrated at ~43% of the tracking single per panel.
// 8-panel base: ~2000 units, ~1.5 EC/s
// ------------------------------------------------------------
@PART[ht2_SAW_radiator]:NEEDS[HabTech2]:AFTER[RealismOverhaul]
{
	@mass = 0.900
	%breakingForce = 200
	%breakingTorque = 200
	%fuelCrossFeed = False
	%radiatorHeadroom = 0.29

	@MODULE[ModuleActiveRadiator]
	{
		@maxEnergyTransfer = 2000
		@overcoolFactor = 0.0186367

		@RESOURCE[ElectricCharge]
		{
			@rate = 1.5
		}
	}
}


