// Kerbalism life support for KK_SpXCD Crew Dragon.
// Life support supplies go into the ModuleFuelTanks added by fix-KK_SpXCD_propellants.cfg.
// Values scaled from ROCapsules ROC-D2CM (3 crew, 14 days) → 5 crew, 14 days.
// Dragon 2 uses LiOH scrubbers and mixed-gas (N2/O2) atmosphere at ~1 atm.
//
// NOTE: Must run AFTER[zzzRealismOverhaul], not AFTER[RealismOverhaul].
// fix-KK_SpXCD_propellants.cfg (AFTER[RealismOverhaul]) creates ModuleFuelTanks;
// alphabetically "Kerbalism" < "propellants", so this file would run first and
// @MODULE[ModuleFuelTanks] would find nothing. zzzRealismOverhaul is later.

@PART[KK_SpXCD_capsule]:NEEDS[ProfileRealismOverhaul]:AFTER[zzzRealismOverhaul]
{
	// Add life support supplies into the existing ModuleFuelTanks.
	// Also expand the declared volume to fit both propellant (1650 L) and LS (~560 L).
	@MODULE[ModuleFuelTanks]
	{
		@volume = 2300
		TANK
		{
			name = Food
			amount = 410
			maxAmount = 410		// 14 days, 5 crew
		}
		TANK
		{
			name = Water
			amount = 27
			maxAmount = 27
		}
		TANK
		{
			name = Oxygen
			amount = 2926
			maxAmount = 2926
		}
		TANK
		{
			name = LithiumHydroxide
			amount = 72
			maxAmount = 72
		}
		TANK
		{
			name = Nitrogen
			amount = 2500
			maxAmount = 2500	// pressure makeup
		}
		TANK
		{
			name = WasteWater
			amount = 0
			maxAmount = 42
		}
		TANK
		{
			name = Waste
			amount = 0
			maxAmount = 37
		}
	}
}

@PART[KK_SpXCD_capsule]:NEEDS[FeatureHabitat]:AFTER[zzzKerbalism]
{
	@MODULE[Habitat]
	{
		volume = 9.3		// Dragon 2 pressurized volume (m³)
		surface = 20		// guesstimate
		max_pressure = 1.0	// mixed gas at near sea-level pressure
	}

	MODULE
	{
		name = ProcessController
		resource = _Scrubber
		title = LiOH Scrubber
		capacity = 5		// one per crew member
		running = true
	}

	MODULE
	{
		name = ProcessController
		resource = _PressureControl
		title = N2 Pressure Controller
		capacity = 0.3		// ~20m² surface / 70m² reference
		running = true
	}
}
