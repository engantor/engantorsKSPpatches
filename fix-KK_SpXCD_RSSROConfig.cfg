// Mark all KK_SpXCD Dragon parts as RO-supported so they appear in the VAB.
// Without this, RO's zzzRealismOverhaul pass sets category = 97/-1 on any
// part lacking RSSROConfig = True, hiding it from the parts list.

@PART[KK_SpXCD_capsule|KK_SpXCD_capsule_cargo|KK_SpXCD_dockingport]:AFTER[RealismOverhaul]
{
	%RSSROConfig = True
}

@PART[KK_SpXCD_drogueChutes|KK_SpXCD_drogueCover|KK_SpXCD_heatshield]:AFTER[RealismOverhaul]
{
	%RSSROConfig = True
}

@PART[KK_SpXCD_mainChutes|KK_SpXCD_mainCover|KK_SpXCD_trunk|KK_SpXCD_trunk_cargo]:AFTER[RealismOverhaul]
{
	%RSSROConfig = True
}
