// Real propellant and Kerbalism resupply config for KK_SpXCD Dragon Cargo 2.
// No SuperDraco abort engines — Draco RCS only, same as Crew Dragon but smaller budget.
// Kerbalism cargo: ~45-day resupply for 6-crew ISS (food, water, O2, LiOH, waste storage).
//
// Propellant budget (Draco RCS only):
//   ~40-day mission with 18 × 400 N Draco thrusters, MMH/NTO
//   MMH:  170 L  (147 kg @ 0.866 kg/L)
//   NTO:  130 L  (189 kg @ 1.450 kg/L)
//   He:   31000 L pressurant (300 L propellant × 103.35 ratio)
//
// Kerbalism resupply values (6 crew, 45 days, scaled from ROC-D2CM baseline):
//   Food:  1760  (= 410/5crew/14d × 6 × 45)
//   Water:  116  (= 27/5/14 × 6 × 45)
//   Oxygen: 12550 (= 2926/5/14 × 6 × 45)
//   LiOH:   308  (= 72/5/14 × 6 × 45)
//   WasteWater: 0/180  (return waste storage)
//   Waste:  0/160

@PART[KK_SpXCD_capsule_cargo]:AFTER[RealismOverhaul]
{
	// Remove stock MonoPropellant tank
	!RESOURCE[MonoPropellant] {}

	// Real propellants (Draco RCS only — no abort engines on cargo variant)
	MODULE
	{
		name = ModuleFuelTanks
		type = ServiceModule
		volume = 33000
		basemass = -1

		TANK
		{
			name = MMH
			amount = 170
			maxAmount = 170
		}
		TANK
		{
			name = NTO
			amount = 130
			maxAmount = 130
		}
		TANK
		{
			name = Helium
			amount = 31000
			maxAmount = 31000
		}
		TANK
		{
			name = ElectricCharge
			amount = 15000
			maxAmount = 15000
		}
	}

	// Draco RCS — same thruster layout as Crew Dragon
	@MODULE[ModuleRCSFX]:HAS[#thrusterTransformName[draco]]
	{
		@thrusterPower = 0.4		// 400 N
		!PROPELLANT,* {}
		PROPELLANT
		{
			name = MMH
			ratio = 0.5629
			DrawGauge = True
		}
		PROPELLANT
		{
			name = NTO
			ratio = 0.4371
			DrawGauge = False
		}
		PROPELLANT
		{
			name = Helium
			ratio = 103.35
			ignoreForIsp = True
		}
		!atmosphereCurve {}
		atmosphereCurve
		{
			key = 0 300
			key = 1 100
			key = 4 0.001
		}
	}

	@MODULE[ModuleRCSFX]:HAS[#thrusterTransformName[draco_top]]
	{
		@thrusterPower = 0.4		// 400 N
		!PROPELLANT,* {}
		PROPELLANT
		{
			name = MMH
			ratio = 0.5629
			DrawGauge = True
		}
		PROPELLANT
		{
			name = NTO
			ratio = 0.4371
			DrawGauge = False
		}
		PROPELLANT
		{
			name = Helium
			ratio = 103.35
			ignoreForIsp = True
		}
		!atmosphereCurve {}
		atmosphereCurve
		{
			key = 0 300
			key = 1 100
			key = 4 0.001
		}
	}
}

// Kerbalism resupply cargo — goes in the ModuleFuelTanks added above.
// Expand volume to 35500 to fit propellants (~31300 L) + LS cargo (~2800 L).
// Run AFTER[zzzRealismOverhaul] so ModuleFuelTanks is already present.
@PART[KK_SpXCD_capsule_cargo]:NEEDS[ProfileRealismOverhaul]:AFTER[zzzRealismOverhaul]
{
	@MODULE[ModuleFuelTanks]
	{
		@volume = 35500
		TANK
		{
			name = Food
			amount = 1760
			maxAmount = 1760	// 45 days, 6 crew
		}
		TANK
		{
			name = Water
			amount = 116
			maxAmount = 116
		}
		TANK
		{
			name = Oxygen
			amount = 12550
			maxAmount = 12550
		}
		TANK
		{
			name = LithiumHydroxide
			amount = 308
			maxAmount = 308
		}
		TANK
		{
			name = WasteWater
			amount = 0
			maxAmount = 180
		}
		TANK
		{
			name = Waste
			amount = 0
			maxAmount = 160
		}
	}
}
