// Real propellant config for KK_SpXCD Crew Dragon.
// Replaces stock MonoPropellant with MMH/NTO/Helium (same as real Dragon 2).
// Reference: SuperDraco_Config.cfg for propellant ratios and Isp.
//
// SuperDraco: pmborg sets 533.77 kN total (8 engines combined in one module).
// Draco RCS:  18 thrusters, 400 N each, same MMH/NTO propellant pool.
//
// Tank volumes calculated for this capsule (7 t, 533.77 kN abort thrust):
//   ~8s abort burn + ~6-day RCS budget = ~1850 kg total propellant
//   MMH: 930 L (806 kg @ 0.866 kg/L)
//   NTO: 720 L (1044 kg @ 1.45 kg/L)
//   Helium: (930+720) x 103.35 pressurant ratio = 170,528 L

@PART[KK_SpXCD_capsule]:AFTER[RealismOverhaul]
{
	// Remove stock MonoPropellant tank
	!RESOURCE[MonoPropellant] {}

	// Real propellant tanks — volumes calculated for this capsule's specs
	MODULE
	{
		name = ModuleFuelTanks
		type = ServiceModule
		volume = 1700
		basemass = -1
		TANK
		{
			name = MMH
			amount = 930
			maxAmount = 930
		}
		TANK
		{
			name = NTO
			amount = 720
			maxAmount = 720
		}
		TANK
		{
			name = Helium
			amount = 170000
			maxAmount = 170000
		}
		TANK
		{
			name = ElectricCharge
			amount = 15000
			maxAmount = 15000
		}
	}

	// SuperDraco abort engine — 8 engines treated as one module
	// RealFuels converts ModuleEnginesFX → ModuleEnginesRF automatically;
	// ModuleEngineConfigs then drives the runtime propellant and thrust values.
	!MODULE[ModuleEngineConfigs],* {}
	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		configuration = SuperDraco
		origMass = 0

		CONFIG
		{
			name = SuperDraco
			specLevel = operational
			minThrust = 106.75	// 20% throttle × 533.77 kN
			maxThrust = 533.77	// pmborg value
			heatProduction = 54

			PROPELLANT
			{
				name = MMH
				ratio = 0.5629
				DrawGauge = True
			}
			PROPELLANT
			{
				name = NTO
				ratio = 0.4371
				DrawGauge = False
			}
			PROPELLANT
			{
				name = Helium
				ratio = 103.35
				ignoreForIsp = True
			}

			atmosphereCurve
			{
				key = 0 280
				key = 1 240
			}

			ullage = False
			pressureFed = True
			ignitions = 0

			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.5
			}
		}
	}

	// Draco RCS — side thrusters (6-DOF attitude and translation)
	@MODULE[ModuleRCSFX]:HAS[#thrusterTransformName[draco]]
	{
		@thrusterPower = 0.4		// 400 N
		!PROPELLANT,* {}
		PROPELLANT
		{
			name = MMH
			ratio = 0.5629
			DrawGauge = True
		}
		PROPELLANT
		{
			name = NTO
			ratio = 0.4371
			DrawGauge = False
		}
		PROPELLANT
		{
			name = Helium
			ratio = 103.35
			ignoreForIsp = True
		}
		!atmosphereCurve {}
		atmosphereCurve
		{
			key = 0 300
			key = 1 100
			key = 4 0.001
		}
	}

	// Draco RCS — top thrusters (axial translation only)
	@MODULE[ModuleRCSFX]:HAS[#thrusterTransformName[draco_top]]
	{
		@thrusterPower = 0.4		// 400 N
		!PROPELLANT,* {}
		PROPELLANT
		{
			name = MMH
			ratio = 0.5629
			DrawGauge = True
		}
		PROPELLANT
		{
			name = NTO
			ratio = 0.4371
			DrawGauge = False
		}
		PROPELLANT
		{
			name = Helium
			ratio = 103.35
			ignoreForIsp = True
		}
		!atmosphereCurve {}
		atmosphereCurve
		{
			key = 0 300
			key = 1 100
			key = 4 0.001
		}
	}
}
