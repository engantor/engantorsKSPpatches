// Fix invisible Tantares ISS/Mir module copies in the RSS/RO VAB.
//
// Root cause:
//   New_Tantares_RO patches use Module Manager's +PART directive to copy stock
//   Tantares parts into module-specific versions (ro_Zarya_*, ro_Zvezda_*, etc.).
//   The structural/crew section patches that follow only change the title and
//   description — they never add %RSSROConfig = True or @rescaleFactor = 1.61.
//   RO's zzzRealismOverhaul pass then hides any part that lacks RSSROConfig.
//
// Why only Rassvet/Pirs/Kvant-1/Mir Core are visible:
//   Those patches modify the ORIGINAL Tantares parts directly (not +PART copies),
//   so they include %RSSROConfig = True in the same block.  The ro_* copies that
//   Zarya/Zvezda/Nauka/Kvant-2/Spektr/Priroda create are separate parts that
//   inherit none of those patches.
//
// Affected copies (all created during FOR[RealismOverhaul] by +PART):
//   ro_Zarya_*         — Zarya FGB (ISS)
//   ro_Zvezda_*        — Zvezda Service Module (ISS)
//   ro_Nauka_*         — Nauka MLM (ISS)
//   ro_kvant-2_*       — Kvant-2 (Mir)
//   ro_spektr_*        — Spektr (Mir)
//   ro_priroda_*       — Priroda (Mir)
//
// This single AFTER[RealismOverhaul] pass adds the two missing fields to every
// part in those families.  Parts that already have the field set (e.g., the solar
// panel copies that do include RSSROConfig) are unaffected: % is a no-op when the
// key exists, and @rescaleFactor = 1.61 is idempotent when the value is already
// 1.61.

@PART[ro_Zarya_*|ro_Zvezda_*|ro_Nauka_*|ro_kvant-2_*|ro_spektr_*|ro_priroda_*]:NEEDS[Tantares]:AFTER[RealismOverhaul]
{
	%RSSROConfig = True
	@rescaleFactor = 1.61
	@maxTemp = 1073.15
	@skinMaxTemp = 1073.15
}

// --- VAB search tags so each family is discoverable by station name ---

@PART[ro_Zarya_*]:NEEDS[Tantares]:AFTER[RealismOverhaul]
{
	@tags ^= :$: ISS Zarya FGB
}

@PART[ro_Zvezda_*]:NEEDS[Tantares]:AFTER[RealismOverhaul]
{
	@tags ^= :$: ISS Zvezda SM
}

@PART[ro_Nauka_*]:NEEDS[Tantares]:AFTER[RealismOverhaul]
{
	@tags ^= :$: ISS Nauka MLM
}

@PART[ro_kvant-2_*]:NEEDS[Tantares]:AFTER[RealismOverhaul]
{
	@tags ^= :$: Mir Kvant-2
}

@PART[ro_spektr_*]:NEEDS[Tantares]:AFTER[RealismOverhaul]
{
	@tags ^= :$: Mir Spektr
}

@PART[ro_priroda_*]:NEEDS[Tantares]:AFTER[RealismOverhaul]
{
	@tags ^= :$: Mir Priroda
}
