// ============================================================
// Pmborg RealFalcons — Merlin 1D bottom attachment node
// ============================================================
// The Merlin 1D sea-level variants (M1D, M1D+, M1D++) ship
// with node_stack_bottom commented out by the original author.
// This restores it so launch-pad parts can snap to the base
// of the engine.
//
// Node Y position (-1.352654) taken from the commented line
// in the original part cfgs. At the Pmborg rescale factor
// it sits at the nozzle exit plane.
//
// Vacuum variants (M1DV, M1DV+) already have a bottom node.
// Merlin 1C / 1Ci already have a bottom node.
// ============================================================

@PART[KK_SPX_Merlin1D|KK_SPX_Merlin1D+|KK_SPX_Merlin1D++|PMB_F9_Merlin1Dplus|PMB_F9_Merlin1Dplusplus]
{
	node_stack_bottom = 0.0, -1.352654, 0.0, 0.0, -1.0, 0.0, 1
}
