// Kerbalism science wiring for RN_US_Probes.
// This mod uses three custom experimentIDs (hullcampicture, ProbePlasma, ProbeMagn)
// that have NO EXPERIMENT_DEFINITION in any installed mod — this file creates them
// and wires them into Kerbalism.
//
// Real-world analogues:
//   hullcampicture — Engineering/context cameras (vidicon or CCD wide-angle),
//                    flown on virtually every deep-space probe for spacecraft
//                    health monitoring and approach imaging (e.g., Voyager ISS,
//                    Cassini ISS, New Horizons LORRI wide-angle).
//   ProbePlasma    — Solar wind/plasma instrument (electrostatic analyser, Faraday
//                    cup, or plasma wave science). Generic representation of the
//                    plasma packages on Pioneer 10/11 (PLS), Voyager (LECP/PLS),
//                    Cassini (CAPS), and Juno (JADE).
//   ProbeMagn     — Boom-mounted fluxgate magnetometer, as flown on Pioneer 10/11
//                    (Helium Vector Magnetometer), Voyager 1/2 (dual-technique
//                    FGM + search coil), and many planetary orbiters.

// ============================================================
// 1 — CREATE EXPERIMENT_DEFINITION + KERBALISM_EXPERIMENT
// ============================================================

EXPERIMENT_DEFINITION
{
	id = hullcampicture
	title = Hull Camera Photograph
	baseValue = 2
	scienceCap = 2
	dataScale = 5.0		// 5 Mb per imaging session
	requireAtmosphere = False
	situationMask = 63		// all situations
	biomeMask = 19			// landed, splashed, space low

	RESULTS
	{
		default = A wide-angle context image is captured by the spacecraft engineering camera.
		default = The camera records spacecraft health, solar panel deployment, and the surrounding environment.
		SunInSpaceHigh = The Sun's corona is partially visible at the edge of the frame.
		SunInSpaceLow = Blinded by the sun — the image is mostly overexposed.
	}

	KERBALISM_EXPERIMENT
	{
		SampleMass = 0
		IncludeExperiment =
	}
}

EXPERIMENT_DEFINITION
{
	id = ProbePlasma
	title = Plasma Environment Survey
	baseValue = 8
	scienceCap = 8
	dataScale = 1.5		// 1.5 Mb per 6-hour scan
	requireAtmosphere = False
	situationMask = 48		// InSpaceLow + InSpaceHigh
	biomeMask = 0

	RESULTS
	{
		default = Solar-wind ion and electron fluxes are measured across a range of energies.
		default = The Faraday cup registers bulk velocity, density, and temperature of the solar wind.
		SunInSpaceLow = Plasma density is elevated close to the Sun — the solar wind is faster and hotter here.
		SunInSpaceHigh = The solar wind is cooler and less dense at this heliocentric distance.
	}

	KERBALISM_EXPERIMENT
	{
		SampleMass = 0
		IncludeExperiment =
	}
}

EXPERIMENT_DEFINITION
{
	id = ProbeMagn
	title = Interplanetary Magnetic Field Survey
	baseValue = 8
	scienceCap = 8
	dataScale = 1.0		// 1 Mb per 6-hour pass
	requireAtmosphere = False
	situationMask = 48		// InSpaceLow + InSpaceHigh
	biomeMask = 0

	RESULTS
	{
		default = The vector magnetic field strength and orientation are logged continuously.
		default = Sector boundaries in the interplanetary magnetic field (HCS crossings) are detected.
		SunInSpaceLow = The solar wind carries a strong, well-ordered Parker-spiral magnetic field at this range.
		SunInSpaceHigh = At this heliocentric distance the IMF magnitude has fallen with the inverse-square of distance.
	}

	KERBALISM_EXPERIMENT
	{
		SampleMass = 0
		IncludeExperiment =
	}
}

// ============================================================
// 2 — REPLACE ModuleScienceExperiment → Experiment
// ============================================================

@PART[*]:HAS[@MODULE[ModuleScienceExperiment]:HAS[#experimentID[hullcampicture]]]:NEEDS[RN_US_Probes,Kerbalism]:FOR[RP-0-Kerbalism]
{
	!MODULE[ModuleScienceExperiment]:HAS[#experimentID[hullcampicture]] {}
	MODULE
	{
		name = Experiment
		experiment_id = hullcampicture
	}
}
@PART[*]:HAS[@MODULE[ModuleScienceExperiment]:HAS[#experimentID[ProbePlasma]]]:NEEDS[RN_US_Probes,Kerbalism]:FOR[RP-0-Kerbalism]
{
	!MODULE[ModuleScienceExperiment]:HAS[#experimentID[ProbePlasma]] {}
	MODULE
	{
		name = Experiment
		experiment_id = ProbePlasma
	}
}
@PART[*]:HAS[@MODULE[ModuleScienceExperiment]:HAS[#experimentID[ProbeMagn]]]:NEEDS[RN_US_Probes,Kerbalism]:FOR[RP-0-Kerbalism]
{
	!MODULE[ModuleScienceExperiment]:HAS[#experimentID[ProbeMagn]] {}
	MODULE
	{
		name = Experiment
		experiment_id = ProbeMagn
	}
}

// ============================================================
// 3 — CONFIGURE PARAMETERS
// ============================================================

@PART[*]:HAS[@MODULE[Experiment]]:NEEDS[RN_US_Probes,Kerbalism]:AFTER[RP-0-Kerbalism]
{
	@MODULE[Experiment]:HAS[#experiment_id[hullcampicture]]
	{
		%ec_rate = 0.01
		%data_rate = 5.0		// 5 Mb per imaging session
		@data_rate /= 60		// 1-minute exposure sequence
		%requires =
		%resources =
		%experiment_desc = A wide-angle vidicon or CCD engineering camera capturing the spacecraft's local environment, solar panel deployment status, and approach imagery of nearby bodies. Analogous to the ISS (Imaging Science Subsystem) wide-angle cameras on Voyager, the Navigation Camera on Cassini, and the LORRI-adjacent context imager on New Horizons. Data is transmitted digitally.
	}
	@MODULE[Experiment]:HAS[#experiment_id[ProbePlasma]]
	{
		%ec_rate = 0.01
		%data_rate = 1.5		// 1.5 Mb total
		@data_rate /= 21600		// over 6 hours of continuous sampling
		%requires =
		%resources =
		%experiment_desc = A solar-wind plasma instrument measuring ion and electron bulk parameters (density, velocity, temperature) using Faraday cups and electrostatic analysers. Generic representation of instruments such as the Plasma Science (PLS) on Pioneer 10/11, the Plasma Experiment (PLS) on Voyager, the CAPS on Cassini, and the JADE ion detector on Juno.
	}
	@MODULE[Experiment]:HAS[#experiment_id[ProbeMagn]]
	{
		%ec_rate = 0.005
		%data_rate = 1.0		// 1 Mb total
		@data_rate /= 21600		// over 6 hours continuous
		%requires =
		%resources =
		%experiment_desc = A boom-mounted fluxgate or helium vector magnetometer measuring the three-component interplanetary magnetic field with pT-level sensitivity. Based on the Helium Vector Magnetometer (HVM) on Pioneer 10/11 and the dual-technique magnetometer (FGM + search coil MAG) on Voyager 1 and 2. Maps the IMF spiral structure, sector boundaries, and planetary magnetic fields.
	}
}
