// Kerbalism science wiring for Station Parts Expansion Redux (SSPX).
// Four experiments: biology (fish, plants), cupola observation, and telescope.
// Crew operations required for the life science and visual experiments.
// NOTE: bd_TelescopeObservation is patched → sspxTelescopeObservation when SSPX
// is installed (via Bluedog_DB sciencedefs_compatibility.cfg), so this file
// also covers that Bluedog redirect.

// ============================================================
// 1 — KERBALISM_EXPERIMENT NODES
// ============================================================

@EXPERIMENT_DEFINITION:HAS[#id[sspxFishStudy]]:NEEDS[StationPartsExpansionRedux,Kerbalism]:FOR[RP-0]
{
	KERBALISM_EXPERIMENT { SampleMass = 0; IncludeExperiment = }
}
@EXPERIMENT_DEFINITION:HAS[#id[sspxPlantGrowth]]:NEEDS[StationPartsExpansionRedux,Kerbalism]:FOR[RP-0]
{
	KERBALISM_EXPERIMENT { SampleMass = 0; IncludeExperiment = }
}
@EXPERIMENT_DEFINITION:HAS[#id[sspxVisualObservation]]:NEEDS[StationPartsExpansionRedux,Kerbalism]:FOR[RP-0]
{
	KERBALISM_EXPERIMENT { SampleMass = 0; IncludeExperiment = }
}
@EXPERIMENT_DEFINITION:HAS[#id[sspxTelescopeObservation]]:NEEDS[StationPartsExpansionRedux,Kerbalism]:FOR[RP-0]
{
	KERBALISM_EXPERIMENT { SampleMass = 0; IncludeExperiment = }
}

// ============================================================
// 2 — REPLACE ModuleScienceExperiment → Experiment
// ============================================================

@PART[*]:HAS[@MODULE[ModuleScienceExperiment]:HAS[#experimentID[sspxFishStudy]]]:NEEDS[StationPartsExpansionRedux,Kerbalism]:FOR[RP-0-Kerbalism]
{
	!MODULE[ModuleScienceExperiment]:HAS[#experimentID[sspxFishStudy]] {}
	MODULE
	{
		name = Experiment
		experiment_id = sspxFishStudy
	}
}
@PART[*]:HAS[@MODULE[ModuleScienceExperiment]:HAS[#experimentID[sspxPlantGrowth]]]:NEEDS[StationPartsExpansionRedux,Kerbalism]:FOR[RP-0-Kerbalism]
{
	!MODULE[ModuleScienceExperiment]:HAS[#experimentID[sspxPlantGrowth]] {}
	MODULE
	{
		name = Experiment
		experiment_id = sspxPlantGrowth
	}
}
@PART[*]:HAS[@MODULE[ModuleScienceExperiment]:HAS[#experimentID[sspxVisualObservation]]]:NEEDS[StationPartsExpansionRedux,Kerbalism]:FOR[RP-0-Kerbalism]
{
	!MODULE[ModuleScienceExperiment]:HAS[#experimentID[sspxVisualObservation]] {}
	MODULE
	{
		name = Experiment
		experiment_id = sspxVisualObservation
	}
}
@PART[*]:HAS[@MODULE[ModuleScienceExperiment]:HAS[#experimentID[sspxTelescopeObservation]]]:NEEDS[StationPartsExpansionRedux,Kerbalism]:FOR[RP-0-Kerbalism]
{
	!MODULE[ModuleScienceExperiment]:HAS[#experimentID[sspxTelescopeObservation]] {}
	MODULE
	{
		name = Experiment
		experiment_id = sspxTelescopeObservation
	}
}

// ============================================================
// 3 — CONFIGURE PARAMETERS
// ============================================================

@PART[*]:HAS[@MODULE[Experiment]]:NEEDS[StationPartsExpansionRedux,Kerbalism]:AFTER[RP-0-Kerbalism]
{
	@MODULE[Experiment]:HAS[#experiment_id[sspxFishStudy]]
	{
		// Aquatic Habitat (AQH) on JAXA EF-1: medaka fish in microgravity
		// 14-day experiment, crew monitors daily; no physical sample return in Kerbalism
		%ec_rate = 0.3
		%data_rate = 20.0		// 20 Mb video/imaging data
		@data_rate /= 1209600		// over 14 days
		%requires =
		%resources =
		%experiment_desc = An aquatic habitat housing medaka fish or zebrafish for studies of skeletal muscle atrophy, bone demineralisation, vestibular adaptation, and reproduction in microgravity. Based on the JAXA Aquatic Habitat (AQH) flown on HTV-2 (2011). Crew check-ins required for behavioural observation and vital signs logging.
		%crew_operate = CrewOnly
	}
	@MODULE[Experiment]:HAS[#experiment_id[sspxPlantGrowth]]
	{
		// VEGGIE / APH plant growth unit — lettuce and flowering plants
		// 30-day growth cycle, crew harvests, some samples returned
		%ec_rate = 0.5
		%data_rate = 30.0		// 30 Mb imagery and sensor logs
		@data_rate /= 2592000		// over 30 days
		%requires =
		%resources =
		%experiment_desc = A plant growth chamber using LED lighting and a root substrate to study seed germination, growth rates, and nutrient cycling in microgravity. Based on VEGGIE (Vegetable Production System) and the Advanced Plant Habitat (APH) on the ISS. Produces edible crops including romaine lettuce, zinnias, and radishes. Crew required for seeding, watering, and harvest.
		%crew_operate = CrewOnly
	}
	@MODULE[Experiment]:HAS[#experiment_id[sspxVisualObservation]]
	{
		// Cupola Earth/space observation: astronaut photography and
		// Earth-observation coordination (CEO programme)
		%ec_rate = 0.05
		%data_rate = 5.0		// 5 Mb observation logs + metadata
		@data_rate /= 86400		// per 24-hour session
		%requires =
		%resources =
		%experiment_desc = Earth and space visual observations conducted from a wide-field cupola or observation window. Combines the ISS Crew Earth Observations (CEO) programme with astrophotographic surveys. Astronauts document geological phenomena, weather systems, ocean colour, light pollution, and aurora.
		%crew_operate = CrewOnly
	}
	@MODULE[Experiment]:HAS[#experiment_id[sspxTelescopeObservation]]
	{
		// Station-mounted telescope (analog to Mir PRIRODA or ISS-EF telescopes)
		// Moderate-resolution optical/UV telescope; 7-day survey cycle
		%ec_rate = 1.0
		%data_rate = 100.0		// 100 Mb imagery
		@data_rate /= 604800		// over 7 days
		%requires =
		%resources =
		%experiment_desc = A station-mounted optical/near-UV telescope for Earth observation and astrophysical surveys. Based on the Mir PRIRODA Earth resources complex and early ISS Exposed Facility telescope concepts. Provides resolution and sensitivity between hand-held cameras and dedicated observatory satellites.
	}
}
