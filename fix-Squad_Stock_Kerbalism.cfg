// ============================================================
// 3 — CONFIGURE EXPERIMENT PARAMETERS
// ============================================================

@PART[*]:HAS[@MODULE[Experiment]]:NEEDS[Kerbalism]:AFTER[RP-0-Kerbalism]
{
	@MODULE[Experiment]:HAS[#experiment_id[mysteryGoo]]
	{
		%ec_rate = 0.01
		%data_rate = 1.0		// 1 Mb total
		@data_rate /= 1800		// over 30 minutes
		%requires =
		%resources =
		%experiment_desc = A pressurised container of biological fluid exposed to the space environment through a valve. Changes in viscosity, fluorescence, and motility are documented by camera. Used as a versatile analogue for early biological and fluid physics in space.
	}
	@MODULE[Experiment]:HAS[#experiment_id[mobileMaterialsLab]]
	{
		%SampleMass = 0.0005
		%ec_rate = 0.1
		%data_rate = 5.0		// 5 Mb processing telemetry
		@data_rate /= 3600		// over 1 hour
		%requires =
		%resources =
		%experiment_desc = A sealed bay exposing material coupons (metals, polymers, semi-conductors) to thermal cycling and UV in the space environment. Samples are retrieved on landing and analysed for structural changes, radiation damage, and outgassing. Based on early materials exposure experiments on Gemini and early Agena targets.
		%crew_operate = CrewOnly
	}
	@MODULE[Experiment]:HAS[#experiment_id[seismicScan]]
	{
		%ec_rate = 0.01
		%data_rate = 2.0		// 2 Mb seismic waveforms
		@data_rate /= 86400		// over 24 hours passive recording
		%requires = SurfaceVessel
		%resources =
		%experiment_desc = The ALSEP Passive Seismic Experiment (PSE), deployed on Apollo 11–16. Three long-period and one short-period seismometers recorded moonquakes, meteoroid impacts, and thermal cracking. Revealed the Moon has a crust ~60 km thick and a partially molten outer core.
	}
	@MODULE[Experiment]:HAS[#experiment_id[gravityScan]]
	{
		%ec_rate = 0.05
		%data_rate = 1.0		// 1 Mb Doppler tracking data
		@data_rate /= 21600		// over 6 hours orbital coverage
		%requires =
		%resources =
		%experiment_desc = A VHF S-band Doppler tracking transponder used to measure spacecraft velocity perturbations due to gravity anomalies (mascons). Based on the Apollo Subsatellite Doppler Tracking experiment (PFS-1 and PFS-2, 1971–72), which produced the first detailed lunar gravity maps.
	}
	@MODULE[Experiment]:HAS[#experiment_id[atmosphereAnalysis]]
	{
		%ec_rate = 0.1
		%data_rate = 2.0		// 2 Mb mass spectra + compositional logs
		@data_rate /= 3600		// over 1 hour sampling
		%requires = AtmospherePresent:true
		%resources =
		%experiment_desc = A passive atmospheric sampling mass spectrometer drawing gas through a molecular separator. Based on the Viking GCMS (Gas Chromatograph Mass Spectrometer, 1976) which identified CO₂, N₂, Ar and organic upper limits in the Martian atmosphere. Requires atmospheric entry or surface operation.
	}
	@MODULE[Experiment]:HAS[#experiment_id[magnetometer]]
	{
		%ec_rate = 0.01
		%data_rate = 1.0		// 1 Mb vector field timeseries
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = A triaxial fluxgate magnetometer measuring the ambient magnetic field vector. In the ISS application (FPMU) it monitors the spacecraft floating potential and local plasma environment to characterise electrostatic charging of the solar arrays.
	}
	@MODULE[Experiment]:HAS[#experiment_id[infraredTelescope]]
	{
		%ec_rate = 0.5
		%data_rate = 50.0		// 50 Mb survey catalogue
		@data_rate /= 86400		// over 24 hours
		%requires =
		%resources =
		%experiment_desc = A wide-field infrared survey telescope scanning the inner solar system for heat signatures of near-Earth asteroids and comets. Based on the Wide-field Infrared Survey Explorer (WISE, 2009) and the proposed NEOCam asteroid survey mission.
	}
}
