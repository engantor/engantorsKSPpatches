// Kerbalism wiring for stock Squad experiments not covered by RP-1 Science files.
// crewReport, evaReport, temperatureScan, barometerScan, surfaceSample are already
// handled by GameData/RP-1/Science/Experiments/. This file covers the remaining
// stock experiments that are actively used on mod parts in this install.

// ============================================================
// 1 — ADD KERBALISM_EXPERIMENT TO EXPERIMENT_DEFINITIONS
// ============================================================

// mysteryGoo — used on Bluedog LM and many RN_US_Probes
@EXPERIMENT_DEFINITION:HAS[#id[mysteryGoo]]:NEEDS[Kerbalism]:FOR[RP-0]
{
	KERBALISM_EXPERIMENT { SampleMass = 0; IncludeExperiment = }
}

// mobileMaterialsLab — used on Bluedog GATV and RN_US_Probes KH-9
@EXPERIMENT_DEFINITION:HAS[#id[mobileMaterialsLab]]:NEEDS[Kerbalism]:FOR[RP-0]
{
	// Physical sample: small specimens returned for lab analysis
	KERBALISM_EXPERIMENT { SampleMass = 0.0005; IncludeExperiment = }
}

// seismicScan — used on Bluedog ALSEP Passive Seismic
@EXPERIMENT_DEFINITION:HAS[#id[seismicScan]]:NEEDS[Kerbalism]:FOR[RP-0]
{
	KERBALISM_EXPERIMENT { SampleMass = 0; IncludeExperiment = }
}

// gravityScan — used on Bluedog Apollo VHF Doppler Antenna
@EXPERIMENT_DEFINITION:HAS[#id[gravityScan]]:NEEDS[Kerbalism]:FOR[RP-0]
{
	KERBALISM_EXPERIMENT { SampleMass = 0; IncludeExperiment = }
}

// atmosphereAnalysis — used on Bluedog Viking Mars Lander
@EXPERIMENT_DEFINITION:HAS[#id[atmosphereAnalysis]]:NEEDS[Kerbalism]:FOR[RP-0]
{
	KERBALISM_EXPERIMENT { SampleMass = 0; IncludeExperiment = }
}

// magnetometer — stock definition; used by HabTech2 FPMU and Bluedog parts
@EXPERIMENT_DEFINITION:HAS[#id[magnetometer]]:NEEDS[Kerbalism]:FOR[RP-0]
{
	KERBALISM_EXPERIMENT { SampleMass = 0; IncludeExperiment = }
}

// infraredTelescope — SENTINEL telescope (Squad Asteroid Day DLC)
@EXPERIMENT_DEFINITION:HAS[#id[infraredTelescope]]:NEEDS[Kerbalism]:FOR[RP-0]
{
	KERBALISM_EXPERIMENT { SampleMass = 0; IncludeExperiment = }
}

// ============================================================
// 2 — REPLACE ModuleScienceExperiment WITH Kerbalism Experiment
// ============================================================

@PART[*]:HAS[@MODULE[ModuleScienceExperiment]:HAS[#experimentID[mysteryGoo]]]:NEEDS[Kerbalism]:FOR[RP-0-Kerbalism]
{
	!MODULE[ModuleScienceExperiment]:HAS[#experimentID[mysteryGoo]] {}
	MODULE
	{
		name = Experiment
		experiment_id = mysteryGoo
	}
}
@PART[*]:HAS[@MODULE[ModuleScienceExperiment]:HAS[#experimentID[mobileMaterialsLab]]]:NEEDS[Kerbalism]:FOR[RP-0-Kerbalism]
{
	!MODULE[ModuleScienceExperiment]:HAS[#experimentID[mobileMaterialsLab]] {}
	MODULE
	{
		name = Experiment
