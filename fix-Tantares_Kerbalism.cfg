// Kerbalism science wiring for Tantares (Soyuz/Salyut era parts)
// and TantaresSP (Soviet science packages).
// Neither mod ships Kerbalism compatibility; all experiment IDs are data-files
// (no physical sample return) reflecting the Soviet program's reliance on
// radio transmission of science data.

// ============================================================
// 1 — KERBALISM_EXPERIMENT NODES
// ============================================================

// Tantares core instruments (on spacecraft/station parts)
@EXPERIMENT_DEFINITION:HAS[#id[tantares_radiometer_scan]]:NEEDS[Tantares,Kerbalism]:FOR[RP-0]
{
	KERBALISM_EXPERIMENT { SampleMass = 0; IncludeExperiment = }
}
