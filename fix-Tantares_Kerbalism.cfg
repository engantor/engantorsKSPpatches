// ============================================================

@PART[*]:HAS[@MODULE[ModuleScienceExperiment]:HAS[#experimentID[tantares_radiometer_scan]]]:NEEDS[Tantares,Kerbalism]:FOR[RP-0-Kerbalism]
{
	!MODULE[ModuleScienceExperiment]:HAS[#experimentID[tantares_radiometer_scan]] {}
	MODULE
	{
		name = Experiment
		experiment_id = tantares_radiometer_scan
	}
}
