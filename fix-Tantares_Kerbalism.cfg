// ============================================================
// 3 — CONFIGURE PARAMETERS
// ============================================================

@PART[*]:HAS[@MODULE[Experiment]]:NEEDS[Tantares,Kerbalism]:AFTER[RP-0-Kerbalism]
{
	@MODULE[Experiment]:HAS[#experiment_id[tantares_radiometer_scan]]
	{
		%ec_rate = 0.1
		%data_rate = 10.0		// 10 Mb
		@data_rate /= 43200		// over 12 hours
		%requires =
		%resources =
		%experiment_desc = A scanning microwave radiometer covering 0.8–37 GHz measuring surface emission temperatures and atmospheric moisture profiles. Based on the KATE-500 and MR-12 instruments flown on Soviet Cosmos and Mir missions to study sea ice extent, soil moisture, and precipitation.
	}
	@MODULE[Experiment]:HAS[#experiment_id[tantares_laser_reflector]]
	{
		%ec_rate = 0.001
		%data_rate = 0.5		// 0.5 Mb ranging telemetry
		@data_rate /= 43200		// over 12 hours of ground station passes
		%requires =
		%resources =
		%experiment_desc = A corner-cube laser retroreflector array used for precision ranging by ground-based SLR (Satellite Laser Ranging) stations. Provides orbital data for geodetic studies. Based on retroreflectors on Soyuz, Meteor, Ajisai, and numerous geodetic satellites.
	}
	@MODULE[Experiment]:HAS[#experiment_id[tantares_visible_light_camera]]
	{
		%ec_rate = 0.2
		%data_rate = 20.0		// 20 Mb imagery
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = A high-resolution visible-light camera for Earth observation and planetary imaging. Based on the MKF-6 multispectral camera on Salyut-7/Mir and the Soviet Zenit photoreconnaissance cameras. Provides sub-metre GSD imagery for topographic and geological mapping.
	}
	@MODULE[Experiment]:HAS[#experiment_id[tantares_ultraviolet_light_camera]]
	{
		%ec_rate = 0.2
		%data_rate = 15.0		// 15 Mb
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = An ultraviolet telescope and camera for astrophysical and atmospheric observations. Based on the Astron UV telescope (1983) and the Glazar UV telescope aboard Mir (1987), which catalogued UV sources and observed Supernova 1987A.
	}
	@MODULE[Experiment]:HAS[#experiment_id[tantares_infrared_light_camera]]
	{
		%ec_rate = 0.1
		%data_rate = 10.0		// 10 Mb
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = An infrared camera array measuring surface thermal emission and atmospheric temperature profiles. Based on instruments on Meteor-3 and the Soviet Venera IR mapping instruments. Used for geological mapping, forest fire detection, and oceanographic surveys.
	}
}

@PART[*]:HAS[@MODULE[Experiment]]:NEEDS[TantaresSP,Kerbalism]:AFTER[RP-0-Kerbalism]
{
	@MODULE[Experiment]:HAS[#experiment_id[tantares_sp_ion_trap]]
	{
		%ec_rate = 0.01
		%data_rate = 0.5		// 0.5 Mb
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = A retarding potential analyser (ion trap) measuring the energy spectrum and composition of ionospheric and solar-wind plasma. Based on instruments on Sputnik-3 (1958) and later Soviet plasma physics packages on Cosmos and Salyut.
	}
	@MODULE[Experiment]:HAS[#experiment_id[tantares_sp_micrometeoroid]]
	{
		%ec_rate = 0.001
		%data_rate = 0.3		// 0.3 Mb event log
		@data_rate /= 86400		// over 24 hours
		%requires =
		%resources =
		%experiment_desc = A piezoelectric micrometeoroid counter measuring particle flux and momentum in low Earth orbit. Based on instruments on Sputnik-3 and early Cosmos satellites. Data contributed to early models of the meteoroid environment for spacecraft design.
	}
	@MODULE[Experiment]:HAS[#experiment_id[tantares_sp_photometer]]
	{
		%ec_rate = 0.01
		%data_rate = 0.5		// 0.5 Mb
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = A silicon photodiode photometer measuring solar irradiance and zodiacal light. Based on Soviet photometric instruments on Salyut stations and Cosmos biosatellites used for studies of solar variability and atmospheric albedo.
	}
	@MODULE[Experiment]:HAS[#experiment_id[tantares_sp_laser_reflector]]
	{
		%ec_rate = 0.001
		%data_rate = 0.5		// 0.5 Mb
		@data_rate /= 43200		// over 12 hours
		%requires =
		%resources =
		%experiment_desc = A Soviet-standard corner-cube laser retroreflector for ground-based SLR geodesy. Provides precise orbit determination and contributes to the terrestrial reference frame.
	}
	@MODULE[Experiment]:HAS[#experiment_id[tantares_sp_cosmic_ray_detector]]
	{
		%ec_rate = 0.001
		%data_rate = 0.5		// 0.5 Mb
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = A scintillation or Geiger-Müller cosmic ray detector measuring high-energy particle flux. Based on instruments on Sputnik-1/2/3 and Cosmos radiation physics missions. Contributed to early Soviet mapping of the radiation environment in Earth orbit.
	}
	@MODULE[Experiment]:HAS[#experiment_id[tantares_sp_xray_spectrometer]]
	{
		%ec_rate = 0.1
		%data_rate = 5.0		// 5 Mb
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = A proportional counter or scintillation X-ray spectrometer covering 1–100 keV for solar flare monitoring and astrophysical source surveys. Based on the ROENTGEN X-ray telescope on Mir (1987) and instruments on Granat (1989).
	}
	@MODULE[Experiment]:HAS[#experiment_id[tantares_sp_gamma_ray_spectrometer]]
	{
		%ec_rate = 0.05
		%data_rate = 3.0		// 3 Mb
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = A NaI/CsI scintillation gamma-ray spectrometer measuring fluxes above 0.3 MeV from solar flares, cosmic gamma-ray bursts, and diffuse galactic emission. Based on the SIGMA telescope on Granat and gamma-ray instruments on Cosmos and Salyut.
	}
	@MODULE[Experiment]:HAS[#experiment_id[tantares_sp_visible_light_camera]]
	{
		%ec_rate = 0.2
		%data_rate = 20.0		// 20 Mb
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = A compact film or CCD camera for Earth observation and astrophotography from a science package. Based on cameras flown on Soviet science platform packages attached to Salyut and Mir.
	}
	@MODULE[Experiment]:HAS[#experiment_id[tantares_sp_ultraviolet_light_camera]]
	{
		%ec_rate = 0.2
		%data_rate = 15.0		// 15 Mb
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = A UV telescope/camera for astrophysical surveys of stellar UV spectra and nebular emission. Based on instruments on the Astron observatory (1983) and Soviet UV astronomy packages deployed from Mir.
	}
	@MODULE[Experiment]:HAS[#experiment_id[tantares_sp_infrared_light_camera]]
	{
		%ec_rate = 0.1
		%data_rate = 10.0		// 10 Mb
		@data_rate /= 21600		// over 6 hours
		%requires =
		%resources =
		%experiment_desc = An infrared imaging system for surface thermal mapping and atmospheric soundings. Based on IR instruments on Soviet Cosmos remote sensing and meteorological satellites.
	}
}
