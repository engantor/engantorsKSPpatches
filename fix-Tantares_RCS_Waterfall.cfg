// ============================================================
// Tantares RCS - Waterfall plume effects for RSS/RO rescale
// ============================================================
// Required: Waterfall, RealismOverhaul, Tantares
// ============================================================
//
// Tantares RCS parts use stock MODEL_MULTI_PARTICLE effects.
// In RO they are rescaled to 1.61× but the stock particles
// remain at 1× size, making them appear tiny on scaled parts.
//
// This adds ROWaterfall RCS effects scaled properly by
// rescaleFactor, following the same pattern as:
//   Waterfall_Configs/ReStockPlus/restockplus_rcs.cfg
//
// Engine plume rescaling is handled by:
//   Waterfall_Configs/Tantares/TantaresWF.cfg
// which applies @scale[*] *= #$/rescaleFactor$ to all listed
// Tantares engines. If a specific engine plume is wrong, add
// its part name to that file's part selector list.
//
// Parts covered here (all use monoTransform or thrustTransform):
//   eridani_rcs_linear_srf_1/2  — Mir-style linear RCS
//   octans_rcs_srf_1/2/3/4      — Soyuz-style RCS blocks
//   octans_rcs_srf_*_extended   — Extended-nozzle variants
//   octans_basic_rcs_srf_1/2/3/4— Basic Soyuz RCS
//   aquila_rcs_srf_1            — FGB/Zarya quad RCS
// ============================================================


// ------------------------------------------------------------
// Group A: Tantares RCS parts using monoTransform
// Covers: eridani (Mir linear), octans (Soyuz family)
// Propellant: UDMH/NTO hypergolic — autoConfig = rcs gives
// standard hydrazine-class plume appearance
// Scale = 1.61 × 0.797 ≈ 1.28 at the default Tantares RO scale
// ------------------------------------------------------------

@PART[eridani_rcs_linear_srf_1|eridani_rcs_linear_srf_2|octans_rcs_srf_1|octans_rcs_srf_2|octans_rcs_srf_3|octans_rcs_srf_4|octans_rcs_srf_1_extended|octans_rcs_srf_2_extended|octans_rcs_srf_3_extended|octans_rcs_srf_4_extended|octans_basic_rcs_srf_1|octans_basic_rcs_srf_2|octans_basic_rcs_srf_3|octans_basic_rcs_srf_4]:HAS[#RSSROConfig]:BEFORE[ROWaterfall]:NEEDS[Waterfall,Tantares]
{
	ROWaterfall
	{
		autoConfig = rcs
		transform = monoTransform
		position = 0, 0, 0
		rotation = 0, 0, 0
		scale = 1, 1, 1
		@scale[*] *= #$/rescaleFactor$	// = 1.61 in RO
		@scale[*] *= 0.7967032967		// calibration constant (matches RestockPlus baseline)
	}
}


// ------------------------------------------------------------
// Group B: aquila_rcs_srf_1 (FGB/Zarya quad thruster cluster)
// Uses thrustTransform instead of monoTransform
// ------------------------------------------------------------

@PART[aquila_rcs_srf_1]:HAS[#RSSROConfig]:BEFORE[ROWaterfall]:NEEDS[Waterfall,Tantares]
{
	ROWaterfall
	{
		autoConfig = rcs
		transform = thrustTransform
		position = 0, 0, 0
		rotation = 0, 0, 0
		scale = 1, 1, 1
		@scale[*] *= #$/rescaleFactor$
		@scale[*] *= 0.7967032967
	}
}
