// Make all htRobotics parts visible in the RSS/RO VAB.
// RO's zzzRealismOverhaul pass hides any part without %RSSROConfig = True.
// htRobotics has no RO patch of its own, so all 13 parts are invisible by default.
//
// Parts covered (all use the ht_ prefix, distinct from HabTech2's ht2_ prefix):
//   Canadarm2 (SSRMS): ht_canadarm2_LEE, ht_canadarm2_boom, ht_canadarm2_servo
//   Canadarm1 (SRMS):  ht_C1_LEE, ht_C1_boom, ht_C1_elbow, ht_C1_pitch, ht_C1_rotator
//   JEM RMS (JEMRMS):  ht_JEM_RMS_boom, ht_JEM_RMS_servo
//   Fixtures:          ht_PDGF, ht_grappleFixture, ht_grappleFixtureKibo

@PART[ht_*]:NEEDS[htRobotics]:AFTER[RealismOverhaul]
{
	%RSSROConfig = True
}
