// ============================================================
// Kerbalism ROKerbalism life-support resources for Artemis Construction Kit
// (GameData/Benjee10_Orion by Benjee10)
//
// Only applies with the RO Kerbalism profile
// (:NEEDS[ProfileRealismOverhaul]).
//
// Consumption rates from ROKerbalism.cfg (per kerbal per day):
//   Food             5.84928  L/day
//   Water            3.87072  L/day
//   Oxygen         591.84     L/day
//   LithiumHydroxide   0.879  L/day  (CO2 scrubber)
//
// Waste containers sized at ~ consumption × mission duration.
// ============================================================


// ============================================================
// SECTION 1 — Orion Crew Module
// REMOVED: the official RO_SuggestedMods/Benjee10_Orion/RO_Orion.cfg
// (SkyPhoenix999) already gives the capsule a full ModuleFuelTanks with
// Food / Water / Oxygen / life-support supplies, and the ESM carries the
// long-duration O2 / N2 / Water. Adding our own TANKs here produced
// duplicate Food/Water tanks. Capsule + ESM life support is now handled
// entirely by RO_Orion.cfg.
// ============================================================


// ============================================================
// SECTION 2 — HLS pod (4 crew × 7 days surface ops)
// RO_Orion.cfg is Orion-only and does not cover HLS, so this stays.
// Orion stays in lunar orbit; HLS carries crew to surface and back.
// Surface mission reference: ~7 days (Artemis baseline).
// ============================================================

@PART[benjee10_HLS_pod]:NEEDS[ProfileRealismOverhaul]:AFTER[RealismOverhaul]
{
	@description ^= :$: Supports a crew of 4 for 7 days.:

	@MODULE[ModuleFuelTanks]
	{
		TANK
		{
			// 4 × 7 × 5.84928 = 163.78 L
			name = Food
			amount = 164
			maxAmount = 164
		}
		TANK
		{
			// 4 × 7 × 3.87072 = 108.38 L
			name = Water
			amount = 108
			maxAmount = 108
		}
		TANK
		{
			// 4 × 7 × 591.84 = 16,571.5 L
			name = Oxygen
			amount = 16572
			maxAmount = 16572
		}
		TANK
		{
			// 4 × 7 × 0.879 = 24.6 L
			name = LithiumHydroxide
			amount = 25
			maxAmount = 25
		}
		TANK
		{
			name = Waste
			amount = 0
			maxAmount = 118
		}
		TANK
		{
			name = WasteWater
			amount = 0
			maxAmount = 108
		}
	}
}
