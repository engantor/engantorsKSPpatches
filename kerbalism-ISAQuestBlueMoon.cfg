// ============================================================
// Kerbalism ROKerbalism life-support patch for ISAQuestBlueMoon
//
// The RO patch (RO-ISAQuestBlueMoon.cfg) already adds Food, Water,
// and Oxygen to the Hab MFT at stock-Kerbalism quantities.
// This file adds the resources the RO patch missed for ROKerbalism:
//   LithiumHydroxide  — CO2 scrubber consumable
//   Waste             — solid metabolic waste container
//   WasteWater        — liquid waste container
//
// Sized for 3 crew × 7 days (Blue Moon Mk2 lunar surface mission).
// Rates from ROKerbalism.cfg:
//   LithiumHydroxide 0.879 L/kerbal/day → 3 × 7 × 0.879 = 18.5 L
// ============================================================

@PART[IQBM_Hab]:NEEDS[ProfileRealismOverhaul]:AFTER[RealismOverhaul]
{
	@MODULE[ModuleFuelTanks]
	{
		TANK
		{
			name = LithiumHydroxide
			amount = 19
			maxAmount = 19
		}
		TANK
		{
			name = Waste
			amount = 0
			maxAmount = 60
		}
		TANK
		{
			name = WasteWater
			amount = 0
			maxAmount = 81
		}
	}
}
