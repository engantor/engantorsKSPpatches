// ============================================================
// kerbalism-Knes.cfg — Kerbalism life-support patches for KNES
// ============================================================
//
// The official KNES_Kerbalism.cfg (in RO_SuggestedMods/Knes/) covers
// the three main cargo supply modules:
//   _Knes_ATV_Cargo          — 5097 L ServiceModule
//   _Knes_STEAM_125_cargo    — 2548.5 L ServiceModule
//   _Knes_STEAM_09375_cargo  — 1274.25 L ServiceModule
//
// This file extends coverage to:
//   _Knes_STEAM_Cargo_Tank   — 2000 L prop module (Section 1)
//   _Knes_Hermes             — European Hermès body (Section 2)
//   Knes_Hermes_HRM          — Hermès Resource Module (Section 2)
//   _Knes_French_Hermes_Crew_Module   — French Hermès (Section 3)
//   _Knes_French_Hermes_Docking_Module — French Hermès (Section 3)
//
// NOTE: Hermès parts do NOT have ModuleFuelTanks, so life support
// resources are added as plain RESOURCE blocks (valid for Kerbalism).
// The Kerbalism Habitat module is added automatically by Kerbalism
// to all crewed parts — no patch needed for that.
//
// RO Kerbalism profile consumption rates (per kerbal per day):
//   Food:             5.84928 u/day   (eating: 1.94976 per 28800s × 3)
//   Water:            3.87072 u/day   (drinking: 0.774144 per 17280s × 5)
//   Oxygen:         591.84   u/day    (breathing: 0.00685/s)
//   LithiumHydroxide: ~0.879  u/day   (non-regen CO2 scrubber)
//   Waste:            5.84928 u/day   (eating output — size container only)
//   WasteWater:       3.87072 u/day   (drinking output — size container only)
//
// Pass: :NEEDS[ProfileRealismOverhaul,Kerbalism]:AFTER[RealismOverhaul]
// ============================================================


// ============================================================
// SECTION 1 — STEAM Cargo Tank
// ============================================================

// STEAM "Blamont" Propellant Module — secondary consumable capacity.
// Primary purpose is MMH/MON-3 propellant delivery; secondary slots
// allow the module to carry consumables as part of a mixed cargo mission.
// Volume split: ~1500 L propellant, ~500 L consumables.
@PART[_Knes_STEAM_Cargo_Tank]:NEEDS[ProfileRealismOverhaul,Kerbalism]:AFTER[RealismOverhaul]
{
	@MODULE[ModuleFuelTanks]
	{
		TANK
		{
			name = Food
			amount = 102
			maxAmount = 102
		}
		TANK
		{
			name = Water
			amount = 420
			maxAmount = 420
		}
		TANK
		{
			name = Waste
			amount = 0
			maxAmount = 9
		}
		TANK
		{
			name = WasteWater
			amount = 0
			maxAmount = 105
		}
	}
}


// ============================================================
// SECTION 2 — European Hermès
// ============================================================
//
// _Knes_Hermes        — main spaceplane body, 7 crew, 7-day transit supplies
// Knes_Hermes_HRM     — resource module, 14-day extended-stay supplies for 7 crew
//
// European Hermès was designed for ~7-day orbital transit missions docking
// to Columbus Space Station, with the HRM providing extended-stay supplies.
// No fuel cells or LOX→GOX converter assumed — Oxygen is sized for the
// full duration at the breathing rule rate (0.00685/s per kerbal).
// ============================================================

@PART[_Knes_Hermes]:NEEDS[ProfileRealismOverhaul,Kerbalism]:AFTER[RealismOverhaul]
{
	@description ^= :$: Supports a crew of 7 for 7 days.:

	// 7 crew × 7 days
	RESOURCE
	{
		name = Food
		amount = 287			// 7 × 7 × 5.84928
		maxAmount = 287
	}
	RESOURCE
	{
		name = Water
		amount = 190			// 7 × 7 × 3.87072
		maxAmount = 190
	}
	RESOURCE
	{
		name = Oxygen
		amount = 29000			// 7 × 7 × 591.84
		maxAmount = 29000
	}
	RESOURCE
	{
		name = LithiumHydroxide
		amount = 44				// 7 × 7 × 0.879 (CO2 scrubber)
		maxAmount = 44
	}
	RESOURCE
	{
		name = Waste
		amount = 0
		maxAmount = 287
	}
	RESOURCE
	{
		name = WasteWater
		amount = 0
		maxAmount = 190
	}
}

@PART[Knes_Hermes_HRM]:NEEDS[ProfileRealismOverhaul,Kerbalism]:AFTER[RealismOverhaul]
{
	@description ^= :$: Extended-stay resource module; supports 7 crew for an additional 14 days.:

	// 7 crew × 14 days extended station stay
	RESOURCE
	{
		name = Food
		amount = 574			// 7 × 14 × 5.84928
		maxAmount = 574
	}
	RESOURCE
	{
		name = Water
		amount = 380			// 7 × 14 × 3.87072
		maxAmount = 380
	}
	RESOURCE
	{
		name = Oxygen
		amount = 58000			// 7 × 14 × 591.84
		maxAmount = 58000
	}
	RESOURCE
	{
		name = LithiumHydroxide
		amount = 87				// 7 × 14 × 0.879
		maxAmount = 87
	}
	RESOURCE
	{
		name = Waste
		amount = 0
		maxAmount = 574
	}
	RESOURCE
	{
		name = WasteWater
		amount = 0
		maxAmount = 380
	}
}


