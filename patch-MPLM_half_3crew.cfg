// ============================================================
// HabTech2 MPLM half-module ("Francesco" / Leonardo family) —
// raise crew capacity 1 -> 3.
//
// Matching life-support stock changes (consumables tripled to
// provision 3 crew) are in Engantor/fix-HabTech2_lifesupport.cfg.
//
// Note: the part's IVA (ht2_genericShortIVA) has fewer than 3
// visible seats, so the extra crew won't render inside IVA — this
// is cosmetic only; KSP still seats and life-supports all 3.
// The Kerbalism Habitat volume (15 m3) is a physical property and
// is left unchanged, so 3 crew share ~5 m3 each (cramped but valid).
// ============================================================

@PART[ht2_MPLM_half]
{
	@CrewCapacity = 3
}
