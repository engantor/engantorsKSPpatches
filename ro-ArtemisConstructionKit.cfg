// ============================================================
// RealismOverhaul / RealFuels patches for Artemis Construction Kit
// (GameData/Benjee10_Orion by Benjee10)
//
// ALREADY PATCHED by official RO - nothing to do here for these:
//   PC_5Seg_RSRM  -> RO_SuggestedMods/PhotonCorp/   (engineType = RSRMV)
//   rmm_cotopaxi  -> RO_SuggestedMods/RocketMotorMenagerie/ (engineType = SSME)
//
// rescaleFactor = 1.645 - same value the official PhotonCorp and RMM
// patches use, so RSRM boosters and SSME engines mate flush with ACK
// structure parts.
// ============================================================


// ============================================================
// GLOBAL - RSSROConfig + rescaleFactor
// Applied to every ACK part in a single pass before section patches.
// ============================================================

// NOTE: Orion parts (benjee10_orion_*) are fully configured by the official
// RO_SuggestedMods/Benjee10_Orion/RO_Orion.cfg (SkyPhoenix999). Patching them
// here too makes the two configs race and breaks propellants/helium/scale, so
// this file covers only the SLS / BOLE / HLS hardware RO_Orion does not touch.
@PART[benjee10_SLS_*,benjee10_HLS_*,benjee10_SLS_BOLE_*,Benjee10_SLS_*]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	%rescaleFactor = 1.645
}

// ============================================================
// SECTION 5 - SLS Core Stage
// Real SLS Block 1 core: dry 85,275 kg (incl. engine section + 4 SSMEs).
// Engine section + 4 SSME engines are separate parts in ACK so structural
// core dry ~ 85,275 - 4x3,177 (SSME) - 16,000 (engine section) ~ 57,167 kg.
// Propellant (6:1 O/F by mass, from NASA 537,000 gal statement):
//   LH2:  1,480,000 L  (105,036 kg at 70.97 kg/m3)
//   LOX:    552,543 L  (630,551 kg at 1141 kg/m3)
// Source: NASA SLS fact sheet, spacelaunchreport.com/sls.html
// NOTE: Part already uses LqdHydrogen correctly; Oxidizer -> LqdOxygen.
// ============================================================

@PART[benjee10_SLS_coreStage]:FOR[RealismOverhaul]
{
	@mass = 57.167

	!RESOURCE[LqdHydrogen] {}
	!RESOURCE[Oxidizer] {}
	!RESOURCE[ElectricCharge] {}

	MODULE
	{
		name = ModuleFuelTanks
		type = Cryogenic
		volume = 2032543
		basemass = -1

		TANK
		{
			name = LqdHydrogen
			amount = 1480000
			maxAmount = 1480000
		}
		TANK
		{
			name = LqdOxygen
			amount = 552543
			maxAmount = 552543
		}
		TANK
		{
			name = ElectricCharge
			amount = 5000
			maxAmount = 5000
		}
	}
}


// ============================================================
// SECTION 6 - SLS Exploration Upper Stage (EUS)
// Real EUS (Block 1B): dry ~13,500 kg, prop ~129,000 kg total.
// 4x J-2X (or RL-10 variant) engines attach externally via ACK nodes.
// 6:1 O/F by mass -> LOX 111,000 kg / LH2 18,000 kg.
// Volume: LH2 253,699 L (at 70.97 kg/m3), LOX 97,283 L (at 1141 kg/m3).
// RCS: MonoPropellant -> Hydrazine.
// Source: NASA EUS factsheet (2022).
// ============================================================

@PART[benjee10_SLS_EUS]:FOR[RealismOverhaul]
{
	@mass = 13.5

	!RESOURCE[LqdHydrogen] {}
	!RESOURCE[Oxidizer] {}
	!RESOURCE[MonoPropellant] {}
	!RESOURCE[ElectricCharge] {}

	@MODULE[ModuleRCSFX]
	{
		@resourceName = Hydrazine
		@atmosphereCurve
		{
			@key,0 = 0 220
			@key,1 = 1 100
			@key,4 = DEL
		}
	}

	MODULE
	{
		name = ModuleFuelTanks
		type = Cryogenic
		volume = 350982
		basemass = -1

		TANK
		{
			name = LqdHydrogen
			amount = 253699
			maxAmount = 253699
		}
		TANK
		{
			name = LqdOxygen
			amount = 97283
			maxAmount = 97283
		}
		TANK
		{
			name = Hydrazine
			amount = 120
			maxAmount = 120
		}
		TANK
		{
			name = ElectricCharge
			amount = 5000
			maxAmount = 5000
		}
	}
}


// ============================================================
// SECTION 7 - BOLE Advanced Solid Rocket Motor
// BOLE (Booster for Orange and later SLS Block 2) uses HTPB propellant.
// Per-booster estimates (5-segment): dry ~95,000 kg, prop ~650,000 kg.
// Thrust (5-seg avg): ~16,000 kN; Isp ~278s vac (HTPB higher than PBAN).
// B9PartSwitch manages per-segment volume via baseVolume x volumeMultiplier.
// We add volumeMultiplier = 5 to the 5seg subtype (missing from stock) and
// set baseVolume to the per-segment HTPB volume.
// 650,000 kg / 1770 kg/m3 / 5 segs = 73,446 L per segment.
// Source: Northrop Grumman BOLE overview (preliminary specs).
// ============================================================

@PART[benjee10_SLS_BOLE_booster]:FOR[RealismOverhaul]
{
	@mass = 95.0	// 5-seg dry; B9 addedMass subtypes corrected below

	// Engine: HTPB propellant, realistic SLS Block 2 performance
	@MODULE[ModuleEnginesFX]
	{
		@maxThrust = 16000	// 5-seg average thrust
		@PROPELLANT[SolidFuel] { @name = HTPB }
		@atmosphereCurve
		{
			@key,0 = 0 278
			@key,1 = 1 265
		}
	}

	// B9 segment switch: correct baseVolume, addedMass, and 5-seg multiplier.
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[segments]]
	{
		@baseVolume = 73446

		@SUBTYPE[1seg] { @addedMass = -76.0 }
		@SUBTYPE[2seg] { @addedMass = -57.0 }
		@SUBTYPE[3seg] { @addedMass = -38.0 }
		@SUBTYPE[4seg] { @addedMass = -19.0 }
		@SUBTYPE[5seg] { %volumeMultiplier = 5 }
	}
}

// Remove the B9 MODULE/IDENTIFIER engine-override blocks that cause
// "Could not find matching module" startup errors.  These blocks exist
// in the stock BOLE cfg for per-segment thrust and thrustCurve overrides,
// but B9PartSwitch can no longer resolve ModuleEnginesFX after RF processes
// the part.  Deleting them silences the warnings; the engine still works -
// all segment counts simply share the base maxThrust set above.
@PART[benjee10_SLS_BOLE_booster]:AFTER[RealismOverhaul]
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[segments]]
	{
		@SUBTYPE[1seg] { !MODULE,* {} }
		@SUBTYPE[2seg] { !MODULE,* {} }
		@SUBTYPE[3seg] { !MODULE,* {} }
		@SUBTYPE[4seg] { !MODULE,* {} }
	}

	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[thrustCurveSwitch]]
	{
		@SUBTYPE[steady66] { !MODULE,* {} }
		@SUBTYPE[flat]     { !MODULE,* {} }
	}
}

// Change B9 tank type from SolidFuel -> HTPB so B9-managed propellant is correct
@B9_TANK_TYPE[BOLE_SolidFuel]:NEEDS[RealismOverhaul]
{
	@title = HTPB

	@RESOURCE[SolidFuel]
	{
		@name = HTPB
		@unitsPerVolume = 1
	}
}


// ============================================================
// SECTION 8 - SLS sep motors and BOLE decoupler
// Small solid sep motors: rename SolidFuel -> HTPB.
// ============================================================

@PART[Benjee10_SLS_boosterSepMotor|benjee10_SLS_BOLE_sepMotor]:FOR[RealismOverhaul]
{
	@MODULE[ModuleEngines*]
	{
		@PROPELLANT[SolidFuel] { @name = HTPB }
	}

	@RESOURCE[SolidFuel]
	{
		@name = HTPB
	}
}


// ============================================================
// SECTION 9 - HLS (Human Landing System) parts
// Starship HLS uses LCH4/LOX methalox propulsion.
// HLS_tank / HLS_tankHalf hold main descent/ascent propellant.
// HLS_pod is the crew transfer vehicle (pressurised cabin).
// Masses based on Starship HLS contract requirements (~100 t wet per hop).
// ============================================================

@PART[benjee10_HLS_pod]:FOR[RealismOverhaul]
{
	@mass = 4.5

	!RESOURCE[MonoPropellant] {}

	MODULE
	{
		name = ModuleFuelTanks
		type = ServiceModule
		volume = 1000
		basemass = -1

		TANK
		{
			name = Hydrazine
			amount = 200
			maxAmount = 200
		}
		TANK
		{
			name = ElectricCharge
			amount = 5000
			maxAmount = 5000
		}
	}
}

@PART[benjee10_HLS_tank]:FOR[RealismOverhaul]
{
	@mass = 5.0

	!RESOURCE[Oxidizer] {}

	MODULE
	{
		name = ModuleFuelTanks
		type = Cryogenic
		volume = 350000
		basemass = -1

		TANK
		{
			// LOX at 3.6:1 O/F (mass), density 1141 kg/m3
			name = LqdOxygen
			amount = 200000
			maxAmount = 200000
		}
		TANK
		{
			// LCH4 at 3.6:1 O/F, density 422.6 kg/m3
			name = LqdMethane
			amount = 150000
			maxAmount = 150000
		}
	}
}

@PART[benjee10_HLS_tankHalf]:FOR[RealismOverhaul]
{
	@mass = 2.5

	!RESOURCE[Oxidizer] {}

	MODULE
	{
		name = ModuleFuelTanks
		type = Cryogenic
		volume = 175000
		basemass = -1

		TANK
		{
			name = LqdOxygen
			amount = 100000
			maxAmount = 100000
		}
		TANK
		{
			name = LqdMethane
			amount = 75000
			maxAmount = 75000
		}
	}
}
