// ============================================================
// ro-Knes_Extra.cfg — RO patches for KNES parts not covered
// by the official KNES_Ariane / KNES_Core / KNES_MRK /
// KNES_Hermes / KNES_ATV-STEAM configs.
//
// Covers: Diamant launcher family, L3S / Ariane 1-4 family,
//         Ariane 5 P35/P80 SRBs + small cryo tank,
//         SafeSystem LES adapters, and all parts using stock
//         MonoPropellant or LiquidFuel+Oxidizer that need
//         replacing with real propellants.
//
// All KNES parts use rescaleFactor = 1.44 in RSS to scale
// stock KSP sizes to real-world dimensions.
// ============================================================


// ============================================================
// SECTION 1 — Universal rescale + RSSROConfig
// A single wildcard covers every Diamant and L3S part, plus
// the few Ariane 5 extras not in KNES_Ariane.cfg.
// ============================================================

@PART[_Knes_Booster_P03|_Knes_Diamant*|_Knes_Topaze*|_Knes_H2_Engine*|_Knes_H3_Engine*|_Knes_RCS_Bump*|_Knes_Nano_Cryo*|_Knes_Small_Cryo*|_Knes_Vega_Avum*]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	@rescaleFactor = 1.44
}

@PART[Knes_Command_Minus|_Knes_L3S_AR4_Avionics|_Knes_L3S_Avionics_250|_Knes_L3S_Engine_Viking5|_Knes_L3S_Fin|_Knes_L3S_H4|_Knes_L3S_H8|_Knes_L3S_H22|_Knes_L3S_H45|_Knes_L3S_L33|_Knes_L3S_L140|_Knes_L3S_L220|_Knes_L3S_L220N|_Knes_L3S_PAL|_Knes_L3S_PAP|_Knes_L3S_P40|_Knes_L3S_P120E|_Knes_L3S_Separatron|Knes_Fuel_Tanks_1875_H10|_Knes_L3S_Cryo_LH2_125|_Knes_MonoProp_Engine_1|_Knes_MonoProp_Engine_2]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	@rescaleFactor = 1.44
}

@PART[Knes_Booster_P35|Knes_Booster_P80|Knes_Fuel_Tanks_Small|Knes_Utility_SafeSystem|Knes_Utility_SafeSystem_1875]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	@rescaleFactor = 1.44
}


// ============================================================
// SECTION 2 — Diamant liquid engines
// ============================================================

// Vexin C — Diamant A first-stage engine, UDMH + IRFNA-III
// No ROEngines type exists; manual ModuleEngineConfigs added.
// Real: 269 kN SL / 289 kN vac, Isp 241/278s
// Direct propellant patch — ModuleEngineConfigs crashes RF GetInfo() on KNES parts.
// Note: ullage/ignitions realism lost vs MEC approach, but part compiles cleanly.
@PART[_Knes_Diamant_Engine_09375]:FOR[RealismOverhaul]
{
	@title = Vexin C Engine
	@manufacturer = LRBA / SEP
	@description = The Vexin C powered Diamant A's Coralie first stage using UDMH and IRFNA. First flight 1965.
	@mass = 0.156
	@MODULE[ModuleEnginesFX]
	{
		@maxThrust = 269
		@heatProduction = 100
		@PROPELLANT[LiquidFuel]
		{
			@name = UDMH
			@ratio = 0.4079
		}
		@PROPELLANT[Oxidizer]
		{
			@name = IRFNA-III
			@ratio = 0.5921
		}
		@atmosphereCurve
		{
			@key,0 = 0 278.3
			@key,1 = 1 241.3
			key = 6 0.001
		}
	}
}

// H2 "Crinkle" cryogenic engine — upper-stage LH2/LOX cryo
// Treated as early HM7 variant; ROEngines HM7 config applied.
@PART[_Knes_H2_Engine_09375]:FOR[RealismOverhaul]
{
	@title = HM7 Cryogenic Engine (early)
	@manufacturer = SEP
	@description = An early LH2/LOX cryogenic upper-stage engine in the HM7 family.
	@mass = 0.155
	%engineType = HM7
}

// H3 "Olaf" cryogenic engine — small cryo for nanosats
// Also HM7 family; a smaller/lighter variant.
@PART[_Knes_H3_Engine_0625]:FOR[RealismOverhaul]
{
	@title = HM7 Cryogenic Engine (nano)
	@manufacturer = SEP
	@description = Miniaturised LH2/LOX cryogenic engine for very small upper stages.
	@mass = 0.100
	%engineType = HM7
}

// Diamant Aileron B — fin with integrated attitude thruster
// Direct propellant patch — ModuleEngineConfigs crashes RF GetInfo() on KNES parts.
// Stock has LiquidFuel+Oxidizer and 3 atmosphereCurve keys (0 260, 1 220, 7 0.001).
@PART[_Knes_Diamant_Aileron_B]:FOR[RealismOverhaul]
{
	@title = Diamant Attitude Fin
	@manufacturer = LRBA
	@description = Diamant A's aerodynamic fin with integrated vernier thruster for roll control.
	@mass = 0.030
	// Both stock propellants renamed in-place — adding/deleting PROPELLANT nodes
	// crashes ModuleEnginesRF.GetInfo() at [0x0014d]. Rename Oxidizer→Helium reuses
	// the existing node; ignoreForIsp added via % (insert-if-absent).
	@MODULE[ModuleEnginesFX]
	{
		@maxThrust = 2
		@heatProduction = 10
		@PROPELLANT[LiquidFuel]
		{
			@name = Hydrazine
			@ratio = 1.0
		}
		@PROPELLANT[Oxidizer]
		{
			@name = Helium
			@ratio = 12.5
			%ignoreForIsp = True
		}
		@atmosphereCurve
		{
			@key,0 = 0 220
			@key,1 = 1 100
			@key,2 = 7 0.001
		}
	}
	!RESOURCE[LiquidFuel] {}
	!RESOURCE[Oxidizer] {}
	MODULE
	{
		name = ModuleFuelTanks
		type = ServiceModule
		volume = 5
		basemass = -1
		TANK { name = Hydrazine; amount = 4;  maxAmount = 4 }
		TANK { name = Helium;    amount = 50; maxAmount = 50 }
	}
}


