// ============================================================
// RealismOverhaul / RealFuels patch for PEKKAsMods launchers
// Covers: Falcon 9/Heavy, Electron, Firefly Alpha, Vulcan Centaur,
//         Starship/Super Heavy, Helios (fictional), Psyche probe
//
// Engine types sourced from RO Engine_Configs/:
//   Merlin1, RutherfordEngine, RutherfordVac, RL10, Raptor, RVac, GEM-63XL
//
// Propellant masses from:
//   spacelaunchreport.com / Everyday Astronaut / public ULA/SpaceX datasheets
// ============================================================

// Global RSSROConfig — all PEKKA parts belong in RSS
@PART[Falcon9-*,Electron-*,Alpha-*,Vulcan-*,GEM-63XL,GEM-63XL-Decoupler]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
}
@PART[Raptor-*,SuperHeavy,SuperHeavy-*,Starship-*,StarshipV1-*,StarshipV2,StarshipV2-*,Helios-*,Psyche,SLC-41]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
}


// ============================================================
// SECTION 1 — Falcon 9 / Falcon Heavy: engines
// Merlin 1D: 914 kN SL / 934 kN vac, Isp 282/311, LOX/RP-1
// MVac: 934 kN vac, Isp 348, LOX/RP-1
// engineType = Merlin1 covers all Merlin variants inc. vacuum
// ============================================================

@PART[Falcon9-Merlin]:FOR[RealismOverhaul]
{
	%engineType = Merlin1
	@mass = 0.467	// real Merlin 1D dry mass
}

@PART[Falcon9-MVac,Falcon9-Short-MVac]:FOR[RealismOverhaul]
{
	%engineType = Merlin1	// MEC will show Merlin Vacuum config in-game
