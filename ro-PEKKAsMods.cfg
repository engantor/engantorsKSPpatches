// ============================================================
// SECTION 5 — Firefly Alpha: engines
// Reaver: 222.4 kN SL / 258.3 kN vac, Isp 295/342, LOX/RP-1
//   O/F mass ratio 2.5 → volume ratio LqdOxygen:Kerosene = 0.6423:0.3577
// Lightning: 22.2 kN vac, Isp 322, LOX/RP-1, pressure-fed
// Source: Firefly press kit / spaceflight101.com
// No ROEngines config exists — patching manually with MEC
// ============================================================

@PART[Alpha-Reaver]:FOR[RealismOverhaul]
{
	@mass = 0.24
	@title = Firefly Reaver
	@description = LOX/RP-1 first stage engine for Firefly Alpha. 222.4 kN sea level, 258.3 kN vacuum.

	@MODULE[ModuleEnginesFX]
	{
		@maxThrust = 258.3
		!PROPELLANT[LiquidFuel] {}
		!PROPELLANT[Oxidizer] {}
		PROPELLANT
		{
			name = Kerosene
			ratio = 0.3577
			DrawGauge = True
		}
		PROPELLANT
		{
			name = LqdOxygen
			ratio = 0.6423
		}
		@atmosphereCurve
		{
			@key,0 = 0 342
			@key,1 = 1 295
			!key,2 = DEL
		}
	}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEnginesFX
		configuration = Reaver
		origMass = 0.24

		CONFIG
		{
			name = Reaver
			maxThrust = 258.3
			minThrust = 0
			PROPELLANT
			{
				name = Kerosene
				ratio = 0.3577
				DrawGauge = True
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.6423
			}
			atmosphereCurve
			{
				key = 0 342
				key = 1 295
				key = 6 0.001
			}
			ullage = True
			pressureFed = False
			ignitions = 3
			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.5
			}
		}
	}
}

