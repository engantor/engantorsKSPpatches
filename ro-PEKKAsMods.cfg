// ============================================================
// SECTION 9 — Starship / Super Heavy: engines
// Raptor 2: 2,200 kN SL, Isp 327/380, LOX/LCH4
// Raptor Vacuum: 1,900 kN vac, Isp 380
// engineType = Raptor / RVac cover the LOX/LCH4 propellant via MEC
// ============================================================

@PART[Raptor-B,Raptor-G]:FOR[RealismOverhaul]
{
	%engineType = Raptor
	@mass = 1.525
}

@PART[Raptor-Vacuum2]:FOR[RealismOverhaul]
{
	%engineType = RVac
	@mass = 1.525
}

// Retarget the Raptors from sub-cooled CooledLqdMethane/CooledLqdOxygen (the
// RealismOverhaul Raptor / RVac config default) to *regular* LqdMethane/
// LqdOxygen, so they burn straight from PEKKA's standard methalox tanks. This
// lets the pre-built craft fly without rebuilding it (engine propellant comes
// from the part config, not the saved craft). Regular vs densified VOLUME ratio
// differs by ~1 %, so O/F stays ~3.55. Runs AFTER[RealismOverhaulEngines], once
// the RO engine CONFIGs are baked in.
@PART[Raptor-B,Raptor-G,Raptor-Vacuum2]:AFTER[RealismOverhaulEngines]
{
	@MODULE[ModuleEngineConfigs]
	{
		@CONFIG[*]
		{
			@PROPELLANT[CooledLqdMethane] { @name = LqdMethane }
			@PROPELLANT[CooledLqdOxygen]  { @name = LqdOxygen }
			@IGNITOR_RESOURCE[CooledLqdMethane] { @name = LqdMethane }
			@IGNITOR_RESOURCE[CooledLqdOxygen]  { @name = LqdOxygen }
		}
	}
}


// ============================================================
// SECTION 10 — Starship / Super Heavy: power
// Tanks + RCS are left to PEKKA's RO-Starship.cfg (regular methalox);
// we only add the ElectricCharge those parts ship without.
// ============================================================

// Keep PEKKA's RO-Starship.cfg tank + RCS as-is (regular LqdMethane/LqdOxygen):
// the Raptors are retargeted to burn regular methalox in SECTION 9, so the
// existing craft flies without a rebuild. The only gap is power — PEKKA's
// SuperHeavy ships no ElectricCharge, which the RCS/grid fins and the kOS
// catch script need, so add it here.
@PART[SuperHeavy]:AFTER[RealismOverhaul]
{
	RESOURCE
	{
		name = ElectricCharge
		amount = 10000
		maxAmount = 10000
	}
}

@PART[StarshipV2]:AFTER[RealismOverhaul]
{
	// Keep PEKKA's regular-methalox tank + RCS; only add ElectricCharge.
	RESOURCE
	{
		name = ElectricCharge
		amount = 10000
		maxAmount = 10000
	}
}


