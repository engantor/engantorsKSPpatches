// ICPS components from BDB — not in RP-1 tree, deleted without this patch.
// bluedog_CentaurD_RL10  = RL-10A-4-2 engine (single, for ICPS)
// bluedog_CentaurD_RL10B2 = RL-10B-2 engine (alternate, for ICPS or EUS)
// bluedog_DeltaIV_DCSS_5m = 5m Delta Cryogenic Second Stage (ICPS tank)
@PART[bluedog_CentaurD_RL10|bluedog_CentaurD_RL10B2]:FOR[xxxRP0]
{
	%TechRequired = veryHeavyRocketry
	%cost = 3000
	%entryCost = 0
	%RP0conf = true
	%MODULE[ModuleTagList] { tag = EngineLiquidTurbo }
}

@PART[bluedog_DeltaIV_DCSS_5m]:FOR[xxxRP0]
{
	%TechRequired = veryHeavyRocketry
	%cost = 2000
	%entryCost = 0
	%RP0conf = true

	// DCSS/ICPS carries a ModuleCommand, so RP-1 auto-adds
	// ModuleAvionics{massLimit=0} -> "no controllable avionics".
	// 100 t covers the ICPS (~31 t wet) + Orion/ESM (~26 t) upper
	// composite for the TLI burn, with margin for a co-manifested payload.
	@MODULE[ModuleAvionics]
	{
		@massLimit = 100
	}
}

