// ============================================================
// RP-1 tech tree, avionics, and career costs for Artemis Construction Kit
// All hardware is 2022-era or later — placed in veryHeavyRocketry.
// Avionics added to all command-capable parts (uses @MODULE to patch
// the existing ModuleAvionics added by RP-1's Avionics.cfg).
// Pass: FOR[xxxRP0]
// ============================================================


// ============================================================
// FIX — Keep Orion aux thrusters from being culled by ROEngines
//
// RO_Orion.cfg gives aux thrusters engineType=R4D11, which applies
// real R-4D engine configs (MEC) AND triggers ROEngines' delete:
//   !PART:HAS[~name[ROE-*]&#engineType[R4D11]&#category[Engine]]
//
// Previous fix (set @category=Control) failed: RO_Engines.cfg runs
// at BEFORE[zzzRealismOverhaul] and resets category back to Engine.
//
// Correct fix: delete the engineType tag AFTER MEC is established.
// ModuleEngineConfigs is already baked in by FOR[RealismOverhaulEngines]
// so removing the top-level engineType field is safe — it just breaks
// the delete condition's HAS[#engineType[R4D11]] check.
// ============================================================

@PART[benjee10_orion_auxThruster1|benjee10_orion_auxThruster2]:AFTER[RealismOverhaulEngines]
{
	!engineType = DELETE
}


