// ============================================================
// RP-1 tech tree integration for Benjee10_sharedAssets
// (B10_NDS, B10_IDA, B10_APASv2, benjee10_AJ10_v2, ht2_CBM*)
//
// The RO_Benjee10_sharedAssets.cfg sets RSSROConfig but not
// RP0conf, so RP-1 deletes all these parts in career mode.
// ht2_CBM* are already in RP-1's TREE-Parts.cfg.
// Pass: FOR[xxxRP0]
// ============================================================

// NDS (NASA Docking System) — used on Orion/Gateway
@PART[B10_NDS|B10_NDS_passive]:FOR[xxxRP0]
{
	%TechRequired = largeStationControl
	%cost = 500
	%entryCost = 0
	%RP0conf = true
}

// IDA (International Docking Adapter) — ISS/commercial crew
@PART[B10_IDA]:FOR[xxxRP0]
{
	%TechRequired = largeStationControl
	%cost = 500
	%entryCost = 0
	%RP0conf = true
}

// APAS-95 and hybrid docking ports
@PART[B10_APASv2|B10_hybrid_female|B10_hybrid_male]:FOR[xxxRP0]
{
	%TechRequired = largeStationControl
	%cost = 300
	%entryCost = 0
	%RP0conf = true
}

// AJ10-v2 engine (used on Orion, Dragon, and other spacecraft)
// engineType = AJ10_190 → MON3/MMH, handled by RO engine config
@PART[benjee10_AJ10_v2]:FOR[xxxRP0]
{
	%TechRequired = veryHeavyRocketry
	%cost = 1500
	%entryCost = 0
	%RP0conf = true
	%MODULE[ModuleTagList] { tag = EngineLiquidPump }
}
