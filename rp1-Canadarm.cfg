// ============================================================
// RP-1 tech tree integration for IKRC (Trufiadok)
// "Inverse Kinematics Robot Controller" — Canadarm2, Dextre/SPDM,
// LEE camera, MBSU, mounted in GameData/TrufiadokAirSpaceCo.
//
// Servos use IRServoMinimal (from the bundled IRMin.dll); the
// IkRobotController plugin provides inverse-kinematics control.
//
// NOTE on robotics setup: the full MagicSmokeIndustries Infernal
// Robotics and the Jeast Canadarm1 were REMOVED (moved to
// _RemovedMods). Both IR DLLs defined the same PartModule
// 'ModuleIRServo', and the duplicate corrupted module indexing,
// which broke every robotic servo (including htRobotics' stock
// Breaking Ground arms). Running IKRC alone resolves the clash.
//
// All IKRC parts (TRF*, Ca2*) default to TechRequired = actuators,
// which does not exist in RP-1, so we move them to
// largeScaleOrbitalCon (same node as HabTech2 / htRobotics).
//
// Pass: FOR[xxxRP0]
// ============================================================

@PART[TRF*|Ca2*]:FOR[xxxRP0]
{
	%TechRequired = largeScaleOrbitalCon
	%cost = 500
	%entryCost = 5000
	%RP0conf = true
	%RSSROConfig = true
}
