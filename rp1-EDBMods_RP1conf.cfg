// ============================================================
// EDBMods FutureTech — RP-1 tech tree integration
// ============================================================
//
// All 54 PART definitions in EDBMods/Parts/FutureTech.
// Note: EDB-LH2Lander base PART cfg was missing from the mod;
// GameData/EDBMods/Parts/FutureTech/LH2Lander.cfg was created by Engantor.
//
// Strategy:
//   1. Universal catch-all @PART[EDB-*] sets RSSROConfig,
//      RP0conf, and a safe default tech node so no part is
//      ever invisible in career mode, even if later sections
//      miss something.
//   2. Specific sections override TechRequired and cost for
//      each logical group.
//
// The existing RO-*.cfg files in the same folder already set
// RSSROConfig = True and do propellant/mass conversions for
// most parts.  We only handle the RP-1 career fields here
// (TechRequired, RP0conf, cost, entryCost).
//
// Pass: FOR[xxxRP0] — same as RP-1's own TREE-Parts.cfg.
//
// Tech node summary:
//   materialsScienceMatureCommercial  — near-term commercial 2015+
//   advancedUncrewedLanding           — CLPS / commercial lunar 2020s
//   advancedHabitats                  — surface/orbital hab infrastructure
//   advModernPower                    — advanced solar / power generation
//   earlyElecPropulsion               — first-gen ion/Hall propulsion
//   basicNuclearPropulsion            — NERVA-class NTR + architecture
//   advancedNuclearPropulsion         — particle-bed / NTP-SEP hybrid
//   colonization2051ElecProp          — mid-21st-century deep-space systems
//   colonization2100ElecProp          — far-future radiator / propulsion
// ============================================================


// ============================================================
// UNIVERSAL CATCH-ALL
// Sets the three career fields on every EDB-* part.
// Specific sections below override TechRequired and cost.
// ============================================================

@PART[EDB-*]:FOR[xxxRP0]
{
	%RSSROConfig = True
	%RP0conf = true
	%TechRequired = advancedHabitats	// safe default; overridden below
	%cost = 2000
	%entryCost = 20000
	@description ^=:$: <b><color=green>From EDBMods FutureTech</color></b>
}


// ============================================================
// SECTION 1 — Contemporary commercial infrastructure
// ============================================================

