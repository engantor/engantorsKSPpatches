// ============================================================
// SECTION 9 — New Glenn (Blue Origin, first flight 2025)
// RO propellants/masses already handled by RO-NewGlenn.cfg
// bundled in the same mod folder; we only set RP-1 career fields.
//
// S1: 7× BE-4 (LCH4/LOX), reusable first stage
// S2: 2× BE-3U (LH2/LOX) upper stage
// Tech era: veryHeavyRocketry (~2020+)
// ============================================================

// BE-4: 2,400 kN SL per engine, LOX/LCH4 (used in S1 cluster of 7)
@PART[EDB-NG-BE4]:FOR[xxxRP0]
{
	%TechRequired = veryHeavyRocketry
	%cost = 6000
	%entryCost = 180000
	%MODULE[ModuleTagList] { tag = EngineLiquidPump }
}

// BE-3U: 710 kN vac, LOX/LH2 upper stage vacuum engine (2× on S2)
@PART[EDB-NG-BE3U]:FOR[xxxRP0]
{
	%TechRequired = veryHeavyRocketry
	%cost = 4000
	%entryCost = 100000
	%MODULE[ModuleTagList] { tag = EngineLiquidTurbo }
}

// First stage tank — avionics mass limit covers full ~1,100 t stack
@PART[EDB-NewGlennFirstStage]:FOR[xxxRP0]
{
	%TechRequired = veryHeavyRocketry
	%cost = 5000
	%entryCost = 100000

	// RP-1 Avionics.cfg already adds ModuleAvionics with massLimit=0 to
	// any part with ModuleCommand — patch the existing node, don't add a second.
	@MODULE[ModuleAvionics]
	{
		@massLimit = 1200
	}
}

// Interstage with methane RCS thrusters
@PART[EDB-NewGlennInterstage]:FOR[xxxRP0]
{
	%TechRequired = veryHeavyRocketry
	%cost = 1000
	%entryCost = 20000
}

// Upper stage (LH2/LOX) — avionics covers full stack including first stage
@PART[EDB-NewGlennNewUpper]:FOR[xxxRP0]
{
	%TechRequired = veryHeavyRocketry
	%cost = 3000
	%entryCost = 80000

	@MODULE[ModuleAvionics]
	{
		@massLimit = 2500
	}
}

// 7-metre fairing
@PART[EDB-NG-Fairing]:FOR[xxxRP0]
{
	%TechRequired = veryHeavyRocketry
	%cost = 800
	%entryCost = 15000
}

// Aerodynamic fins and landing wings (reuse/recovery hardware)
@PART[EDB-NewGlennFinBare|EDB-NewGlennWingBare]:FOR[xxxRP0]
{
	%TechRequired = veryHeavyRocketry
	%cost = 500
	%entryCost = 10000
}
