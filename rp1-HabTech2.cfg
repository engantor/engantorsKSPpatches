// ============================================================
// RP-1 tech tree integration for HabTech2 and htRobotics
//
// Existing RP-1 TREE-Parts.cfg already covers 25 HabTech2 parts.
// This file adds RP0conf + tech nodes for the remaining ~65 ht2_
// parts and all 13 htRobotics parts that would otherwise be
// deleted from the VAB by RP-1's career cleanup.
//
// Tech nodes match those already used by RP-1 for this mod:
//   largeScaleOrbitalCon  — ISS modules, trusses, robotics, RCS,
//                           science payloads, comms, utilities
//   advancedPower         — ISS solar arrays and radiators
//
// Pass: FOR[xxxRP0]
// ============================================================


// ============================================================
// SECTION 1 — HabTech2 catch-all
// Sets RP0conf on every ht2_* part.  Parts already in
// TREE-Parts.cfg get their TechRequired overridden here too,
// which is fine — our value matches what RP-1 sets.
// ============================================================

@PART[ht2_*]:FOR[xxxRP0]
{
	%TechRequired = largeScaleOrbitalCon
	%cost = 500
	%entryCost = 0
	%RP0conf = true
}


// ============================================================
// SECTION 2 — HabTech2 solar arrays and radiators
// Upgraded to advancedPower, matching RP-1's node for
// ht2_solarArray_duo.
// ============================================================

@PART[ht2_P3_SAW|ht2_P6_SAW|ht2_S6_SAW|ht2_SAW_half|ht2_SAW_radiator|ht2_SAW_v2|ht2_iROSA|ht2_radiatorSingle|ht2_radiatorTriple_v2]:FOR[xxxRP0]
{
	%TechRequired = advancedPower
	%cost = 1000
	%entryCost = 0
}


// ============================================================
// SECTION 3 — HabTech2 CBM docking port
// Matches existing RP-1 node (largeStationControl).
// ============================================================

@PART[ht2_CBM|ht2_CBM_active1|ht2_CBM_active2]:FOR[xxxRP0]
{
	%TechRequired = largeStationControl
}


// ============================================================
// SECTION 4 — htRobotics (Canadarm2, JEM-RMS, SSRMS, fixtures)
// All 13 robotic arm parts: ISS-era assembly hardware, same
// tech era as the station modules they support.
// ============================================================

@PART[ht_canadarm2_LEE|ht_canadarm2_boom|ht_canadarm2_servo]:FOR[xxxRP0]
{
	%TechRequired = largeScaleOrbitalCon
	%cost = 1000
	%entryCost = 0
	%RP0conf = true
}

@PART[ht_C1_LEE|ht_C1_boom|ht_C1_elbow|ht_C1_pitch|ht_C1_rotator]:FOR[xxxRP0]
{
	%TechRequired = largeScaleOrbitalCon
	%cost = 800
	%entryCost = 0
	%RP0conf = true
}

@PART[ht_JEM_RMS_boom|ht_JEM_RMS_servo]:FOR[xxxRP0]
{
	%TechRequired = largeScaleOrbitalCon
	%cost = 600
	%entryCost = 0
	%RP0conf = true
}

@PART[ht_PDGF|ht_grappleFixture|ht_grappleFixtureKibo]:FOR[xxxRP0]
{
	%TechRequired = largeScaleOrbitalCon
	%cost = 200
	%entryCost = 0
	%RP0conf = true
}
