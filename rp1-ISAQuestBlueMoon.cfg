// ============================================================
// RP-1 tech tree, avionics, and career costs for ISAQuestBlueMoon
// (GameData/IQ_BlueMoon — Blue Moon Mk2 human-rated lunar lander)
//
// RO propellants/masses already handled by RO-ISAQuestBlueMoon.cfg.
// Blue Moon Mk1 (cargo) first revealed 2019; Mk2 (crewed) ~2024+.
// All parts placed in veryHeavyRocketry (late commercial lunar era).
// Pass: FOR[xxxRP0]
// ============================================================

// BE-7: 40 kN throttleable LH2/LOX vacuum engine
@PART[IQ_BE-7]:FOR[xxxRP0]
{
	%TechRequired = veryHeavyRocketry
	%cost = 6000
	%entryCost = 120000
	%RP0conf = true
	%MODULE[ModuleTagList] { tag = EngineLiquidTurbo }
}

// Main LH2/LOX propellant tank
@PART[IQBM_Tank]:FOR[xxxRP0]
{
	%TechRequired = veryHeavyRocketry
	%cost = 3000
	%entryCost = 50000
	%RP0conf = true
}

// Crew habitat (3 crew) — avionics covers full lander stack (~15–30 t)
@PART[IQBM_Hab]:FOR[xxxRP0]
{
	%TechRequired = veryHeavyRocketry
	%cost = 15000
	%entryCost = 200000
	%RP0conf = true

	@MODULE[ModuleAvionics]
	{
		@massLimit = 30
	}
}

// Instrument unit / autonomous avionics core
@PART[IQBM_IU]:FOR[xxxRP0]
{
	%TechRequired = veryHeavyRocketry
	%cost = 2000
	%entryCost = 40000
	%RP0conf = true

	@MODULE[ModuleAvionics]
	{
		@massLimit = 65
	}
}

// Landing leg
@PART[IQBM_Leg]:FOR[xxxRP0]
{
	%TechRequired = veryHeavyRocketry
	%cost = 1000
	%entryCost = 20000
	%RP0conf = true
}
