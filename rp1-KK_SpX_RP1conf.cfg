// ============================================================
// KK & Pmborg SpaceX parts — RP-1 tech tree integration
// ============================================================
//
// Covers every KK/Pmborg SpaceX part actually present in this
// install:
//
//   KK_SpXCD_*          Dragon 2 crew capsule (10 parts)
//   KK_F9demo_*         Falcon 9 demo structural set (13 parts)
//   KK_SpaceX_Starlink  Starlink satellite + dispenser
//
// Notes on pass timing:
//   • FOR[xxxRP0] — same pass as RP-1's own TREE-Parts.cfg.
//     Sets TechRequired, RP0conf, RSSROConfig so the zzzRP-0
//     pass (NonRP0.cfg) sees them and does NOT mark the parts
//     "non RP-0".
//   • AFTER[RealismOverhaul] — engine & tank propellant
//     conversions.  Runs after RO global passes so nothing
//     overwrites us.
//
// Dragon 2 propellants are already handled by:
//   fix-KK_SpXCD_propellants.cfg  (MMH/NTO/Helium)
//   fix-KK_SpXCD_heatshield.cfg   (Ablator)
//   fix-KK_SpXCD_*.cfg            (misc fixes)
// ============================================================


// ============================================================
// SECTION A — Dragon 2 (KK_SpXCD) tech tree placement
// ============================================================

// Crew & cargo capsule — commercial crewed capsules node
@PART[KK_SpXCD_capsule|KK_SpXCD_capsule_cargo]:FOR[xxxRP0]
{
	%RSSROConfig = True
	%TechRequired = commercialCapsules
	%cost = 34000
	%entryCost = 0
	%RP0conf = true
	@description ^=:$: <b><color=green>From KK Dragon 2 mod</color></b>
	%MODULE[ModuleTagList] { tag = HumanRated }
	%MODULE[ModuleTagList] { tag = NoResourceCostMult }
	%MODULE[ModuleTagList] { tag = Reentry }
}

