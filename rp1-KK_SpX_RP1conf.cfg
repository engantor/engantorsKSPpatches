// ============================================================
// SECTION C — F9demo engine propellant conversion
// LiquidFuel/Oxidizer → Kerosene/LqdOxygen
// Isp tuned to Merlin 1D SL / Merlin 1D Vac specs.
// Thrust kept at stock levels since the tanks are also
// stock-scale — the stock thrust/fuel ratio is preserved.
// ============================================================

// S1 main engine (Merlin 1D sea-level approximation)
@PART[KK_F9demo_mainEngine]:AFTER[RealismOverhaul]
{
	@mass = 0.470	// Merlin 1D ≈ 470 kg
	@MODULE[ModuleEnginesFX]
	{
		@PROPELLANT[LiquidFuel]
		{
			@name = Kerosene
			@ratio = 0.3736
		}
		@PROPELLANT[Oxidizer]
		{
			@name = LqdOxygen
			@ratio = 0.6264
		}
		@atmosphereCurve
		{
			@key,0 = 0 311		// Merlin 1D vac Isp
			@key,1 = 1 282		// Merlin 1D ASL Isp
			@key,5 = 5 0.001
		}
	}
}

// S2 vacuum engine (Merlin 1D Vacuum approximation)
@PART[KK_F9demo_vacEngine]:AFTER[RealismOverhaul]
{
	@mass = 0.490	// Merlin 1DV ≈ 490 kg
	@MODULE[ModuleEnginesFX]
	{
		@PROPELLANT[LiquidFuel]
		{
			@name = Kerosene
			@ratio = 0.3736
		}
		@PROPELLANT[Oxidizer]
		{
			@name = LqdOxygen
			@ratio = 0.6264
		}
		@atmosphereCurve
		{
			@key,0 = 0 348		// Merlin 1DV vac Isp
			@key,1 = 1 1		// near-zero ASL performance
			@key,5 = 5 0.001
		}
	}
}

// Landing / center engine (same SL props as mainEngine)
@PART[KK_F9demo_landingEngine]:AFTER[RealismOverhaul]
{
	@mass = 0.470
	@MODULE[ModuleEnginesFX]
	{
		@PROPELLANT[LiquidFuel]
		{
			@name = Kerosene
			@ratio = 0.3736
		}
		@PROPELLANT[Oxidizer]
		{
			@name = LqdOxygen
			@ratio = 0.6264
		}
		@atmosphereCurve
		{
			@key,0 = 0 311
			@key,1 = 1 282
			@key,5 = 5 0.001
		}
	}
}


// ============================================================
// SECTION D — F9demo tank resource conversion
// Replace stock LiquidFuel/Oxidizer RESOURCE blocks with
// ModuleFuelTanks so RealFuels manages them correctly.
//
// Volume calculated at 5 L per stock resource unit (the KSP
// stock convention), preserving the same propellant mass
// the original part was designed to carry.
//
//   S1FT: 6480 LF → 32400 L Kerosene  |  7920 Ox → 39600 L LOx
//   S2FT: 1440 LF →  7200 L Kerosene  |  1760 Ox →  8800 L LOx
// ============================================================

@PART[KK_F9demo_S1FT]:AFTER[RealismOverhaul]
{
	!RESOURCE[LiquidFuel] {}
	!RESOURCE[Oxidizer] {}
	MODULE
	{
		name = ModuleFuelTanks
		type = Default
		basemass = -1
		volume = 72000
		TANK
		{
			name = Kerosene
			amount = 32400
			maxAmount = 32400
		}
		TANK
		{
			name = LqdOxygen
			amount = 39600
			maxAmount = 39600
		}
	}
}

@PART[KK_F9demo_S2FT]:AFTER[RealismOverhaul]
{
	!RESOURCE[LiquidFuel] {}
	!RESOURCE[Oxidizer] {}
	!RESOURCE[MonoPropellant] {}
	MODULE
	{
		name = ModuleFuelTanks
		type = Default
		basemass = -1
		volume = 16000
		TANK
		{
			name = Kerosene
			amount = 7200
			maxAmount = 7200
		}
		TANK
		{
			name = LqdOxygen
			amount = 8800
			maxAmount = 8800
		}
	}
}


