// ============================================================
// SECTION 4 — Ariane 5 payload adapters
// Sylda, Guépière, Kylda — enable dual/triple launches
// ============================================================

// Sylda dual-payload adapter (large inner cradle)
// Node fix: RO sets rescaleFactor=1.44 making the 3.75m model → 5.4m, which
// is correct.  But the base cfg has size1 nodes — should be size3 to match
// the ESC-A top (also size3 at 5.4m).
@PART[Knes_MultiPayload_Adapter_Sylda_AR5_375]:FOR[xxxRP0]
{
	%TechRequired = hydrolox1992
	%cost = 800
	%entryCost = 0
	%MODULE[ModuleTagList] { tag = NoResourceCostMult }
	@node_stack_top    = 0.0, 2.59204, 0.0, 0.0,  1.0, 0.0, 3
	@node_stack_bottom = 0.0, 1.81682, 0.0, 0.0, -1.0, 0.0, 3
}

// Guépière triple-payload triadapter
// Top node fix: size2 → size3 so it snaps to the ESC-A top correctly.
// The three bottom nodes stay size2 (secondary payload interfaces).
@PART[Knes_Structural_Guepiere]:FOR[xxxRP0]
{
	%TechRequired = hydrolox1992
	%cost = 600
	%entryCost = 0
	%MODULE[ModuleTagList] { tag = NoResourceCostMult }
	@node_stack_top = 0.0, 0.75703, 0.0, 0.0, 1.0, 0.0, 3
}

// Kylda K-250 — standard Ariane 5 payload adapter ring
// RO sets rescaleFactor=1.44 for all three Kylda variants (same base model),
// making them identical in size.  Fix: restore size differentiation and
// correct the bottom node to size3 so it snaps to the size3 ESC-A top node.
@PART[Knes_Structural_Kylda]:FOR[xxxRP0]
{
	%TechRequired = hydrolox1992
	%cost = 300
	%entryCost = 0
	@node_stack_bottom = 0.0, -0.35, 0.0, 0.0, -1.0, 0.0, 3
}

// Kylda K-125 — medium payload adapter (half scale of K-250)
// Restore to half the K-250 rescale: 1.44 × 0.5 = 0.72 → ~0.9 m interface
@PART[Knes_Structural_Kylda_125]:FOR[xxxRP0]
{
	%TechRequired = hydrolox1992
	%cost = 200
	%entryCost = 0
	@rescaleFactor = 0.72
}

// Kylda K-0625 — nano payload adapter (quarter scale of K-250)
// Restore to quarter the K-250 rescale: 1.44 × 0.25 = 0.36 → ~0.45 m interface
@PART[Knes_Structural_Kylda_0625]:FOR[xxxRP0]
{
	%TechRequired = hydrolox1992
	%cost = 100
	%entryCost = 0
	@rescaleFactor = 0.36
}


