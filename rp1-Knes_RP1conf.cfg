// ============================================================
// KNES — RP-1 tech tree integration
// ============================================================
//
// All parts that have RSSROConfig = True via the RO patches in
// GameData/RealismOverhaul/RO_SuggestedMods/Knes/
//
// Strategy:
//   Universal catch-all sets RP0conf + a safe default node so
//   no KNES part is ever invisible in career.  Specific sections
//   below override TechRequired and cost for every logical group.
//
// Engine parts (Vulcain, HM7, Aestus, EAP-241, R4D11) already
// have CONFIG-level techRequired set by RP-1's TREE-Engines.cfg.
// We still need the part-level TechRequired + RP0conf + cost.
//
// Pass: FOR[xxxRP0]
//
// Tech node summary:
//   basicRocketryRP0          — smallest generic decouplers/fairings
//   earlyRocketry             — medium generic structural parts
//   earlyLanding              — parachutes / recovery
//   earlyPower                — small solar panels
//   digitalComms              — generic directional antennas
//   advancedComms             — high-capability directional antennas
//   earlyScience              — early satellite payloads
//   scienceSatellite          — operational satellite payloads
//   hydrolox1972              — HM7 upper stage engine
//   hydrolox1992              — Vulcain / Ariane 5 core systems
//   hydrolox1998              — Vulcain-2 upgrade
//   orbitalRocketry1992       — Aestus EPS upper stage engine
//   solids1998                — Ariane 5 EAP SRBs
//   solids2019                — Ariane 6 P120C SRBs (first flight 2024)
//   commercialSpaceplanes     — Hermès spaceplane
//   commercialCapsules        — MRC capsule family
//   SIAD                      — MRC heatshield
//   FRSC2019                  — MRC parachute system
//   standardDockingPorts      — MRC ECBM docking ports
//   spaceStationControl       — ATV service module
//   spaceStationSolarPanels   — ATV / MRC solar panels
//   modularSpaceStations      — STEAM station modules
// ============================================================


// ============================================================
// UNIVERSAL CATCH-ALL
// Every KNES part that passed through the RO patches will have
// RSSROConfig = True.  This guarantees RP0conf + safe default.
// ============================================================

@PART[Knes_*|_Knes_*]:FOR[xxxRP0]
{
	%RP0conf = true
	%TechRequired = earlyRocketry   // safe default; overridden below
	%cost = 500
	%entryCost = 5000
	@description ^=:$: <b><color=#4488ff>From KNES</color></b>
}


// ============================================================
// SECTION 1 — Ariane 5 core propulsion
// Vulcain and HM7 are the heart of the Ariane 5 programme.
// EPS / Aestus is the storable upper-stage engine.
// ============================================================

// Vulcain main engine — 1145 kN hydrolox, first flight 1996
// TREE-Engines.cfg sets: Vulcain → hydrolox1992, Vulcain-2 → hydrolox1998
@PART[Knes_Engine_Vulcain]:FOR[xxxRP0]
{
	%TechRequired = hydrolox1992
	%cost = 500
	%entryCost = 40000
	%MODULE[ModuleTagList] { tag = EngineLiquidTurbo }
}

// HM7 (Zebulon) — 61 kN hydrolox upper-stage engine, first flight 1979
// TREE-Engines.cfg sets: HM7 → hydrolox1972, HM-7B/B+/B++ upgrade chain
@PART[Knes_Engine_Zebulon]:FOR[xxxRP0]
{
	%TechRequired = hydrolox1972
	%cost = 300
	%entryCost = 20000
	%MODULE[ModuleTagList] { tag = EngineLiquidTurbo }
}

// EPS / Aestus — 27 kN storable-prop pressure-fed upper stage, first flight 1996
// TREE-Engines.cfg sets: Aestus → orbitalRocketry1992 and later variants
@PART[Knes_Engine_EPS]:FOR[xxxRP0]
{
	%TechRequired = orbitalRocketry1992
	%cost = 200
	%entryCost = 20000
	%MODULE[ModuleTagList] { tag = EngineLiquidPF }
}

// EPC — Ariane 5 core cryogenic tank (LH2 + LOX, 564 900 L)
@PART[Knes_Fuel_Tanks_EPC]:FOR[xxxRP0]
{
	%TechRequired = hydrolox1992
	%cost = 15000
	%entryCost = 0
	%MODULE[ModuleTagList] { tag = NoResourceCostMult }
}

// ESC-A — Ariane 5 ECA upper stage cryogenic tank (51 564 L)
@PART[Knes_Fuel_Tanks_Medium]:FOR[xxxRP0]
{
	%TechRequired = hydrolox1992
	%cost = 6000
	%entryCost = 0
	%MODULE[ModuleTagList] { tag = NoResourceCostMult }
}

// Ariane 5 GNC — guidance, navigation and control avionics unit
// ModuleAvionics needed: RP-1's Avionics.cfg auto-adds massLimit=0 to any
// ModuleCommand (minimumCrew=0) part without an explicit ModuleAvionics.
// 800t matches the existing RSB Ariane V entry in RP-1/Avionics.cfg.
@PART[Knes_Command_Cortex]:FOR[xxxRP0]
{
	%TechRequired = hydrolox1992
	%cost = 1500
	%entryCost = 20000
	%MODULE[ModuleAvionics]
	{
		%massLimit = 1000.0
		%interplanetary = False
	}
}

// Ariane 5 nosecones (structural, covers the booster tops)
@PART[Knes_Aero_NoseCone_A|Knes_Aero_NoseCone_B]:FOR[xxxRP0]
{
	%TechRequired = hydrolox1992
