// ============================================================
// KK Launchers Pack (SpaceX) — RP-1 tech tree integration
// ============================================================
//
// All KK_SPX_* and KK_SpX_* parts from the Launchers Pack
// SpaceX folder, plus the Pmborg-renamed PMB_* engine/tank
// clones that exist only after the FINAL pass.
//
// Strategy: patch KK original names here in FOR[xxxRP0].
// Pmborg renames engines/tanks in AFTER[RealPlume]:FINAL,
// which fires AFTER all normal passes, so any TechRequired /
// RP0conf set here is inherited by the renamed PMB_* parts.
//
// Propellant conversion for engines and tanks is already
// handled by Pmborg_Real_9_Engines.cfg / Pmborg_Real_9_Tanks.cfg
// (AFTER[RealismOverhaul]). We only deal with tech-tree here.
//
// Parts already fully covered by RP-1's own TREE-Parts.cfg:
//   KK_SPX_Kestrel    → orbitalRocketry2004  RP0conf=true ✓
//   KK_SPX_Merlin1Ci  → orbitalRocketry2004  RP0conf=true ✓
// We still add EngineLiquidTurbo tags to those two.
//
// Pass: FOR[xxxRP0] (same as TREE-Parts.cfg)
// ============================================================


// ============================================================
// SECTION A — Falcon 1 engines
// Merlin1Ci & Kestrel already in TREE-Parts.cfg; we only add
// the engine tag so career mode accounts them correctly.
// Merlin1C / 1CV are F9-era re-uses of F1 hardware → same node.
// ============================================================

@PART[KK_SPX_Merlin1Ci|KK_SPX_Kestrel]:FOR[xxxRP0]
{
	// TREE-Parts.cfg already set TechRequired + RP0conf=true.
	// Just add the missing tag.
	%MODULE[ModuleTagList] { tag = EngineLiquidTurbo }
}

@PART[KK_SPX_Merlin1C]:FOR[xxxRP0]
{
	%TechRequired = orbitalRocketry2004
	%cost = 400
	%entryCost = 32000
	%RP0conf = true
	@description ^=:$: <b><color=green>From KK Launchers Pack</color></b>
	%MODULE[ModuleTagList] { tag = EngineLiquidTurbo }
}

@PART[KK_SPX_Merlin1CV]:FOR[xxxRP0]
{
	%TechRequired = orbitalRocketry2004
	%cost = 220
	%entryCost = 18000
	%RP0conf = true
	@description ^=:$: <b><color=green>From KK Launchers Pack</color></b>
	%MODULE[ModuleTagList] { tag = EngineLiquidTurbo }
}


// ============================================================
// SECTION B — Falcon 1 structural parts
// TREE-Parts.cfg already placed these but with RP0conf=false.
// Upgrade to RP0conf=true so they appear in the tech node.
// ============================================================

@PART[KK_SPX_F1S1FT|KK_SPX_F1S2FT|KK_SPX_F1IS|KK_SPX_F1Fairing]:FOR[xxxRP0]
{
	// TREE-Parts.cfg assigned TechRequired = materialsScienceInternational.
	// Just flip RP0conf and add our tag.
	%RP0conf = true
	@description ^=:$: <b><color=green>From KK Launchers Pack</color></b>
}


// ============================================================
// SECTION C — Falcon 9 v1.0 (F91) engines
// Merlin 1C sea-level (S1) and vacuum (S2)
// Pmborg renames: KK_SPX_Merlin1C → PMB_F9_Merlin1C
//                 KK_SPX_Merlin1CV → PMB_F9_Merlin1CV
// (already covered in Section A above)
// ============================================================

// No additional patches needed — Merlin1C/CV handled in Section A.


// ============================================================
// SECTION D — Falcon 9 v1.0 (F91) structural parts
// Engine section, interstage, S1 and S2 tanks.
// Pmborg patches propellants via AFTER[RealismOverhaul];
// we only set the tech node here.
// ============================================================

@PART[KK_SPX_F91_S1tank|KK_SPX_F91_S2tank|KK_SPX_F91_enginesec|KK_SPX_F91_interstage]:FOR[xxxRP0]
{
	%RSSROConfig = True
	%TechRequired = materialsScienceCommercial
	%cost = 1500
	%entryCost = 18000
	%RP0conf = true
	@description ^=:$: <b><color=green>From KK Launchers Pack</color></b>
}


