// ============================================================
// RP-1 fixes for ROEngines Modular RCS family
//
// Problem 1 — ROE-ModularResistojetRCS missing from career:
//   The part is cloned from ROE-ModularRCS by a +PART in
//   ROE-ModularRCS.cfg before the xxxRP0 pass runs.  Because
//   RP-1's career cleanup deletes any part without RP0conf = true,
//   and TREE-Parts.cfg only sets RP0conf on ROE-ModularRCS (not
//   the clone), the Resistojet RCS never appears in career mode.
//   Fix: explicitly set RP0conf on the clone.
//
// Problem 2 — no LqdMethane/LqdOxygen RCS config:
//   The existing CH4+O2 config in RCS_Config.cfg uses gaseous
//   Methane + Oxygen (specLevel = prototype, so locked in early
//   career).  Methalox vehicles (Starship, PEKKA SuperHeavy, etc.)
//   need a liquid-phase LqdMethane/LqdOxygen thruster option.
//   Fix: inject a new CONFIG into the RCSGeneric engine config
//   for all modular RCS parts.
// ============================================================


// ============================================================
// SECTION 1 — Restore Modular Resistojet RCS to career
// Same tech node as the standard Modular RCS (unlockParts).
// ============================================================

@PART[ROE-ModularResistojetRCS]:FOR[xxxRP0]
{
	%TechRequired = unlockParts
	%cost = 2
	%entryCost = 0
	%RP0conf = true
}


// ============================================================
// SECTION 2 — LqdMethane + LqdOxygen RCS config
// Based on SpaceX Raptor attitude-control thrusters (Starship).
// Real O/F ≈ 3.5:1 (LOX:LCH4 by mass).
// Volume ratio at cryo densities (LOX 1141, LCH4 422.6 kg/m³):
//   LqdOxygen : LqdMethane = 0.565 : 0.435
// IspV ~340 s — pressure-fed liquid methane, high-expansion nozzle.
// Helium pressurant required (cryogenic propellants, separate He tank).
//
// SECTION 3 — LqdHydrogen + LqdOxygen RCS config
// For LH2/LOX vehicles (SLS EUS, Vulcan Centaur, New Glenn upper).
// Real O/F ≈ 5.5:1 (LOX:LH2 by mass) — same family as RL-10.
// Volume ratio at cryo densities (LOX 1141, LH2 70.97 kg/m³):
//   LqdHydrogen : LqdOxygen = 0.745 : 0.255
// IspV ~380 s — pressure-fed hydrogen, lower than pump-fed RL-10.
// Helium pressurant: yes — autogenous H2 pressurisation suits main
// propulsion tanks but dedicated RCS thrusters need separate He supply
// (mass and volume reasons; boiloff pressure is uncontrolled).
//
// Both configs set specLevel = operational so they are visible in
// career without waiting for a prototype tech unlock.
// ============================================================

@PART[*]:HAS[@MODULE[ModuleEngineConfigs]:HAS[#configuration[Nitrogen]]]:NEEDS[RealismOverhaul]:AFTER[RealismOverhaulEngines]
{
	@MODULE[ModuleEngineConfigs]:HAS[#configuration[Nitrogen]]
	{
		CONFIG
		{
			name = LqdMethane+LOX
			specLevel = operational
			thrusterPower = 0.4
			PROPELLANT
			{
				name = LqdMethane
				ratio = 0.435
				DrawGauge = True
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.565
				resourceFlowMode = STACK_PRIORITY_SEARCH
			}
			PROPELLANT
			{
				name = Helium
				ratio = 10.0
				ignoreForIsp = True
			}

			IspSL = 0.277	// ~120 s SL (poor — vacuum thruster)
			IspV = 0.785	// ~340 s vac
		}

		CONFIG
		{
			// Sub-cooled/densified propellants matching ROEngines Raptor engine config.
			// Use this on Starship/SuperHeavy builds so RCS draws from the same
			// CooledLqdMethane tanks as the Raptor engines.
			name = CooledLqdMethane+CooledLOX
			specLevel = operational
			thrusterPower = 0.4
			PROPELLANT
			{
				name = CooledLqdMethane
				ratio = 0.431
				DrawGauge = True
			}
			PROPELLANT
			{
				name = CooledLqdOxygen
				ratio = 0.569
				resourceFlowMode = STACK_PRIORITY_SEARCH
			}
			PROPELLANT
			{
				name = Helium
				ratio = 10.0
				ignoreForIsp = True
			}

			IspSL = 0.277	// ~120 s SL
			IspV = 0.785	// ~340 s vac (same performance as standard methalox — densification doesn't change combustion Isp)
		}

		CONFIG
		{
			name = LqdHydrogen+LOX
			specLevel = operational
			thrusterPower = 0.4
			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 0.745
				DrawGauge = True
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.255
				resourceFlowMode = STACK_PRIORITY_SEARCH
			}
			PROPELLANT
			{
				// Separate helium pressurant — autogenous LH2 boiloff
				// pressure is uncontrolled; dedicated He supply used for RCS
				name = Helium
				ratio = 10.0
				ignoreForIsp = True
			}

			IspSL = 0.350	// ~151 s SL (vacuum thruster, poor SL perf.)
			IspV = 0.879	// ~379 s vac (pressure-fed, below pump-fed RL-10)
		}
	}
}
