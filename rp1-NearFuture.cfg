// Fission reactors / nuclear power (catch any not already in tree)
@PART[nfe-reactor-*|nfe-fissionreactor-*|nfe-fission-*]:FOR[xxxRP0]:NEEDS[NearFutureElectrical]
{
	%TechRequired = modernNuclearPower
	%cost = 5000
	%entryCost = 0
	%RP0conf = true
}


// ============================================================
