// ============================================================
// RP-1 tech tree integration for Near Future Technologies mods
// (NearFutureConstruction, NearFutureElectrical, NearFutureExploration,
//  NearFuturePropulsion, NearFutureSpacecraft)
//
// NearFutureSolar is handled by rp1-NearFutureSolar.cfg.
//
// RP-1's TREE-Parts.cfg already covers:
//   NFC:  docking-linear-1/2, truss-octo-* (most), truss-micro-01/02
//   NFE:  nfe-rtg-gphs-1, nfe-rtg-mmrtg-1 (gphsRTG/improvedRTG nodes)
//         nfe-reactor-625/125, nfe-fissionreactor-* (modernNuclearPower)
//   NFEx: nfex-antenna-* (~20 entries across various comm nodes)
//   NFP:  none
//   NFS:  none (RO patch uses old part names that don't match current NFS)
//
// Tech nodes used (matching existing RP-1 assignments where they exist):
//   improvedOrbitalConstruction  — NFC adapters, small truss adapters
//   largeScaleOrbitalCon         — NFC crew adapters
//   earlySpaceStations           — NFE batteries, capacitors (power storage)
//   gphsRTG / improvedRTG        — NFE RTGs (matched to existing entries)
//   modernNuclearPower           — NFE fission reactors
//   longTermAvionics             — NFEx probe buses, fuel tanks, legs
//   earlyElecPropulsion          — NFP ion engines, argon/xenon/lithium tanks
//   colonization2051ElecProp     — NFP MPD, PIT, VASIMR (advanced drives)
//   modularSpaceStations         — NFS command pods, service tanks, utility
//   unlockParts                  — NFS/NFC structural/utility with no era lock
//
// NEEDS guards on each section prevent collisions with other mods that
// share generic part prefixes (adapter-*, command-*, rcsblock-*, etc.).
// Pass: FOR[xxxRP0]
// ============================================================


// ============================================================
// SECTION 1 — NearFutureConstruction
// Structural adapters, truss adapters, crew node adapters.
// docking-linear-* and main truss parts already in RP-1 tree.
// ============================================================

@PART[adapter-125-0625-1|adapter-125-0625-2|adapter-125-0625-3|adapter-125-0625-4]:FOR[xxxRP0]:NEEDS[NearFutureConstruction]
{
	%TechRequired = improvedOrbitalConstruction
	%cost = 200
	%entryCost = 0
	%RP0conf = true
}

@PART[adapter-25-125|adapter-375-25-1|adapter-rad-0625|adapter-rad-125]:FOR[xxxRP0]:NEEDS[NearFutureConstruction]
{
	%TechRequired = improvedOrbitalConstruction
	%cost = 300
	%entryCost = 0
	%RP0conf = true
}

@PART[adapter-25-multi-1]:FOR[xxxRP0]:NEEDS[NearFutureConstruction]
{
	%TechRequired = largeScaleOrbitalCon
	%cost = 500
	%entryCost = 0
	%RP0conf = true
}

@PART[truss-micro-adapter-01]:FOR[xxxRP0]:NEEDS[NearFutureConstruction]
{
	%TechRequired = improvedOrbitalConstruction
	%cost = 150
	%entryCost = 0
	%RP0conf = true
}

// truss-octo-adapter-crew-01 is already in RP-1 tree
// docking-linear-1/2 are already in RP-1 tree


// ============================================================
// SECTION 2 — NearFutureElectrical
// Batteries, capacitors, RTGs, fission reactors.
