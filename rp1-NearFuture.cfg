	%cost = 200
	%entryCost = 0
	%RP0conf = true
}

// Capacitors — discharge/burst power
@PART[capacitor-0625|capacitor-125|capacitor-25|capacitor-rad-0625|capacitor-rad-0625-2]:FOR[xxxRP0]:NEEDS[NearFutureElectrical]
{
	%TechRequired = earlySpaceStations
	%cost = 300
	%entryCost = 0
	%RP0conf = true
