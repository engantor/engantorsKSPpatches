// ============================================================
// RP-1 tech tree integration for NearFutureSolar (nfs-panel-*)
//
// RO sizing/areas already handled by:
//   RealismOverhaul/RO_SuggestedMods/NearFutureTechnologies/RO_NearFuture_Solar.cfg
//
// Panel tiers by size and era:
//   Standard deploying/curved/truss (~0.2–7.6 m²):
//     Ikonos (1999), Messenger (2004), MRO (2005), WorldView (2016),
//     Orion, Dragon, Dawn, GOES, Hayabusa, TDRSS, WV-3, Juno, JUICE,
//     curved 2.5m / 3.75m, static curved, static truss —
//     → materialsScienceMatureCommercial  (~2000s commercial maturity)
//
//   Large blanket + hub/lab panels (14–378 m²):
//     BFS/Starship, Copernicus, DRM, DSG, DST, Nautilus, Orion-blanket,
//     rotating arm, lab array, hub array —
//     → advModernPower  (2010s+ station/deep-space power)
//
// Pass: FOR[xxxRP0]
// ============================================================

// ============================================================
// GLOBAL — all NFS panels get RP0conf so none are deleted
// ============================================================

@PART[nfs-panel-*]:FOR[xxxRP0]
{
	%TechRequired = materialsScienceMatureCommercial
	%cost = 500
	%entryCost = 5000
	%RP0conf = true
}


// ============================================================
// Tracking toggle — all NFS panels that ship with sunTracking = true
// (23 parts: all deploying-advanced, deploying-blanket, deploying-
//  concentrator panels that have a sun-tracking pivot).
// Panels already fixed (Ikonos, WV-4, Hayabusa, static truss, curved)
// are excluded automatically by the HAS filter.
//
// Adds a B9 "Tracking Mode" switch: Fixed (default) or Sun-Tracking.
// The base module default is set to non-tracking; the switch restores
// tracking when selected.
// Runs AFTER RealismOverhaul (which removes Basic/Concentrating
// cellSwitch subtypes and sets SolarConfig area).
// ============================================================

@PART[nfs-panel-*]:HAS[@MODULE[ModuleDeployableSolarPanel]:HAS[#sunTracking[true]]]:AFTER[RealismOverhaul]
{
	// Default to non-tracking; switch below restores it when selected
	@MODULE[ModuleDeployableSolarPanel]
	{
		@sunTracking = false
	}

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = trackingSwitch
		switcherDescription = Tracking Mode
		affectDragCubes = False
		affectFARVoxels = False

		SUBTYPE
		{
			name = Fixed
			title = Fixed (Non-Tracking)
			descriptionSummary = Panel does not rotate to face the Sun. Lower average output but no moving parts.
			primaryColor = #5d7682
			secondaryColor = #5d7682
			defaultSubtypePriority = 1

			MODULE
			{
				IDENTIFIER { name = ModuleDeployableSolarPanel }
				DATA { sunTracking = false }
			}
		}

		SUBTYPE
		{
			name = Tracking
			title = Sun-Tracking
			descriptionSummary = Panel rotates to face the Sun for maximum output.
			primaryColor = #2d373c
			secondaryColor = #2d373c

			MODULE
			{
				IDENTIFIER { name = ModuleDeployableSolarPanel }
				DATA { sunTracking = true }
			}
		}
	}
}


// ============================================================
// Large blanket panels and ISS-scale arrays — later tech node
// ============================================================

@PART[nfs-panel-deploying-blanket-*]:FOR[xxxRP0]
{
	%TechRequired = advModernPower
	%cost = 3000
	%entryCost = 30000
}

// Hub (2×20-panel, 30.9 m²) and Lab (2×6×6-panel, 14.7 m²)
@PART[nfs-panel-deploying-advanced-2x20-hub-1|nfs-panel-deploying-advanced-2x6x6-lab-1]:FOR[xxxRP0]
{
	%TechRequired = advModernPower
	%cost = 2000
	%entryCost = 20000
}
