// ============================================================
// Intuitive Machines Nova-C — RP-1 tech tree integration
// ============================================================
//
// Parts defined in NovaC/Patches/NovaC_Parts.cfg:
//   ROE-VR900-NovaC    VR900 methalox main engine
//   NovaC_RCS_Thruster  cold-gas helium RCS cluster
//
// Both are +PART clones created before FOR[xxxRP0] fires, so
// they can be targeted by name here.
//
// VR900 already sets RP0conf = true in its own patch but has
// no TechRequired or cost.  The RCS thruster has neither.
//
// Tech node: advancedUncrewedLanding
//   Represents the commercial robotic lunar-delivery era
//   (2010s–2020s CLPS programme).  Nova-C / IM-1 first flew
//   February 2024 — this is the correct late-game uncrewed
//   landing node, sitting after lunarLanding in the tree.
//
// VR900 engineType is not in TREE-Engines.cfg (custom engine),
// so TechRequired is set at the PART level rather than inside
// a CONFIG block.  The single VR900 config is available as
// soon as the part is unlocked.
// ============================================================


// ============================================================
// VR900 main engine
// 3.1 kN throttleable methalox, 325 s vac Isp, pressure-fed
// First methalox engine to fire in deep space (IM-1, 2024)
// ============================================================

@PART[ROE-VR900-NovaC]:FOR[xxxRP0]
{
	// RP0conf already set to true in NovaC_Parts.cfg;
	// keeping here for clarity / safety.
	%RP0conf = true
	%RSSROConfig = True

	%TechRequired = advancedUncrewedLanding

	// Cost: small modern pressure-fed engine, niche CLPS use
	%cost = 300
	%entryCost = 12000

	// Career tags — liquid bipropellant but pressure-fed
	%MODULE[ModuleTagList] { tag = EngineLiquidPF }

	// Also set on the CONFIG so the upgrade system is consistent
	@MODULE[ModuleEngineConfigs]
	{
		@CONFIG[VR900]
		{
			%techRequired = advancedUncrewedLanding
			%cost = 0
		}
	}
}


// ============================================================
// Nova-C RCS Thruster Cluster
// Cold-gas helium, 8.9 N per nozzle, 90 s vac Isp
// Shared helium pressurant supply with main engine tanks
// ============================================================

@PART[NovaC_RCS_Thruster]:FOR[xxxRP0]
{
	%RP0conf = true
	%RSSROConfig = True

	%TechRequired = advancedUncrewedLanding

	// Cost: tiny cold-gas cluster; almost all value is in the
	// lander propellant/engine system, not the RCS hardware
	%cost = 75
	%entryCost = 2500
}
