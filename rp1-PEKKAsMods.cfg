// ============================================================
// RP-1 tech tree, avionics, and career costs for PEKKAsMods
// All launchers are modern era (2010s–2020s); placed in late nodes.
// Avionics added to all command-capable stage cores.
// Pass: FOR[xxxRP0]
// ============================================================


// ============================================================
// GLOBAL — RP0conf catch-all
// RP-1 career deletes any part that lacks RP0conf = true.
// One broad patch covers every PEKKA part family so nothing
// is silently removed from the VAB.
// ============================================================

@PART[Falcon9-*,Electron-*,Alpha-*,Vulcan-*,GEM-63XL,GEM-63XL-Decoupler]:FOR[xxxRP0]
{
	%RP0conf = true
}
@PART[Raptor-*,SuperHeavy,SuperHeavy-*,Starship-*,StarshipV1-*,StarshipV2,StarshipV2-*,Helios-*,Psyche,SLC-41]:FOR[xxxRP0]
{
	%RP0conf = true
}


// ============================================================
// SECTION 1 — Falcon 9 / Falcon Heavy
// First flight: 2010 (F9 v1.0) — block 5 ~2018
// ============================================================

@PART[Falcon9-Merlin,Falcon9-MVac,Falcon9-Short-MVac]:FOR[xxxRP0]
{
	%TechRequired = veryHeavyRocketry
	%cost = 5000
	%entryCost = 150000
	%MODULE[ModuleTagList] { tag = EngineLiquidPump }
}

@PART[Falcon9-Core,Falcon9-Booster]:FOR[xxxRP0]
{
	%TechRequired = veryHeavyRocketry
	%cost = 3000
	%entryCost = 100000

	@MODULE[ModuleAvionics]
	{
		// 1,500 t covers Falcon Heavy full stack (~1,420 t liftoff)
		@massLimit = 1500
	}
}

@PART[Falcon9-UpperStage]:FOR[xxxRP0]
{
	%TechRequired = veryHeavyRocketry
	%cost = 1500
	%entryCost = 50000

	@MODULE[ModuleAvionics]
	{
		// 200 t covers Falcon Heavy upper + max LEO payload (~174 t)
		@massLimit = 200
	}
}

@PART[Falcon9-BoosterDecupler,Falcon9-Gridfin,Falcon9-LandingLeg]:FOR[xxxRP0]
{
	%TechRequired = veryHeavyRocketry
	%cost = 500
	%entryCost = 10000
}

@PART[Falcon9-Fairing,Falcon9-Fairing-R,Falcon9-E-Fairing,Falcon9-E-Fairing-R]:FOR[xxxRP0]
