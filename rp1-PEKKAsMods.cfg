// Cargo-mode payload-bay floor node (node_stack_top, the upward-facing node
// inside the bay) sat 2.486 m too low; raise it 6.5 -> 8.986 m.
// rescaleFactor = 1, so cfg coords are real metres — add the offset directly.
@PART[StarshipV2]
{
	@node_stack_top = 0.0, 8.986, 0.0, 0.0, 1.0, 0.0, 4
}

