// ============================================================
// SECTION 5 — Starship / Super Heavy
// First orbital attempt: 2023; first successful flight: 2024
// ============================================================

// FIX — keep the surface Raptors (Boost + Gimbal) from being culled.
// ROEngines' PatchManager Raptor.cfg deletes every non-ROE-* part with
// engineType=Raptor AND category=Engine. That nukes Raptor-B and Raptor-G
// (Raptor-Vacuum2 uses a different engineType so it survives). We strip the
// engineType tag AFTER the MEC config is baked in by FOR[RealismOverhaulEngines],
// so the delete condition no longer matches but the engine keeps its configs.
@PART[Raptor-B,Raptor-G]:AFTER[RealismOverhaulEngines]
{
	!engineType = DELETE
}

@PART[Raptor-B,Raptor-G,Raptor-Vacuum2]:FOR[xxxRP0]
{
	%TechRequired = veryHeavyRocketry
	%cost = 10000
	%entryCost = 300000
	%MODULE[ModuleTagList] { tag = EngineLiquidPump }
}

@PART[SuperHeavy]:FOR[xxxRP0]
{
	%TechRequired = veryHeavyRocketry
	%cost = 10000
	%entryCost = 300000

	@MODULE[ModuleAvionics]
	{
		// 6,000 t: SH+Starship ~4,900 t + payload margin
		@massLimit = 6000
	}
}

@PART[StarshipV2]:FOR[xxxRP0]
