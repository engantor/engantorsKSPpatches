// ============================================================
// RP-1 tech tree integration for Space Shuttle System
// (giuliodondi fork with realistic aerodynamics, v1.12.3v7)
//
// RP-1's TREE-Parts.cfg already covers these parts:
//   ShuttleBodyFlap, ShuttleElevonL/R, ShuttleExtTank,
//   ShuttleRocketBooster, ShuttleTail, ShuttleOMSPodL/R,
//   ShuttleSSRBBottomL/R, ShuttleSSRBDecoupler, ShuttleTailControl,
//   ShuttleSSRBTop (solids1981), ShuttleExtTank (materialsScienceSpaceplanes)
//
// This file adds RP0conf + tech nodes for all remaining parts
// that would otherwise be deleted by RP-1's career cleanup.
//
// Tech nodes match RP-1's existing Shuttle assignments:
//   spaceShuttles              — orbiter structure, crew, engines, landing
//   solids1981                 — SRBs (already covered, not repeated here)
//   largeScaleOrbitalCon       — payload bay modules (SpaceLab, SpaceHab,
//                                airlocks, Ku-band, EDO)
//
// Pass: FOR[xxxRP0]
// ============================================================


// ============================================================
// SECTION 1 — Orbiter fuselage + crew cabin
// 7 crew, ~2,000 t controllable (full Shuttle stack at liftoff).
// ============================================================

@PART[ShuttleOrbiter|ShuttleOrbiterBasicCabin]:FOR[xxxRP0]
{
	%TechRequired = spaceShuttles
	%cost = 10000
	%entryCost = 0
	%RP0conf = true

	@MODULE[ModuleAvionics]
	{
		@massLimit = 2200
	}
}


// ============================================================
// SECTION 2 — Main engines, OMS, landing gear
// ============================================================

// RS-25 / SSME
// ROEngines deletes every non-ROE-* part with engineType=SSME.
// Fix: strip the engineType tag after MEC is set up so the delete
// condition fails. Engine configs (thrust, Isp, propellants) are
// already baked into ModuleEngineConfigs before we touch engineType.
@PART[ShuttleSSME|ShuttleEngineOMS]:AFTER[RealismOverhaulEngines]
{
	!engineType = DELETE
}

@PART[ShuttleSSME]:FOR[xxxRP0]
{
	%TechRequired = spaceShuttles
	%cost = 5000
	%entryCost = 0
	%RP0conf = true
	%MODULE[ModuleTagList] { tag = EngineLiquidTurbo }
}

// OMS engine (AJ10-190 class, hypergolic)
@PART[ShuttleEngineOMS]:FOR[xxxRP0]
{
	%TechRequired = spaceShuttles
	%cost = 1000
	%entryCost = 0
	%RP0conf = true
	%MODULE[ModuleTagList] { tag = EngineLiquidPump }
}

// Main landing gear
@PART[ShuttleMainGear]:FOR[xxxRP0]
{
	%TechRequired = spaceShuttles
	%cost = 500
	%entryCost = 0
	%RP0conf = true
}


// ============================================================
// SECTION 3 — Payload bay modules
// NOTE: File names in the mod are misleading — actual part names
// were confirmed by reading each cfg directly.
//   SPACELAB.cfg             → SpaceLab
//   SPACELAB_TUNNEL.cfg      → SPACELAB_TUNNEL
//   SPACEHAB.cfg             → SpaceHab
//   SPACEHAB_SHORT.cfg       → SpaceHab_Short
//   AIRLOCK2.cfg             → AIRLOCK_SEGMENT_VERSION
//   AIRLOCK_SCIENCE_AVERAGE  → AIRLOCK_TUNNEL_AVERAGE
//   AIRLOCK_SCIENCE_SHORT    → AIRLOCK_TUNNEL_SHORT
//   AIRLOCK_SCIENCE_SHORT_MINI → AIRLOCK_TUNNEL_SHORT_MINI
//   KU.cfg                   → Space_Shuttle_KU
// ============================================================

@PART[SpaceLab|SPACELAB_TUNNEL|SpaceHab|SpaceHab_Short]:FOR[xxxRP0]
{
	%TechRequired = largeScaleOrbitalCon
	%cost = 2000
	%entryCost = 0
	%RP0conf = true
}

@PART[AIRLOCK|AIRLOCK_EVA_HATCH|AIRLOCK_EXTENSION|AIRLOCK_SEGMENT_VERSION]:FOR[xxxRP0]
{
	%TechRequired = largeScaleOrbitalCon
	%cost = 1000
	%entryCost = 0
	%RP0conf = true
}

@PART[AIRLOCK_SCIENCE_TUNNEL|AIRLOCK_TUNNEL_AVERAGE|AIRLOCK_TUNNEL_SHORT|AIRLOCK_TUNNEL_SHORT_MINI]:FOR[xxxRP0]
{
	%TechRequired = largeScaleOrbitalCon
	%cost = 1000
	%entryCost = 0
	%RP0conf = true
}

// Extended Duration Orbiter — extra cryo tankage for 16-day missions
@PART[EDO]:FOR[xxxRP0]
{
	%TechRequired = spaceShuttles
	%cost = 2000
	%entryCost = 0
	%RP0conf = true
}

// Ku-band antenna and payload palette
@PART[Space_Shuttle_KU|PALETTE]:FOR[xxxRP0]
{
	%TechRequired = spaceShuttles
	%cost = 500
	%entryCost = 0
	%RP0conf = true
}
