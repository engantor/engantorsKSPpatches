// ============================================================
// Engantor — VABOrganizer subcategory assignments
// ============================================================
//
// Covers all parts patched by the Engantor RP-1 configs:
//   rp1-KK_SpX_RP1conf.cfg       (Dragon 2, F9demo, Starlink)
//   rp1-LaunchersPack_SpX_RP1conf.cfg  (KK Launchers Pack SpaceX)
//   rp1-NovaC_RP1conf.cfg        (Nova-C lander)
//   rp1-EDBMods_RP1conf.cfg      (EDBMods FutureTech)
//   rp1-Knes_RP1conf.cfg         (KNES mod)
//
// Pass: AFTER[RP-1]
//   → same timing as VABOrganizer-RP-1 Configs patches
//   → fires after Pmborg FINAL rename, so KK original names are
//     correct targets (VABORGANIZER node survives the @name rename)
//
// Auto-handled (no entry needed here):
//   - Engine parts with ModuleEngineConfigs + CONFIG techRequired
//     → sorted automatically by 03engines.cfg
//   - ModuleDeployableSolarPanel → solarPanels
//   - ModuleDockingNode + category[Coupling] → dockingPorts
//   - ModuleAblator + category[Thermal] → heatShields
//   - ModuleRealAntenna → directional / omni
//   - Fairing names (*Fairing*) + category[Payload] → fairing
// ============================================================


// ============================================================
// SECTION 1 — KK Dragon 2 (KK_SpXCD)
// ============================================================

// Crew capsule and cargo capsule → pods
@PART[KK_SpXCD_Capsule|KK_SpXCD_Capsule_Cargo]:AFTER[RP-1]
{
	%VABORGANIZER { %organizerSubcategory = pods }
}

// Trunk sections (service module / propulsion ring) → serviceTanks
@PART[KK_SpXCD_Trunk|KK_SpXCD_Trunk_Cargo]:AFTER[RP-1]
{
	%VABORGANIZER { %organizerSubcategory = serviceTanks }
}

// Docking port cover → coupling (leave category auto-handling as-is)
// Drogue/main chute covers → utility (no override needed)


