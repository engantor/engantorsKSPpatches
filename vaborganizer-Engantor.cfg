// SECTION 15 — L3S / Ariane 1–4 family (VABOrganizer)
// ============================================================

// Ariane 1-4 avionics / OBC guidance units → probes
@PART[Knes_Command_Minus|_Knes_L3S_AR4_Avionics|_Knes_L3S_Avionics_250]:AFTER[RP-1]
{
	%VABORGANIZER { %organizerSubcategory = probes }
}

// VEGA AVUM avionics → probes
@PART[_Knes_Vega_Avum_Avionics_125]:AFTER[RP-1]
{
	%VABORGANIZER { %organizerSubcategory = probes }
}

// L3S aerodynamic fin → procWings
@PART[_Knes_L3S_Fin]:AFTER[RP-1]
{
	%VABORGANIZER { %organizerSubcategory = procWings }
}

// Ariane 1 L33 first-stage tank → serviceTanks
@PART[_Knes_L3S_L33]:AFTER[RP-1]
{
	%VABORGANIZER { %organizerSubcategory = serviceTanks }
}

// Ariane 4 core and liquid strap-on stages → serviceTanks
@PART[_Knes_L3S_L140|_Knes_L3S_L220|_Knes_L3S_L220N|_Knes_L3S_PAL]:AFTER[RP-1]
{
	%VABORGANIZER { %organizerSubcategory = serviceTanks }
}

// L3S cryogenic upper-stage tanks (H4, H8, H10, H22, H45, LH2-125) → serviceTanks
@PART[Knes_Fuel_Tanks_1875_H10|_Knes_L3S_H4|_Knes_L3S_H8|_Knes_L3S_H22|_Knes_L3S_H45|_Knes_L3S_Cryo_LH2_125]:AFTER[RP-1]
{
	%VABORGANIZER { %organizerSubcategory = serviceTanks }
}

// Ariane 5 small cryo tank → serviceTanks
@PART[Knes_Fuel_Tanks_Small]:AFTER[RP-1]
{
	%VABORGANIZER { %organizerSubcategory = serviceTanks }
}

// Ariane 2/3 PAP solid strap-ons → smallsolids
@PART[_Knes_L3S_PAP]:AFTER[RP-1]
{
	%VABORGANIZER { %organizerSubcategory = smallsolids }
}

// Ariane 4 P40 solid strap-ons (~40 t) → mediumsolids
@PART[_Knes_L3S_P40]:AFTER[RP-1]
{
	%VABORGANIZER { %organizerSubcategory = mediumsolids }
}

// Ariane 5 P35 and VEGA P80 (~35-88 t) → mediumsolids
@PART[Knes_Booster_P35|Knes_Booster_P80]:AFTER[RP-1]
{
	%VABORGANIZER { %organizerSubcategory = mediumsolids }
}

// Ariane 6 P120E enhanced booster (~175 t) → largesolids
@PART[_Knes_L3S_P120E]:AFTER[RP-1]
{
	%VABORGANIZER { %organizerSubcategory = largesolids }
}

// Stage separation motors → tinysolids
@PART[_Knes_L3S_Separatron]:AFTER[RP-1]
{
	%VABORGANIZER { %organizerSubcategory = tinysolids }
}

// SafeSystem LES adapters → tinysolids (solid-propellant abort motors)
@PART[Knes_Utility_SafeSystem_1875|Knes_Utility_SafeSystem]:AFTER[RP-1]
{
	%VABORGANIZER { %organizerSubcategory = tinysolids }
}


// ============================================================
// SECTION 16 — Diamant / L3S / VEGA europe bulkhead
// BulkheadsCountry.cfg catches 'europe' for explicit ROEngines
// part names only.  All new KNES-native parts need coverage here.
// The existing _Knes_L3S_* wildcard in Section 13 already covers
// L3S parts; this entry fills the gaps for Diamant, H-engines,
// VEGA, and the extra Ariane 5 parts.
// ============================================================

@PART[_Knes_Diamant*|_Knes_H2_*|_Knes_H3_*|_Knes_Topaze*|_Knes_Booster_P03|_Knes_Nano_*|_Knes_Small_*|_Knes_Vega_*|_Knes_MonoProp_Engine_*|Knes_Booster_P35|Knes_Booster_P80|Knes_Fuel_Tanks_Small|Knes_Utility_SafeSystem*]:LAST[RP-1]
{
	%bulkheadProfiles += europe
}
