// ============================================================
// waterfall-Knes.cfg — Waterfall visual plume configs for KNES
// ============================================================
//
// Covers every engine and solid booster in the KNES mod that
// is not already handled by an ROEngines Waterfall config.
//
// ROEngines Waterfall applies only to ROEngines-native part names
// (ROE-HM7, ROE-Viking5, etc.).  KNES parts use their own names
// and receive no effects automatically, even when engineType is set.
//
// All parts use the compact ROWaterfall block format which is
// processed by ROEngines' ROWaterfall patcher.
//
// Organised in 9 sections:
//   1 — Ariane 5 core (Vulcain, HM7B, EPS)
//   2 — L3S / Ariane 1-4 liquid engines (Viking 5, HM4, HM60, small thrusters)
//   3 — L3S integrated stage+engine parts (L140, L220, L220N, PAL)
//   4 — Diamant liquid engines (Vexin C, H2, H3, aileron vernier)
//   5 — Ariane 5/6 large solid boosters (EAP, P120C, P120E, P80, P35)
//   6 — Ariane 2-4 solid boosters (P40, PAP)
//   7 — Diamant solid boosters (P16, Rita2, P10, Rita, Topaze, P064, P03)
//   8 — Spacecraft OMS / SM thrusters (ATV SM, Hermès Main, MRC SM Engine)
//   9 — Small separation and escape solids (Pushotron, A6 separators, Separatron, SafeSystem, MRC LES)
//
// Liquid engines:  :BEFORE[ROWaterfall]:NEEDS[Waterfall]
// Solid boosters:  :BEFORE[ROWaterfall]:NEEDS[Waterfall,SmokeScreen]
//   (hybrid system: Waterfall provides the bright core plume,
//    SmokeScreen provides the trailing smoke/particle effects)
//
// Templates reference:
//   waterfall-hydrolox-upper-1        — LH2/LOX vacuum upper-stage
//   waterfall-hydrolox-lower-3        — LH2/LOX sea-level (Vulcain class)
//   waterfall-hypergolic-UDMH-NTO-lower-1  — UDMH/NTO sea-level (Viking)
//   waterfall-hypergolic-UDMH-NTO-upper-1  — UDMH/NTO vacuum
//   waterfall-hypergolic-IRFNA-UDMH-upper-1 — IRFNA+UDMH (Vexin C)
//   waterfall-hypergolic-white-upper-1 — MMH/MON-3 pressure-fed vacuum
//   waterfall-hydrazine-monopropellant-upper-1 — monoprop hydrazine vacuum
//   rowaterfall-monopropellant-hydrazine-1 — small hydrazine thrusters
//   waterfall-hypergolic-vernier-upper-1 — tiny vernier thrusters
//   rowaterfall-hybrid-srm-1           — solid rocket (requires SmokeScreen)
//
// Glow keys:
//   ro-hydrolox-blue     — blue nozzle glow (hydrolox)
//   ro-srm               — orange nozzle glow (solid rockets)
//   ro-hypergolic-white  — white nozzle glow (hypergolics)
//   _orange              — Waterfall built-in orange glow
// ============================================================


// ============================================================
// SECTION 1 — Ariane 5 core engines (Vulcain, HM7, EPS)
// ============================================================

// Vulcain — 1145 kN LH2/LOX, turbopump, gimbal, Ariane 5 core
@PART[Knes_Engine_Vulcain]:BEFORE[ROWaterfall]:NEEDS[Waterfall]
{
    ROWaterfall
    {
        template = waterfall-hydrolox-lower-3
        audio = pump-fed-heavy-1
        position = 0,0,0
        rotation = 0, 0, 0
        scale = 1.05, 1.05, 1.05
        glow = ro-hydrolox-blue
    }
}

// HM7B "Zebulon" — 62 kN LH2/LOX, turbopump, vacuum, ESC-A upper stage
@PART[Knes_Engine_Zebulon]:BEFORE[ROWaterfall]:NEEDS[Waterfall]
{
    ROWaterfall
    {
        template = waterfall-hydrolox-upper-1
        audio = pump-fed-light-1
        position = 0,0,0
        rotation = 0, 0, 0
        scale = 0.84, 0.84, 0.84
        glow = ro-hydrolox-blue
    }
}

// EPS / Aestus — 27 kN MMH/MON-3, pressure-fed, vacuum, Ariane 5 upper stage
// Scale bumped to 0.85: the KNES EPS part is the entire EPS stage (tanks + engine,
// ~2.5 m tall after rescaleFactor 1.44), not a bare engine, so a standalone-engine
// scale like 0.55 looks undersized against the model.
@PART[Knes_Engine_EPS]:BEFORE[ROWaterfall]:NEEDS[Waterfall]
{
    ROWaterfall
    {
        template = waterfall-hypergolic-white-upper-1
        audio = pressure-fed-1
        position = 0,0,0
        rotation = 0, 0, 0
        scale = 0.85, 0.85, 0.85
        glow = ro-hypergolic-white
    }
}


